        resumo:`<h4>Panorama geral</h4>
          <p>Tradicionalmente, o Direito de Família é marcado por normas cogentes/imperativas, sendo chamado por muitos autores de <strong>"o mais público dos ramos do Direito Privado"</strong>. Após a CF/88, contudo, cresceu o espaço da autodeterminação das pessoas também no âmbito familiar — a família patriarcal, voltada à transmissão de patrimônio e poder, deu lugar à família contemporânea, cujo elo é a <strong>comunhão de vida e a afetividade</strong> (Paulo Lôbo).</p>
          <h4>Evolução da liberdade quanto à dissolução do casamento</h4>
          <ul>
            <li><strong>CC/1916, art. 315</strong>: o casamento válido só se dissolvia pela morte de um dos cônjuges (indissolúvel).</li>
            <li><strong>Lei 6.515/1977 (Lei do Divórcio)</strong>: passou a admitir o divórcio, uma única vez, após 3 anos de separação judicial (divórcio por conversão); separação judicial consensual exigia 2 anos de casamento.</li>
            <li><strong>Lei 7.841/1989</strong>: reduziu o prazo do divórcio por conversão para 1 ano e passou a admitir o divórcio direto após 2 anos de separação de fato.</li>
            <li><strong>CC/2002, art. 1.574</strong>: reduziu de 2 para 1 ano o prazo mínimo de casamento para separação judicial consensual; art. 1.639, §2º passou a admitir a <strong>alteração do regime de bens</strong> na constância do casamento (mediante autorização judicial motivada).</li>
            <li><strong>Lei 11.441/2007</strong>: permitiu separação e divórcio consensuais por <strong>escritura pública extrajudicial</strong> (sem filhos menores/incapazes).</li>
            <li><strong>EC 66/2010</strong>: eliminou qualquer requisito prévio (prazo mínimo ou separação prévia) para o divórcio, alterando o art. 226, §6º da CF — superou também a discussão de culpa pelo fim do casamento.</li>
          </ul>
          <h4>Limites à autonomia privada</h4>
          <p><strong>Art. 226, §7º/CF</strong>: "o planejamento familiar é de livre decisão do casal" — o "princípio da liberdade de escolha" é alçado a princípio constitucional (Lôbo identifica 2 vertentes: liberdade da entidade familiar frente ao Estado/sociedade, e liberdade de cada membro frente aos demais).</p>
          <blockquote><strong>Art. 1.513/CC — princípio da mínima intervenção estatal</strong>: "É defeso a qualquer pessoa, de direito público ou privado, interferir na comunhão de vida instituída pela família."</blockquote>
          <p>Apesar disso, o Direito de Família continua marcado por normas de <strong>ordem pública, cogentes e inderrogáveis</strong> pela vontade das partes (ex.: controle judicial sobre acordos de alimentos, participação obrigatória do MP). O conteúdo dessas normas cogentes, porém, mudou: da defesa da estrutura patriarcal (CC/1916) para a garantia da <strong>igualdade jurídica entre os cônjuges</strong> (art. 226, §5º/CF).</p>
          <h4>Reconhecimento da união estável — trajetória</h4>
          <ul>
            <li><strong>Súmula 380/STF (1964)</strong>: comprovada sociedade de fato entre concubinos, cabe dissolução judicial com partilha do patrimônio adquirido por esforço comum (tratamento como sociedade de fato, não como família).</li>
            <li><strong>Súmula 35/STF (1963)</strong>: reconheceu à concubina direito de indenização pela morte do consorte em acidente, desde que não houvesse impedimento para casar (concubinato puro).</li>
            <li><strong>Lei 6.015/1973</strong>: permitiu à companheira adotar o sobrenome do companheiro após 5 anos de convivência ou existência de filhos.</li>
            <li><strong>CF/88</strong>: elevou a união estável e a família monoparental a status de entidade familiar (art. 226, §§3º e 4º).</li>
            <li><strong>Lei 8.971/1994</strong>: primeira regulamentação — exigia 5 anos de convivência ou prole comum; tratou de alimentos e meação.</li>
            <li><strong>Lei 9.278/1996</strong>: dispensou o prazo mínimo e a prole comum; instituiu presunção relativa de esforço comum na aquisição onerosa de patrimônio.</li>
            <li><strong>CC/2002, arts. 1.723 a 1.727</strong>: regulamentação completa da união estável, revogando a legislação anterior — mas manteve tratamento sucessório diferenciado em relação ao casamento (retrocesso, corrigido depois pelo RE 646721/STF).</li>
            <li><strong>Resolução CNJ 175/2013</strong>: veda a recusa de habilitação, celebração de casamento civil ou conversão de união estável em casamento entre pessoas do mesmo sexo.</li>
          </ul>
          <h4>Pacto antenupcial (conceito)</h4>
          <p>O CC/2002 não o define expressamente, tratando-o como uma <strong>"convenção"</strong> (art. 1.640/CC) usada pelos nubentes quando optam por regime de bens diverso da comunhão parcial (regime legal supletivo). É instrumento de concretização da autonomia privada no Direito de Família.</p>`,
        flashcards:[
          {p:'Por que o Direito de Família é chamado de "o mais público dos ramos do Direito Privado"?', r:'Porque suas normas, por intensa preocupação protetiva do Estado, são em regra cogentes, reduzindo o alcance da autodeterminação dos membros da família.'},
          {p:'O que mudou com a EC 66/2010?', r:'Eliminou qualquer requisito prévio (prazo mínimo ou separação prévia) para a concessão do divórcio, alterando o art. 226, §6º da CF.'},
          {p:'O que permitiu a Lei 11.441/2007?', r:'Separação e divórcio consensuais por escritura pública extrajudicial, sem necessidade de processo judicial, desde que não haja filhos menores ou incapazes.'},
          {p:'O que estabelece o art. 1.513 do CC (princípio da mínima intervenção estatal)?', r:'É defeso a qualquer pessoa, de direito público ou privado, interferir na comunhão de vida instituída pela família.'},
          {p:'Qual a diferença entre as Leis 8.971/1994 e 9.278/1996 sobre união estável?', r:'A Lei 8.971/94 exigia 5 anos de convivência ou prole comum; a Lei 9.278/96 dispensou esses requisitos e instituiu presunção relativa de esforço comum na aquisição de patrimônio.'},
          {p:'O que trata o art. 1.640 do CC sobre pacto antenupcial?', r:'Que, não havendo convenção (pacto antenupcial) válida, vigora entre os cônjuges o regime da comunhão parcial de bens.'},
          {p:'Apesar da redução da intervenção estatal, o Direito de Família ainda tem normas cogentes. O que mudou no conteúdo dessas normas?', r:'Antes protegiam a estrutura patriarcal (CC/1916); hoje protegem a igualdade jurídica entre os cônjuges (art. 226, §5º/CF).'}
        ]},
      { id:'df-casamento-conceito', titulo:'Casamento: Conceito, Natureza Jurídica e Capacidade',
        resumo:`<h4>Características</h4>
          <ul>
            <li>Entidade familiar.</li>
            <li>Constituído por ato <strong>formal</strong> (instrumento) e <strong>solene</strong> (cerimônia).</li>
            <li>Estabelece comunhão de vida (afetos).</li>
            <li><strong>Dissolúvel</strong> — o divórcio é <strong>direito potestativo</strong> (não depende da concordância ou de motivo alegado pelo outro cônjuge).</li>
            <li>Civil.</li>
            <li>Hetero ou homoafetivo.</li>
            <li>Monogâmico.</li>
          </ul>
          <h4>Conceito</h4>
          <blockquote>Entidade familiar estabelecida entre duas pessoas, constituída formal e solenemente, que produz diferentes efeitos no âmbito pessoal e patrimonial dos cônjuges.</blockquote>
          <h4>Natureza jurídica</h4>
          <ul>
            <li><strong>Teoria institucionalista</strong>: o casamento é uma instituição social cujo conteúdo e efeitos são predeterminados pelo Estado/pela lei — os nubentes apenas aderem a um estatuto já fixado, sem poder de moldar livremente seus efeitos.</li>
            <li><strong>Teoria contratualista</strong>: o casamento é um contrato, fruto do livre consentimento das partes (autonomia da vontade).</li>
            <li><strong>Contrato de Direito de Família</strong>: variante da contratualista — é contrato, mas de natureza especial/sui generis, distinto dos contratos patrimoniais comuns, já que boa parte de seus efeitos pessoais não pode ser livremente definida pelas partes.</li>
            <li><strong>Teoria eclética ou mista</strong> (majoritária): combina as duas — é <strong>contratual quanto à formação</strong> (exige manifestação livre de vontade dos nubentes) e <strong>institucional quanto ao conteúdo/efeitos</strong> (predeterminados pela lei, indisponíveis pela vontade das partes).</li>
          </ul>
          <h4>Capacidade para o casamento</h4>
          <p><strong>Idade núbil: 16 anos.</strong> Atualmente <strong>não há exceção</strong> a essa idade mínima (art. 1.520/CC, na redação dada pela Lei 13.811/2019, que revogou as hipóteses de casamento abaixo dos 16 anos por gravidez ou para evitar sanção penal).</p>
          <p><strong>Entre 16 e 18 anos incompletos</strong> (núbil, mas ainda menor):</p>
          <ul>
            <li>Se não emancipados, precisam de <strong>autorização dos responsáveis legais</strong> (art. 1.517/CC).</li>
            <li>Em regra, a autorização é dada <strong>por escrito</strong> (art. 1.525, II/CC), mas se admite <strong>consentimento tácito</strong> (art. 1.555, §2º/CC).</li>
            <li>A autorização pode ser <strong>revogada até a celebração</strong> do casamento (art. 1.518/CC).</li>
            <li><strong>Divergência entre os pais</strong>: cabe ao juiz resolver o conflito (art. 1.517, parágrafo único/CC).</li>
            <li><strong>Se ambos os pais negarem</strong> a autorização: cabe <strong>suprimento judicial do consentimento</strong>, se a denegação for injusta (art. 1.519/CC). Se deferido o suprimento, expede-se <strong>alvará</strong> autorizando a celebração, que deve ser juntado aos autos do procedimento de habilitação para o casamento.</li>
          </ul>
          <p><strong>Consequência da falta de capacidade/autorização</strong>: o casamento do menor de 16 anos, e do maior de 16 e menor de 18 sem a devida autorização, é <strong>anulável</strong> (não nulo).</p>`,
        flashcards:[
          {p:'Por que o divórcio é considerado direito potestativo?', r:'Porque não depende da concordância do outro cônjuge nem da alegação de um motivo específico — basta a manifestação de vontade de quem pede.'},
          {p:'Qual a diferença entre a teoria institucionalista e a contratualista sobre a natureza jurídica do casamento?', r:'Institucionalista: efeitos predeterminados pelo Estado, sem margem de escolha dos nubentes. Contratualista: casamento é fruto do livre consentimento das partes, que moldam seus efeitos.'},
          {p:'O que caracteriza a teoria eclética (mista) sobre a natureza jurídica do casamento?', r:'É contratual quanto à formação (exige consentimento livre) e institucional quanto ao conteúdo e aos efeitos (predeterminados por lei).'},
          {p:'Qual é a idade núbil no Brasil e há exceção a ela atualmente?', r:'16 anos, sem exceção atualmente (art. 1.520/CC, após a Lei 13.811/2019).'},
          {p:'Um menor entre 16 e 18 anos precisa de quê para se casar, se não for emancipado?', r:'De autorização dos responsáveis legais (art. 1.517/CC), em regra por escrito, admitido consentimento tácito.'},
          {p:'O que ocorre se os pais divergirem sobre autorizar o casamento do filho menor?', r:'Cabe ao juiz resolver o conflito (art. 1.517, parágrafo único/CC).'},
          {p:'O que ocorre se ambos os pais negarem a autorização de forma injusta?', r:'Cabe suprimento judicial do consentimento (art. 1.519/CC); se deferido, expede-se alvará para a celebração do casamento.'},
          {p:'Qual a consequência do casamento celebrado sem a capacidade/autorização devida?', r:'O casamento é anulável (não é nulo).'}
        ]},
      { id:'df-relacoes-familiares', titulo:'Relações Familiares: Vínculo Conjugal, Parentesco e Afinidade',
        resumo:`<p>As relações familiares se dividem em 3 tipos de vínculo:</p>
          <h4>1. Vínculo conjugal ou de companheirismo</h4>
          <p>É o vínculo entre os próprios cônjuges ou companheiros. <strong>Importante</strong>: cônjuge ou companheiro <em>não são parentes</em> entre si — o vínculo conjugal é uma categoria à parte do parentesco.</p>
          <h4>2. Vínculo de parentesco</h4>
          <p><strong>Tipos, quanto à origem</strong>:</p>
          <ul>
            <li><strong>Natural</strong>: consanguinidade (derivação genética).</li>
            <li><strong>Civil</strong>: ex.: adoção.</li>
            <li><strong>Outra origem</strong>: relação socioafetiva, reprodução artificial (assistida), etc.</li>
          </ul>
          <p><strong>Linhas de parentesco</strong>:</p>
          <ul>
            <li><strong>Reta</strong>: entre ascendentes e descendentes (pais, filhos, avós, netos) — <strong>sem limitação de grau</strong>.</li>
            <li><strong>Colateral</strong>: entre pessoas que descendem de um tronco comum, sem que uma descenda da outra (irmãos, tios, primos) — parentesco reconhecido <strong>até o 4º grau</strong>.</li>
          </ul>
          <h4>3. Vínculo de afinidade</h4>
          <p>Liga cada cônjuge/companheiro aos parentes do outro. Três situações, com regras distintas quanto à extinção:</p>
          <ul>
            <li><strong>Ascendentes do cônjuge ou companheiro</strong> (ex.: sogra, sogro): o vínculo de afinidade <strong>não se extingue</strong> com a dissolução do casamento ou da união estável.</li>
            <li><strong>Descendentes do cônjuge ou companheiro</strong> (ex.: enteado): o vínculo <strong>não se extingue</strong> com a dissolução do casamento ou da união estável.</li>
            <li><strong>Irmãos do cônjuge ou companheiro</strong> (ex.: cunhado): o vínculo <strong>se extingue</strong> com a dissolução do casamento ou da união estável.</li>
          </ul>`,
        flashcards:[
          {p:'Cônjuges e companheiros são parentes entre si?', r:'Não — o vínculo entre eles é conjugal/de companheirismo, categoria distinta do parentesco.'},
          {p:'Qual a diferença entre linha reta e linha colateral de parentesco?', r:'Linha reta: ascendentes e descendentes, sem limitação de grau. Linha colateral: parentes que descendem de tronco comum sem descender um do outro (irmãos, tios, primos), reconhecida até o 4º grau.'},
          {p:'O vínculo de afinidade com a sogra/sogro se extingue com o divórcio?', r:'Não — o vínculo de afinidade com ascendentes do cônjuge/companheiro não se extingue com a dissolução do casamento ou união estável.'},
          {p:'O vínculo de afinidade com o cunhado se extingue com o divórcio?', r:'Sim — o vínculo de afinidade com os irmãos do cônjuge/companheiro se extingue com a dissolução do casamento ou união estável.'},
          {p:'Quais os 3 tipos de parentesco quanto à origem?', r:'Natural (consanguinidade), civil (ex.: adoção) e de outra origem (ex.: relação socioafetiva, reprodução artificial assistida).'},
          {p:'Cite 2 exemplos de parentesco de "outra origem" (não civil, não natural).', r:'Relação socioafetiva e reprodução artificial (assistida).'},
          {p:'O vínculo de afinidade com o enteado (descendente do cônjuge) se extingue com o divórcio?', r:'Não — não se extingue com a dissolução do casamento ou união estável.'}
        ]},
      { id:'df-impedimentos-matrimoniais', titulo:'Impedimentos Matrimoniais',
        resumo:`<h4>Conceito</h4>
          <p>São proibições que impossibilitam a realização de um casamento válido entre determinadas pessoas. São considerados <strong>defeitos graves</strong>, por se tratar de matéria proibitiva de <strong>ordem pública</strong> (resguardo do interesse público) — diferente das causas suspensivas, que tutelam interesses particulares. Os impedimentos se fundam ora em aspecto <strong>moral/social</strong>, ora <strong>biológico (eugênico/genético)</strong>, e às vezes em ambos.</p>
          <h4>Momento e legitimidade para opor</h4>
          <p>Podem ser opostos <strong>até a celebração do casamento</strong> (art. 1.522/CC), por <strong>qualquer pessoa capaz</strong>. Se o juiz ou o oficial de registro tiver conhecimento de algum impedimento, é <strong>obrigado a declará-lo</strong> de ofício (art. 1.522, parágrafo único/CC).</p>
          <h4>Rol do art. 1.521/CC — não podem casar</h4>
          <ul>
            <li><strong>I</strong> — os ascendentes com os descendentes, seja o parentesco natural ou civil.</li>
            <li><strong>II</strong> — os afins em linha reta.</li>
            <li><strong>III</strong> — o adotante com quem foi cônjuge do adotado, e o adotado com quem o foi do adotante (a doutrina considera <strong>desnecessário</strong> — já está coberto pelo inciso II).</li>
            <li><strong>IV</strong> — os irmãos (unilaterais ou bilaterais) e demais colaterais, até o <strong>3º grau inclusive</strong> (ex.: tio e sobrinha).</li>
            <li><strong>V</strong> — o adotado com o filho do adotante (também considerado <strong>desnecessário</strong> — já coberto pelo inciso IV).</li>
            <li><strong>VI</strong> — as pessoas casadas (bigamia).</li>
            <li><strong>VII</strong> — o cônjuge sobrevivente com o condenado por homicídio <strong>doloso</strong>, consumado ou tentado, contra o seu consorte.</li>
          </ul>
          <h4>Consequência</h4>
          <p>O casamento contraído com impedimento é <strong>nulo</strong> (art. 1.548, II/CC) — sanção mais grave que a das causas suspensivas. Cabe o ajuizamento de <strong>Ação Declaratória de Nulidade</strong>, proposta pelo Ministério Público ou por qualquer outro interessado (art. 1.549/CC).</p>`,
        flashcards:[
          {p:'Qual a diferença de gravidade entre impedimento e causa suspensiva?', r:'Impedimento é matéria de ordem pública, gera nulidade do casamento; causa suspensiva tutela interesse particular e gera apenas sanção patrimonial (separação obrigatória de bens), sem invalidar o casamento.'},
          {p:'Até quando pode ser oposto um impedimento matrimonial?', r:'Até a celebração do casamento (art. 1.522/CC).'},
          {p:'O juiz ou oficial de registro pode/deve agir de ofício ao saber de um impedimento?', r:'Deve — é obrigado a declará-lo de ofício (art. 1.522, parágrafo único/CC).'},
          {p:'Até que grau os colaterais são impedidos de casar entre si?', r:'Até o 3º grau inclusive (ex.: tio e sobrinha) — art. 1.521, IV/CC.'},
          {p:'O que diz o art. 1.521, VII sobre o cônjuge sobrevivente?', r:'Não pode casar com quem foi condenado por homicídio doloso, consumado ou tentado, contra seu consorte.'},
          {p:'Qual a consequência jurídica de um casamento com impedimento e quem pode arguir?', r:'É nulo (art. 1.548, II/CC); cabe Ação Declaratória de Nulidade pelo MP ou qualquer interessado (art. 1.549/CC).'}
        ]},
      { id:'df-causas-suspensivas', titulo:'Causas Suspensivas do Casamento',
        resumo:`<h4>Conceito</h4>
          <p>São <strong>defeitos menos graves</strong> em relação aos impedimentos matrimoniais: situações que <strong>desaconselham</strong> o casamento (natureza de recomendação), mas <strong>não o proíbem</strong> (art. 1.523/CC) — diferentemente dos impedimentos, que geram nulidade.</p>
          <h4>Rol do art. 1.523/CC — não devem casar</h4>
          <ul>
            <li><strong>I</strong> — o viúvo ou a viúva que tiver filho do cônjuge falecido, enquanto não fizer inventário dos bens do casal e der partilha aos herdeiros.</li>
            <li><strong>II</strong> — a viúva, ou a mulher cujo casamento se desfez por ser nulo ou ter sido anulado, até <strong>10 meses</strong> depois do começo da viuvez ou da dissolução da sociedade conjugal.</li>
            <li><strong>III</strong> — o divorciado, enquanto não houver sido homologada ou decidida a partilha dos bens do casal.</li>
            <li><strong>IV</strong> — o tutor ou curador e seus descendentes, ascendentes, irmãos, cunhados ou sobrinhos, com a pessoa tutelada ou curatelada, enquanto não cessar a tutela/curatela e não estiverem saldadas as respectivas contas.</li>
          </ul>
          <h4>Levantamento das causas suspensivas (art. 1.523, parágrafo único/CC)</h4>
          <p>É permitido aos nubentes pedir ao juiz que <strong>não lhes sejam aplicadas</strong> as causas dos incisos I, III e IV, provando a inexistência de prejuízo — respectivamente, para o herdeiro, para o ex-cônjuge e para a pessoa tutelada/curatelada. No caso do <strong>inciso II</strong>, a nubente deve provar o <strong>nascimento de filho</strong> ou a <strong>inexistência de gravidez</strong> na fluência do prazo.</p>
          <h4>Oposição</h4>
          <p><strong>Legitimidade</strong> (art. 1.524/CC): parentes e afins em <strong>linha reta</strong>, e parentes e afins em linha colateral <strong>até o 2º grau</strong> — rol <strong>exemplificativo</strong>. As causas suspensivas <strong>não podem ser declaradas de ofício</strong> pelo juiz nem pelo oficial do registro civil, pois tutelam interesses particulares — e o <strong>MP não tem legitimidade</strong> para provocá-las. <strong>Prazo</strong> (posição majoritária): 15 dias, contados da afixação do edital de proclamas no cartório.</p>
          <h4>Consequência</h4>
          <p>Imposição do regime de <strong>separação obrigatória de bens</strong> ao casamento (art. 1.641, I/CC). O casamento realizado com inobservância de causa suspensiva <strong>não é nulo, nem anulável</strong> — os cônjuges sofrem apenas essa sanção civil de natureza patrimonial.</p>`,
        flashcards:[
          {p:'Uma causa suspensiva proíbe o casamento?', r:'Não — apenas o desaconselha (recomendação); o casamento pode ser realizado, com uma sanção civil patrimonial.'},
          {p:'Quanto tempo a viúva deve aguardar para se casar, em regra, pela causa suspensiva do inciso II?', r:'10 meses depois do começo da viuvez ou da dissolução da sociedade conjugal.'},
          {p:'Como se levanta a causa suspensiva do inciso II (prazo de viuvez)?', r:'Provando o nascimento de filho ou a inexistência de gravidez na fluência do prazo.'},
          {p:'Quem tem legitimidade para opor causa suspensiva?', r:'Parentes e afins em linha reta, e parentes e afins em linha colateral até o 2º grau (rol exemplificativo) — art. 1.524/CC.'},
          {p:'O Ministério Público pode arguir causa suspensiva?', r:'Não — o MP não tem legitimidade para provocá-las, pois tutelam interesse particular, não podendo ser declaradas de ofício.'},
          {p:'Qual a consequência de se casar com inobservância de causa suspensiva?', r:'Imposição do regime de separação obrigatória de bens (art. 1.641, I/CC) — o casamento em si não é nulo nem anulável.'}
        ]},
      { id:'df-casamento-celebracao-provas', titulo:'Casamento: Formas Excepcionais, Celebração e Provas',
        resumo:`<h4>Formas excepcionais de casamento</h4>
          <ul>
            <li><strong>Casamento em moléstia grave</strong> (art. 1.539/CC).</li>
            <li><strong>Casamento nuncupativo</strong> (art. 1.540/CC) — em iminente risco de vida.</li>
            <li><strong>Casamento por procuração</strong> (art. 1.542/CC): exige <strong>instrumento público</strong>, lavrado em <strong>cartório de notas</strong>; é <strong>revogável</strong>; a procuração precisa conter <strong>poderes específicos</strong>; tem <strong>eficácia de 90 dias</strong>.</li>
          </ul>
          <h4>Das provas do casamento</h4>
          <p>O casamento celebrado no Brasil prova-se pela <strong>certidão do registro</strong> (art. 1.543/CC). Em caso de <strong>perda do registro civil</strong>, justificada a falta ou perda, é admissível qualquer outra espécie de prova — vigorando a presunção <em>in dubio pro matrimonio</em> (na dúvida, presume-se o casamento válido).</p>
          <h4>Posse do estado de casado</h4>
          <p>Elementos: <strong>nome, tratamento e fama</strong> de casado(a). <strong>Regra especial</strong> (art. 1.545/CC): o casamento de pessoas que, na posse do estado de casadas, não possam manifestar vontade ou já tenham falecido, não pode ser contestado em prejuízo da prole comum — salvo mediante certidão do Registro Civil que prove que uma delas já era casada quando contraiu o casamento impugnado. <strong>Efeitos da sentença</strong> nesses casos: <strong>retroativos</strong>.</p>
          <h4>Fases do casamento</h4>
          <p><strong>1) Habilitação</strong> (arts. 1.525 a 1.532/CC; art. 67 da Lei de Registros Públicos, na redação da Lei 14.382/2022): procedimento <strong>administrativo</strong> (não judicial) que objetiva verificar a presença de todos os elementos exigidos em lei, especialmente quanto à: <strong>capacidade para casar</strong> (16 anos); <strong>existência de impedimento</strong> (aferida a partir da oposição por qualquer pessoa capaz); e <strong>existência de causa suspensiva</strong> (que resulta na separação obrigatória de bens, e não impede a habilitação). Local: <strong>Cartório de Registro Civil das Pessoas Naturais</strong> da residência de qualquer dos nubentes. Fases da habilitação: <strong>(1)</strong> requerimento e apresentação da documentação; <strong>(2)</strong> editais de proclamas; <strong>(3)</strong> registro e expedição da certidão de habilitação — que tem <strong>eficácia de 90 dias</strong> para os nubentes se casarem (observar as alterações trazidas pela Lei de Registros Públicos, que simplificou o procedimento — art. 67 e seguintes).</p>
          <p><strong>2) Celebração</strong> (arts. 1.533 a 1.542/CC):</p>
          <ul>
            <li><strong>Local</strong>: regra — sede do cartório, com toda publicidade, a portas abertas. Exceção: outro prédio público ou particular, mantida a publicidade. Os nubentes podem casar em <strong>qualquer serventia de registro civil de sua livre escolha</strong>, independentemente de onde foi feita a habilitação (art. 67, §1º da Lei de Registros Públicos).</li>
            <li><strong>Testemunhas</strong>: regra — 2 (parentes ou não). Se o casamento for em prédio particular, ou se algum dos nubentes não souber ou não puder escrever: <strong>4 testemunhas</strong> (parentes ou não).</li>
            <li><strong>Momento da celebração</strong> (posição majoritária): o casamento se realiza logo após a manifestação de vontade dos nubentes — o juiz apenas <strong>declara</strong> o casamento já constituído.</li>
            <li><strong>Suspensão da cerimônia</strong> (art. 1.538/CC): será imediatamente suspensa se algum contraente <strong>(I)</strong> recusar a solene afirmação de sua vontade, <strong>(II)</strong> declarar que ela não é livre e espontânea, ou <strong>(III)</strong> manifestar-se arrependido. <strong>Parágrafo único</strong>: quem der causa à suspensão não pode se retratar no mesmo dia.</li>
            <li><strong>Registro</strong>: tem como único objetivo dar <strong>publicidade</strong> ao ato (efeitos perante terceiros) — dele se extrai a certidão de casamento.</li>
          </ul>
          <p><strong>Autoridade celebrante</strong>: civil — Juiz de Paz ou Juiz de Direito. Também é possível a <strong>celebração religiosa com efeitos civis</strong> (art. 1.515/CC), com habilitação anterior à celebração (art. 1.516, §1º) ou habilitação posterior à celebração (art. 1.516, §2º).</p>
          <h4>Casamento no exterior</h4>
          <ul>
            <li><strong>Autoridade consular brasileira</strong>: quando ambos os nubentes forem brasileiros — prova-se pela certidão expedida pelo consulado.</li>
            <li><strong>Autoridades estrangeiras</strong>: quando um ou ambos forem estrangeiros — prova-se conforme a lei do país da celebração, pelo princípio de direito internacional privado <em>locus regit actum</em> (a lei local rege os atos ali praticados), nos termos do art. 13 da LINDB.</li>
            <li><strong>Registro no Brasil</strong> (art. 1.544/CC): prazo de <strong>180 dias</strong>, a contar da volta de um ou de ambos ao Brasil, no cartório do domicílio ou, na sua falta, no 1º Ofício da Capital do Estado em que passarem a residir. Objetivo: apenas dar publicidade (efeitos perante terceiros) — <strong>a validade do casamento no Brasil independe do registro</strong>.</li>
          </ul>`,
        flashcards:[
          {p:'A habilitação para o casamento é procedimento judicial ou administrativo, e onde ocorre?', r:'É procedimento administrativo, realizado no Cartório de Registro Civil das Pessoas Naturais da residência de qualquer dos nubentes.'},
          {p:'Quais as 3 fases da habilitação para o casamento?', r:'Requerimento e apresentação da documentação; editais de proclamas; registro e expedição da certidão de habilitação.'},
          {p:'Quais os requisitos do casamento por procuração?', r:'Instrumento público lavrado em cartório de notas, com poderes específicos; a procuração é revogável e tem eficácia de 90 dias.'},
          {p:'Como se prova o casamento celebrado no Brasil, em regra?', r:'Pela certidão do registro (art. 1.543/CC); em caso de perda justificada do registro, admite-se qualquer outra prova (presunção in dubio pro matrimonio).'},
          {p:'Quais os 3 elementos da posse do estado de casado?', r:'Nome, tratamento e fama.'},
          {p:'Quantas testemunhas são exigidas na celebração do casamento, em regra, e quando esse número muda?', r:'Regra: 2 testemunhas. Se em prédio particular, ou se algum nubente não souber/puder escrever: 4 testemunhas.'},
          {p:'Segundo a posição majoritária, quando o casamento efetivamente se realiza?', r:'Logo após a manifestação de vontade dos nubentes — o juiz apenas declara o casamento já constituído.'},
          {p:'Quais as 3 hipóteses do art. 1.538/CC que suspendem a cerimônia de casamento?', r:'Recusa da solene afirmação de vontade; declaração de que a vontade não é livre e espontânea; manifestação de arrependimento.'},
          {p:'Qual o único objetivo do registro do casamento?', r:'Dar publicidade ao ato — produzir efeitos perante terceiros.'},
          {p:'Como se prova o casamento de brasileiros celebrado no exterior perante autoridade consular brasileira?', r:'Pela certidão de casamento expedida pelo consulado.'},
          {p:'Qual o princípio aplicável ao casamento de estrangeiros celebrado no exterior, e onde está previsto?', r:'Locus regit actum (a lei local rege os atos ali praticados) — art. 13 da LINDB.'},
          {p:'Qual o prazo para registrar no Brasil o casamento celebrado no exterior, e a partir de quando conta?', r:'180 dias, a contar da volta de um ou de ambos os cônjuges ao Brasil (art. 1.544/CC).'}
        ]},
      { id:'df-casamento-inexistencia', titulo:'Planos do Casamento: Existência (Teoria do Casamento Inexistente)',
        resumo:`<h4>Origem da teoria</h4>
          <p>Desenvolvida por <strong>Zachariae</strong> (escritor alemão do séc. XIX), ao comentar o Código Civil francês de 1804, cujo art. 146 estabelece que a ausência absoluta de consentimento obsta a formação do casamento. Raciocínio: se não há <strong>nenhum</strong> consentimento (diferente de consentimento defeituoso), o suporte fático nem chega a entrar no mundo jurídico — logo, a hipótese seria de <strong>inexistência</strong>, não de nulidade. A teoria surgiu para contornar o princípio <em>pas de nullité sans texte</em> (não há invalidade sem texto de lei) diante de hipóteses que não se enquadravam nos casos legais de nulidade/anulabilidade. Foi trazida ao Brasil por <strong>Pontes de Miranda</strong>. Depois passou a ser aplicada a negócios jurídicos em geral, não só ao casamento.</p>
          <h4>Situação no Brasil</h4>
          <p><strong>Não há previsão legal</strong> de casamento inexistente — é <strong>construção doutrinária</strong>. O CC optou por tratar apenas os planos da validade e da eficácia, sem regular expressamente o plano da existência. Consequência prática: a declaração de inexistência não exige ação ordinária de nulidade/anulabilidade (que pressupõem a realidade jurídica do casamento) — cabe <strong>ação meramente declaratória</strong>, sem prazo prescricional ou decadencial (pode ser proposta a qualquer tempo).</p>
          <blockquote><strong>Ressalva doutrinária</strong>: para autores como Sílvio Rodrigues, Maria Berenice Dias e Maria Helena Diniz, a teoria seria inútil, pois a situação poderia ser resolvida pelas regras de invalidade do casamento (art. 166, I/CC). Essa posição, porém, <strong>não prevalece</strong> na doutrina e jurisprudência majoritárias.</blockquote>
          <h4>Hipóteses de casamento inexistente (doutrina)</h4>
          <ul>
            <li><strong>Ausência total de consentimento</strong> (não confundir com consentimento viciado, que gera invalidade — art. 1.550, III/CC). Exemplos: vontade manifestada sob <strong>coação absoluta/física</strong> (ex.: empurrar a cabeça do nubente para simular um aceno de "sim"); vontade manifestada por procurador sem regular procuração (ex.: mandato já extinto pela morte do mandante — art. 682, II/CC; procuração por instrumento particular; procuração sem poderes especiais; ou procuração com o prazo de 90 dias do art. 1.542, §3º já ultrapassado); e negativa expressa do consentimento por um dos nubentes que o celebrante não percebeu ou ignorou (art. 1.538/CC).</li>
            <li><strong>Celebração perante autoridade absolutamente incompetente</strong> (<em>ratione materiae</em>) — é pressuposto de existência do casamento ser celebrado por autoridade legalmente investida (Juiz de Direito, Juiz de Paz, autoridade eclesiástica que atenda às exigências legais, ou autoridade consular). Casamento celebrado por delegado de polícia, promotor ou particular <strong>não ingressa no mundo jurídico</strong>. Já a incompetência <strong>em razão da pessoa ou do lugar</strong> (relativa) não gera inexistência, e sim <strong>anulabilidade</strong> (art. 1.550, VI/CC). O casamento religioso sem as formalidades do art. 1.515/CC também é inexistente.
              <br><em>Exceção — teoria da aparência (art. 1.554/CC)</em>: subsiste o casamento celebrado por quem, mesmo sem competência legal, exercia publicamente e de boa-fé as funções de juiz de casamentos e registrou o ato — protege a boa-fé dos nubentes.</li>
            <li><strong>Casamento entre pessoas do mesmo sexo</strong>: antes do reconhecimento pelos tribunais superiores (2011), a doutrina o classificava como hipótese de casamento inexistente, por faltar o pressuposto (então tido como básico) de ser formado por um homem e uma mulher — entendimento superado.</li>
          </ul>`,
        flashcards:[
          {p:'Quem desenvolveu a teoria do casamento inexistente e em que contexto?', r:'Zachariae, ao comentar o art. 146 do Código Civil francês de 1804, que trata da ausência absoluta de consentimento.'},
          {p:'A teoria do casamento inexistente tem previsão legal no Brasil?', r:'Não — é construção doutrinária; o CC trata apenas dos planos da validade e da eficácia.'},
          {p:'Que tipo de ação cabe para declarar a inexistência do casamento, e há prazo?', r:'Ação meramente declaratória, sem prazo prescricional ou decadencial — pode ser proposta a qualquer tempo.'},
          {p:'Qual a diferença entre incompetência absoluta e relativa da autoridade celebrante quanto às consequências?', r:'Incompetência absoluta (ratione materiae) gera inexistência do casamento; incompetência relativa (em razão da pessoa ou do lugar) gera apenas anulabilidade (art. 1.550, VI/CC).'},
          {p:'O que protege a "teoria da aparência" do art. 1.554/CC?', r:'Mantém válido o casamento celebrado por quem exercia publicamente e de boa-fé as funções de juiz de casamentos, mesmo sem competência legal, em respeito à boa-fé dos nubentes.'},
          {p:'Qual a diferença entre ausência total de consentimento e consentimento viciado?', r:'Ausência total gera casamento inexistente; consentimento viciado (defeituoso) gera casamento inválido (anulável, art. 1.550, III/CC).'}
        ]},
      { id:'df-casamento-invalidade', titulo:'Planos do Casamento: Validade (Nulidade, Anulabilidade e Casamento Putativo)',
        resumo:`<h4>Teoria geral das invalidades aplicada ao casamento</h4>
          <p>O plano da validade se refere ao ajuste do ato às prescrições legais, principalmente quanto à exteriorização da vontade. Como negócio jurídico, o casamento segue a lógica geral (divisão entre nulo e anulável, conforme a gravidade do defeito; possibilidade de convalescimento/ratificação), mas por ter natureza <em>sui generis</em>, apresenta <strong>2 diferenças</strong> centrais em relação à teoria geral:</p>
          <ul>
            <li>O juiz <strong>não pode reconhecer a invalidade de ofício</strong> — exige-se ação ordinária própria, proposta por interessado ou pelo MP (art. 1.549/CC); não é possível decretar a nulidade de forma incidental em processo com outro objeto.</li>
            <li>Existe a possibilidade de <strong>conservação dos efeitos</strong> do casamento inválido em favor do cônjuge de boa-fé (<strong>casamento putativo</strong>, art. 1.561/CC) — o casamento nulo não declarado por sentença produz os mesmos efeitos de um casamento válido até o trânsito em julgado da ação.</li>
          </ul>
          <h4>Casamento nulo (art. 1.548/CC)</h4>
          <p><strong>Hipóteses</strong>: <strong>II</strong> — infringência de impedimento (art. 1.521/CC) — <em>(o inciso I, sobre enfermo mental sem discernimento, foi revogado pela Lei 13.146/2015 — Estatuto da Pessoa com Deficiência)</em>.</p>
          <p><strong>Legitimidade</strong>: qualquer interessado ou o Ministério Público. <strong>Prazo</strong>: não há — pode ser pedida a qualquer tempo. Ainda assim, o juiz não pode declará-la de ofício, exigindo ação ordinária própria (art. 1.549/CC).</p>
          <h4>Casamento anulável (art. 1.550/CC) — hipóteses, legitimidade e prazos</h4>
          <ul>
            <li><strong>I — não completou a idade núbil (16 anos)</strong>: legitimados (art. 1.552/CC) — o próprio cônjuge menor (180 dias a contar de quando completar 16 anos), seus representantes legais (180 dias do casamento) ou seus ascendentes (180 dias do casamento) — prazo geral do art. 1.560, §1º. O menor pode <strong>confirmar</strong> o casamento ao atingir a idade núbil, com autorização dos representantes ou suprimento judicial (art. 1.553/CC). Se resultou <strong>gravidez</strong>, o casamento não pode ser anulado por motivo de idade (art. 1.551/CC).</li>
            <li><strong>II — menor em idade núbil sem autorização do representante legal</strong>: legitimados e prazos (art. 1.555/CC) — o próprio incapaz (180 dias, contados de quando cessar a incapacidade), seus representantes legais (180 dias do casamento) ou seus herdeiros necessários — ascendentes, descendentes e cônjuge (180 dias da morte do incapaz). Admite-se <strong>consentimento tácito</strong> dos representantes (art. 1.555, §2º/CC). Também aqui, gravidez impede a anulação por motivo de idade (art. 1.551/CC).</li>
            <li><strong>III — vício da vontade (erro essencial ou coação, arts. 1.556 a 1.558)</strong>:
              <ul>
                <li><strong>Erro essencial sobre a pessoa do outro cônjuge</strong> (arts. 1.556 e 1.557): requisitos — erro essencial (substancial o bastante para influenciar a vontade), anterior ao casamento, ignorado por quem foi enganado, e que torne insuportável a vida em comum depois de conhecido. Hipóteses do art. 1.557: <strong>(I)</strong> identidade, honra e boa fama; <strong>(II)</strong> ignorância de crime anterior ao casamento que torne insuportável a vida conjugal; <strong>(III)</strong> ignorância de defeito físico irremediável (que não caracterize deficiência) ou de moléstia grave e transmissível por contágio/herança capaz de pôr em risco a saúde do cônjuge/descendência — a jurisprudência não admite erro essencial por fumar, beber, religião diferente, temperamento nervoso, contracepção, vida sexual pregressa ou ideias políticas; já prostituição anterior ignorada e vício em tóxicos já foram admitidos pelos tribunais. Legitimidade: <strong>somente o cônjuge que incidiu em erro</strong>. Convalidação: a coabitação, com ciência do vício, valida o ato (exceto nas hipóteses do inciso III do art. 1.557). Prazo decadencial: <strong>3 anos</strong>, da data do casamento.</li>
                <li><strong>Coação</strong> (art. 1.558/CC): requisitos — ser a causa determinante do casamento; ser grave e injusta; ser atual e iminente; recair sobre um dos cônjuges, ambos ou sua família; intensidade suficiente para macular a vontade. Legitimidade: <strong>somente o cônjuge coagido</strong>. Convalidação: coabitação voluntária após o casamento valida o ato. Prazo decadencial: <strong>4 anos</strong>, da data do casamento.</li>
              </ul>
            </li>
            <li><strong>IV — incapaz de consentir ou manifestar de modo inequívoco o consentimento</strong>: prazo de 180 dias a contar da celebração; legitimado — qualquer interessado.</li>
            <li><strong>V — realizado por mandatário sem que soubesse da revogação do mandato</strong>, sem coabitação posterior: legitimados — os cônjuges; prazo de 180 dias a contar de quando o mandante souber da celebração.</li>
            <li><strong>VI — incompetência relativa da autoridade celebrante</strong> (em razão da pessoa ou do lugar — se for absoluta/ratione materiae, é hipótese de <strong>inexistência</strong>, não de anulabilidade): legitimado — qualquer interessado; prazo de <strong>2 anos</strong> a contar da celebração.</li>
          </ul>
          <h4>Casamento putativo (art. 1.561/CC)</h4>
          <p>É o casamento inválido (nulo ou anulável) que, para o(s) cônjuge(s) de <strong>boa-fé</strong>, produz efeitos pessoais e patrimoniais desde a celebração até o trânsito em julgado da sentença de invalidade. Boa-fé = desconhecimento da causa de invalidade (erro de fato ou de direito — art. 139, III/CC), ou impossibilidade de evitá-la (caso de coação). Momento de verificação da boa-fé: a <strong>celebração</strong>.</p>
          <ul>
            <li><strong>Ambos de boa-fé</strong>: o casamento produz todos os efeitos, para os cônjuges e os filhos, até a sentença anulatória.</li>
            <li><strong>Apenas um de boa-fé</strong> (§1º): os efeitos civis só aproveitam a ele e aos filhos.</li>
            <li><strong>Ambos de má-fé</strong> (§2º): os efeitos civis só aproveitam aos filhos.</li>
          </ul>
          <p>Quem deu causa à anulação por culpa perde as vantagens obtidas do cônjuge inocente e deve cumprir as promessas do pacto antenupcial (art. 1.564/CC). A sentença de nulidade <strong>retroage à data da celebração</strong>, sem prejudicar direitos de terceiros de boa-fé adquiridos a título oneroso, nem coisa julgada (art. 1.563/CC).</p>
          <h4>Síntese dos planos jurídicos possíveis</h4>
          <ul>
            <li>Existir, ser válido e eficaz — casamento regular entre pessoas capazes e desimpedidas.</li>
            <li>Existir, ser inválido e ineficaz — ex.: casamento entre irmãos, com ciência do vício por ambos.</li>
            <li>Existir, ser inválido, porém eficaz — casamento putativo (boa-fé gera eficácia por decisão judicial).</li>
          </ul>`,
        flashcards:[
          {p:'Quais as 2 principais diferenças entre a invalidade do casamento e a teoria geral das invalidades dos negócios jurídicos?', r:'O juiz não pode decretar a invalidade de ofício (exige ação ordinária própria); e existe a figura do casamento putativo, que preserva os efeitos em favor do cônjuge de boa-fé.'},
          {p:'Qual a única hipótese vigente de casamento nulo (art. 1.548/CC)?', r:'Infringência de impedimento matrimonial (art. 1.521/CC) — a hipótese do enfermo mental sem discernimento foi revogada pela Lei 13.146/2015.'},
          {p:'Há prazo para pedir a nulidade do casamento?', r:'Não — pode ser pedida a qualquer tempo, mas exige ação ordinária própria, pois o juiz não pode declará-la de ofício.'},
          {p:'Qual o prazo decadencial para anular o casamento por erro essencial, e por coação?', r:'3 anos da data do casamento por erro essencial; 4 anos da data do casamento por coação.'},
          {p:'O que valida (convalida) o casamento anulável por erro essencial ou por coação?', r:'A coabitação com ciência do vício (erro essencial) ou a coabitação voluntária após o casamento (coação) — exceto nas hipóteses dos incisos III e IV do art. 1.557 quanto ao erro.'},
          {p:'Qual a diferença entre incompetência relativa e absoluta da autoridade celebrante, quanto às consequências e prazo?', r:'Relativa (pessoa ou lugar): anulável, prazo de 2 anos. Absoluta (matéria): inexistência do casamento, sem prazo.'},
          {p:'O que é o casamento putativo e qual o momento de verificação da boa-fé?', r:'É o casamento inválido que produz efeitos para o cônjuge de boa-fé até o trânsito em julgado da sentença de invalidade; a boa-fé é verificada no momento da celebração.'},
          {p:'O que ocorre se ambos os cônjuges estavam de má-fé ao casar (art. 1.561, §2º)?', r:'Os efeitos civis do casamento só aproveitam aos filhos.'},
          {p:'A partir de quando retroagem os efeitos da sentença de nulidade do casamento?', r:'À data da celebração do casamento (art. 1.563/CC), sem prejudicar direitos de terceiros de boa-fé a título oneroso, nem coisa julgada.'}
        ]},
      { id:'df-casamento-eficacia', titulo:'Planos do Casamento: Eficácia (Efeitos Pessoais, Patrimoniais e Regime de Bens)',
        resumo:`<h4>Efeitos pessoais</h4>
          <ul>
            <li><strong>Mudança do estado civil</strong>: solteiro → casado (e, depois, viúvo ou divorciado).</li>
            <li><strong>Emancipação</strong> do cônjuge menor.</li>
            <li><strong>Presunção legal de paternidade</strong>.</li>
            <li><strong>Estabelecimento do vínculo de afinidade</strong> com os parentes do cônjuge.</li>
            <li><strong>Deveres recíprocos dos cônjuges</strong> (art. 1.566/CC): <strong>I</strong> — fidelidade recíproca; <strong>II</strong> — vida em comum no domicílio conjugal; <strong>III</strong> — mútua assistência (pode gerar pensão alimentícia); <strong>IV</strong> — sustento, guarda e educação dos filhos; <strong>V</strong> — respeito e consideração mútuos. Segundo Rolf Madaleno, hoje esses deveres <strong>perderam relevância jurídica prática</strong> — seu descumprimento não gera consequência jurídica automática, funcionando mais como recomendação ética/moral/social, com exceção do dever de mútua assistência material, que mantém sanção jurídica (alimentos).</li>
          </ul>
          <h4>Efeitos patrimoniais — Regime de bens</h4>
          <blockquote><strong>Conceito</strong>: complexo de normas que regula as relações patrimoniais entre os cônjuges (ou companheiros, na união estável) — propriedade, administração e disponibilidade dos bens presentes e futuros, e responsabilidades entre si e perante terceiros —, conforme opção do casal por pacto antenupcial ou por disposição legal.</blockquote>
          <p><strong>Tipos de regime</strong> (rol <strong>exemplificativo</strong>, não taxativo — art. 1.639/CC, respeitadas as normas de ordem pública, art. 1.655/CC):</p>
          <ul>
            <li><strong>Comunhão parcial de bens</strong> — <strong>regime supletivo legal atual</strong> (aplicado na ausência ou invalidade de pacto antenupcial, art. 1.640/CC), desde 27/12/1977 (Lei do Divórcio, Lei 6.515/1977).</li>
            <li><strong>Comunhão universal de bens</strong> — foi o regime supletivo legal do CC/1916, até a Lei do Divórcio.</li>
            <li><strong>Separação de bens</strong>: pode ser <strong>obrigatória</strong> (art. 1.641/CC — ex.: casamento de maior de 70 anos, inciso II) ou <strong>convencional</strong> (por pacto antenupcial).</li>
            <li><strong>Participação final nos aquestos</strong> — regime hoje em desuso na prática.</li>
          </ul>
          <h4>Pacto antenupcial</h4>
          <p>Objetivo principal: permitir aos nubentes escolher regime de bens diverso da comunhão parcial. É <strong>negócio jurídico solene</strong> — exige <strong>escritura pública</strong> em Cartório de Notas (art. 1.653/CC); se feito por instrumento particular, é <strong>nulo</strong>, aplicando-se então o regime supletivo legal (comunhão parcial). Sua <strong>eficácia depende da realização do casamento</strong> — não há prazo entre a lavratura do pacto e o casamento.</p>
          <p><strong>Diretrizes de formalização</strong>: <strong>(1)</strong> lavrar por escritura pública em Cartório de Notas (não exige advogado, papel apenas consultivo se houver); <strong>(2)</strong> apresentar no Cartório de Registro Civil onde tramitou a habilitação; <strong>(3)</strong> após o casamento, registrar no Cartório de Registro de Imóveis do domicílio dos cônjuges (art. 1.657/CC); <strong>(4)</strong> averbar na matrícula de todos os imóveis do casal, presentes e futuros; <strong>(5)</strong> arquivar na Junta Comercial, se os nubentes forem empresários (art. 979/CC). O item (1) é necessário para validade/eficácia entre os cônjuges e herdeiros; o item (3) dá eficácia perante terceiros (<em>erga omnes</em>); os itens (4) e (5) reforçam a segurança jurídica e a publicidade.</p>
          <p><strong>Outras cláusulas comuns em pactos</strong> (exemplos doutrinários — Maria Berenice Dias): guarda de animal de estimação em caso de rompimento; dispensa do dever de coabitação/fidelidade; quem deixaria o imóvel em caso de ruptura; questões domésticas do dia a dia; religião a ser transmitida aos filhos; proibição de divulgação de imagens/dados do outro cônjuge. <strong>Não é possível</strong> renúncia à herança em pacto antenupcial.</p>
          <h4>Direito intertemporal do regime de bens</h4>
          <p>Prevalecem, em regra, as normas vigentes na data da <strong>celebração</strong> do casamento (exceto regras de ordem pública, como a outorga conjugal). O CC/2002 entrou em vigor em <strong>11/01/2003</strong>: casamentos até <strong>10/01/2003</strong> seguem as regras do CC/1916 quanto ao regime de bens/partilha (art. 2.039/CC); a partir de <strong>11/01/2003</strong>, aplicam-se as regras do CC/2002.</p>
          <h4>Mutabilidade do regime de bens</h4>
          <p>Exige <strong>autorização judicial</strong> (jurisdição voluntária), mediante <strong>pedido bilateral</strong> (acordo dos cônjuges) e <strong>motivado</strong>, resguardados os direitos de terceiros. A sentença que autoriza a mudança tem efeitos <strong>ex nunc</strong> — o novo regime só vale a partir do trânsito em julgado.</p>
          <h4>Efeitos da separação de fato sobre o regime de bens</h4>
          <p>A separação de fato <strong>suspende a eficácia</strong> do regime de bens. Assim: o regime de bens começa a valer na <strong>data do casamento</strong> e deixa de valer na <strong>data da separação de fato</strong>.</p>`,
        flashcards:[
          {p:'Segundo Rolf Madaleno, qual dos deveres do art. 1.566/CC ainda mantém sanção jurídica prática?', r:'O dever de mútua assistência material (pode gerar obrigação de alimentos) — os demais tornaram-se recomendações sem consequência jurídica direta.'},
          {p:'Qual é o regime de bens supletivo legal atual, e desde quando?', r:'Comunhão parcial de bens, desde 27/12/1977 (Lei do Divórcio — Lei 6.515/1977).'},
          {p:'O rol de regimes de bens do Código Civil é taxativo?', r:'Não — é meramente exemplificativo (art. 1.639/CC), respeitadas as normas de ordem pública (art. 1.655/CC).'},
          {p:'O que acontece se o pacto antenupcial for celebrado por instrumento particular, e não por escritura pública?', r:'O pacto é nulo, e os cônjuges são considerados casados sob o regime supletivo legal (comunhão parcial de bens).'},
          {p:'A eficácia do pacto antenupcial depende de quê, e há prazo entre a lavratura e o casamento?', r:'Depende da realização do casamento; não há prazo fixado entre a lavratura do pacto e a celebração do casamento.'},
          {p:'É possível incluir cláusula de renúncia à herança em pacto antenupcial?', r:'Não.'},
          {p:'Qual regra de direito intertemporal se aplica a casamentos celebrados até 10/01/2003?', r:'Aplicam-se as disposições do CC/1916 quanto ao regime de bens e partilha (art. 2.039/CC) — o CC/2002 entrou em vigor em 11/01/2003.'},
          {p:'Quais os requisitos para alterar o regime de bens na constância do casamento?', r:'Autorização judicial, pedido bilateral (acordo dos cônjuges) e motivado, resguardados os direitos de terceiros.'},
          {p:'Qual o efeito temporal (ex nunc ou ex tunc) da sentença que autoriza a mudança de regime de bens?', r:'Ex nunc — o novo regime só se aplica a partir do trânsito em julgado da sentença.'},
          {p:'Qual o efeito da separação de fato sobre o regime de bens do casal?', r:'Suspende a eficácia do regime de bens — que vigora da data do casamento até a data da separação de fato.'}
        ]}
    ] },
  { id:'processo-penal', numeral:'III', nome:'Processo Penal',
    dates:{ 'AV1':'22/09/26', 'AV2':'26/10/26', 'AV Final':'23/11/26', '2ª chamada':'09/11/26', 'Especial':'07/12/26' },
    temas: [
      { id:'pp-fontes', titulo:'Fontes do Direito Processual Penal',
        resumo:`<p>Fonte é o local de onde provém algo — tudo que pertence ao Direito Processual Penal (DPP) constitui suas fontes.</p>
          <h4>Fontes formais x fontes substanciais</h4>
          <p><strong>Formais</strong>: é a própria lei, a lei escrita/materializada.</p>
          <p><strong>Substanciais</strong>: a vontade por trás da norma (todo norma tem um "desejo") — é abstrata, não comportando classificação em subtipos.</p>
          <h4>Fontes formais diretas</h4>
          <p>São as que já constituem lei pronta e acabada:</p>
          <ul>
            <li><strong>Principais</strong>: Código de Processo Penal e Constituição Federal.</li>
            <li><strong>Extravagantes</strong>: como o CPP não consegue reger todas as matérias processuais penais, surgem leis que giram em torno dele — subdivididas em <em>complementares</em> (completam o CPP) e <em>modificativas</em> (alteram o CPP: nova redação, novo parágrafo, supressão de inciso, nova interpretação).</li>
            <li><strong>Orgânicas principais</strong>: leis de organização judiciária (leis estaduais — cada unidade federativa organiza seu próprio Poder Judiciário).</li>
            <li><strong>Orgânicas complementares</strong>: regimentos internos dos tribunais (cada tribunal tem o seu).</li>
          </ul>
          <h4>Fontes formais supletivas</h4>
          <p>Ainda não são lei acabada, mas podem gerar uma lei:</p>
          <ul>
            <li><strong>Indiretas</strong> (maior proximidade com a produção da lei): costumes, jurisprudência, princípios.</li>
            <li><strong>Secundárias</strong> (menor proximidade): doutrina, direito histórico, direito estrangeiro.</li>
          </ul>`,
        flashcards:[
          {p:'Qual a diferença entre fonte formal e fonte substancial no DPP?', r:'Formal é a própria lei (escrita/materializada); substancial é a vontade/desejo por trás da norma, de natureza abstrata.'},
          {p:'Quais são as fontes formais diretas principais do DPP?', r:'Código de Processo Penal e Constituição Federal.'},
          {p:'Diferença entre fontes extravagantes complementares e modificativas?', r:'Complementares completam o CPP; modificativas o alteram (nova redação, novo parágrafo, supressão de inciso etc.).'},
          {p:'O que são fontes orgânicas principais e complementares?', r:'Principais: leis de organização judiciária (estaduais). Complementares: regimentos internos dos tribunais.'},
          {p:'Cite as fontes formais supletivas indiretas e as secundárias.', r:'Indiretas: costumes, jurisprudência, princípios. Secundárias: doutrina, direito histórico, direito estrangeiro.'}
        ]},
      { id:'pp-principios', titulo:'Princípios do Processo Penal',
        resumo:`<h4>Princípio da legalidade (obrigatoriedade)</h4>
          <p>Inspira os órgãos de persecução penal — polícia judiciária e MP — que não têm poder discricionário (juízo de oportunidade/conveniência); agem por obrigação ("escravos da lei"). Rege apenas a <strong>ação penal pública</strong> (a privada é regida pela oportunidade/conveniência — o oposto).</p>
          <blockquote><strong>Art. 5º/CPP</strong>: o inquérito policial nos crimes de ação pública será iniciado de ofício ou mediante requisição/requerimento. <strong>Art. 24/CPP</strong>: nos crimes de ação pública, a ação será promovida por denúncia do MP. O verbo "será" indica a obrigatoriedade.</blockquote>
          <p><strong>É absoluto?</strong> Para a polícia, sim (nenhum artigo prevê exceção). Para o MP, o art. 28/CPP permite arquivar o inquérito em vez de denunciar — mas isso não é discricionariedade, pois só cabe nas hipóteses legais preestabelecidas; logo, também não há exceção real ao princípio quanto ao MP.</p>
          <h4>Princípio da indisponibilidade da ação penal</h4>
          <p>Prolongamento da ausência de poder discricionário: depois de oferecida a denúncia, o MP não pode desistir dela; se recorre, não pode desistir do recurso (art. 576/CPP). O MP tem a <strong>titularidade</strong> ("dono" da ação) da ação penal pública (art. 24/CPP; art. 257, I/CPP; art. 129, I/CF), mas não a sua <strong>disponibilidade</strong> — dispor da ação seria dispor da pretensão punitiva, que é poder soberano do Estado. O MP não pode dispor da ação penal depois de proposta.</p>
          <blockquote><strong>Art. 385/CPP</strong> (juiz condenar mesmo com pedido de absolvição do MP) é considerado <strong>inconstitucional</strong> por equivaler a uma condenação de ofício sem pedido. Após o Pacote Anticrime (2019), o CPP passou a prever expressamente o sistema penal acusatório, no qual o juiz é apenas juiz — não pode condenar sem acusação —, resolvendo essa incompatibilidade.</blockquote>
          <h4>Princípio da oficialidade</h4>
          <p>A persecução penal é ação oficial/estatal (polícia judiciária e MP), aplicável apenas à ação penal pública. Dá origem a duas regras:</p>
          <ul>
            <li><strong>Autoritariedade</strong>: a persecução é sempre conduzida por uma autoridade (policial e, depois, o promotor).</li>
            <li><strong>Iniciativa de ofício</strong>: polícia e MP agem sem provocação formal — o dever de agir nasce da simples notícia do fato.</li>
          </ul>
          <h4>Princípio da publicidade</h4>
          <p>Publicidade não é divulgação — mede-se pelo acesso ao ato processual (é público porque se pode assistir). Classifica-se em <strong>ampla</strong> (acesso ilimitado) e <strong>limitada/restrita</strong> (acesso a número limitado de pessoas).</p>
          <blockquote><strong>Art. 792/CPP</strong>: as audiências serão públicas, consagrando a publicidade ampla como regra. O <strong>§1º</strong> autoriza o juiz a restringir o número de pessoas (publicidade restrita) — pergunta clássica de prova: sim, é possível ao juiz restringir a publicidade de um ato.</blockquote>
          <p><strong>Hipóteses de sigilo</strong>: art. 234-B/CPP (crimes contra a dignidade sexual); art. 20/CPP (inquérito policial — limitado pela <strong>Súmula Vinculante 14/STF</strong>, que garante ao advogado acesso aos elementos de prova já documentados no inquérito); art. 487/CPP (julgamento pelo júri é sigiloso).</p>
          <h4>Princípio do contraditório</h4>
          <p>Previsto no art. 5º/CF, mas não foi criado pela CF — apenas ganhou status de garantia fundamental. Instaura-se entre as partes.</p>
          <blockquote><strong>Art. 261/CPP</strong>: nenhum acusado, ainda que ausente ou foragido, será processado ou julgado sem defensor. <strong>Art. 263/CPP</strong>: se o acusado não tiver defensor, o juiz lhe nomeará um, ressalvado o direito de nomear outro de confiança ou se autodefender (se habilitado).</blockquote>
          <p>O <strong>1º ato do contraditório é a citação</strong>, que permite ao réu apresentar defesa. Interpretando os arts. 261 e 263 sistematicamente: o juiz deve nomear defensor sempre que necessário para que todo ato processual seja praticado com defesa presente.</p>
          <p>Duas regras decorrem do contraditório:</p>
          <ul>
            <li><strong>Igualdade processual</strong>: paridade de armas — direitos e obrigações processuais tratados isonomicamente.</li>
            <li><strong>Liberdade processual</strong>: cada parte pode arrolar e interrogar as testemunhas da outra. <strong>Antes da reforma de 2008</strong> (Lei 11.690/2008): o juiz perguntava prioritariamente, com as partes em papel secundário. <strong>Depois de 2008</strong>: inverteu-se — as partes (por seus defensores) passaram a interrogar prioritariamente, com o juiz em papel secundário, apenas complementando.</li>
          </ul>
          <p>O inquérito policial não tem contraditório, pois é ato <strong>pré-processual</strong>, não processual. A defesa ampla se divide em <strong>formal</strong> (garantia da figura do advogado/capacidade postulatória) e <strong>substancial</strong> (efetividade e qualidade da defesa).</p>
          <h4>Princípio da iniciativa das partes</h4>
          <p>O juiz nunca age de ofício — precisa de provocação. Não há jurisdição penal sem ação penal (pública, via denúncia, ou privada, via queixa).</p>
          <blockquote>O <strong>art. 26/CPP</strong> (ação penal em contravenções iniciada por auto de prisão em flagrante ou portaria da autoridade) é incompatível com o <strong>art. 129, I da CF</strong> (que atribui privativamente ao MP a promoção da ação penal pública) — como toda contravenção é matéria de ação penal pública, o art. 26/CPP não foi recepcionado pela CF e perdeu vigência.</blockquote>`,
        flashcards:[
          {p:'O princípio da legalidade/obrigatoriedade se aplica à ação penal privada?', r:'Não — rege somente a ação penal pública; a privada é regida pela oportunidade e conveniência.'},
          {p:'O art. 28 do CPP (arquivamento pelo MP) é uma exceção ao princípio da legalidade?', r:'Não — o arquivamento só cabe nas hipóteses legais preestabelecidas, não configurando discricionariedade real.'},
          {p:'O que diz o princípio da indisponibilidade da ação penal?', r:'O MP detém a titularidade, mas não a disponibilidade da ação penal pública — não pode desistir da denúncia ou de recurso já interposto (art. 576/CPP).'},
          {p:'Por que o art. 385 do CPP era considerado problemático, e o que mudou com o Pacote Anticrime?', r:'Permitia ao juiz condenar mesmo com pedido de absolvição do MP, equivalente a condenação de ofício; o Pacote Anticrime (2019) reforçou o sistema acusatório, no qual o juiz não pode condenar sem pedido.'},
          {p:'Quais as 2 regras decorrentes do princípio da oficialidade?', r:'Autoritariedade (condução por uma autoridade) e iniciativa de ofício (agir sem provocação formal, a partir da notícia do fato).'},
          {p:'O que mudou na liberdade processual com a Lei 11.690/2008?', r:'Antes de 2008, o juiz interrogava prioritariamente; depois de 2008, passaram a ser as partes (por seus defensores) que interrogam prioritariamente, com o juiz em papel secundário.'},
          {p:'É possível ao juiz restringir a publicidade de um ato processual? Com base em quê?', r:'Sim — art. 792, §1º do CPP.'},
          {p:'O que garante a Súmula Vinculante 14/STF?', r:'Acesso do advogado aos elementos de prova já documentados no inquérito policial.'},
          {p:'Qual é o 1º ato do contraditório no processo penal?', r:'A citação.'},
          {p:'Hoje, quem interroga prioritariamente as testemunhas: o juiz ou as partes?', r:'As partes (por meio de seus defensores) — o juiz tem papel secundário, apenas qualificando partes e testemunhas.'},
          {p:'Existe contraditório no inquérito policial?', r:'Não — é ato pré-processual, não processual.'},
          {p:'Por que o art. 26 do CPP não foi recepcionado pela CF?', r:'Porque previa início de ação penal por portaria/auto de prisão em contravenções, mas o art. 129, I da CF atribui privativamente ao MP a promoção da ação penal pública, e toda contravenção é ação penal pública.'}
        ]},
      { id:'pp-conceito-finalidade', titulo:'Conceito e Finalidade do Direito Processual Penal',
        resumo:`<h4>A relação processual</h4>
          <p>De um lado, o <strong>Estado</strong>, titular da <strong>pretensão punitiva</strong>; de outro, o <strong>indivíduo</strong>, titular do <em>status libertatis</em> (direito à liberdade). O processo busca uma <strong>decisão justa</strong>, que só se alcança <strong>encontrando a verdade</strong> dos fatos. Representa-se essa relação por um triângulo: o <strong>Estado-juiz</strong> no vértice, e na base o <strong>autor</strong> (MP, na ação pública, ou o ofendido, na ação privada) e o <strong>réu</strong>.</p>
          <h4>Finalidade da pena</h4>
          <p>Castigo, função pedagógica e reeducação — refletem o objetivo do processo penal de, ao final, apurar a infração e aplicar (ou não) uma pena.</p>
          <h4>Duas definições de Direito Processual Penal</h4>
          <blockquote><strong>Definição 1 (mais antiga)</strong>: conjunto de princípios e preceitos jurídicos que têm por finalidade apurar a infração penal, sua autoria, e a imposição de pena. Esquema: <em>infração penal + autoria = pena</em>, sendo o <strong>processo</strong> o caminho entre uma coisa e outra.</blockquote>
          <blockquote><strong>Definição 2 (mais completa)</strong>: conjunto de normas e princípios que regulam a aplicação jurisdicional do direito penal objetivo, a sistematização dos órgãos de jurisdição e seus auxiliares, bem como da persecução penal.</blockquote>
          <p><strong>Observações importantes</strong>: a <strong>medida de segurança</strong> também é objeto do DPP (não apenas a pena); o <strong>inquérito policial não é processo</strong>, mas integra o Direito Processual Penal (é fase pré-processual regulada por ele); a <strong>organização judiciária penal</strong> também é matéria de DPP.</p>
          <h4>Poderes probatórios do juiz (art. 156/CPP)</h4>
          <p>A prova da alegação incumbe a quem a fizer (ônus da prova das partes), mas é facultado ao juiz, de ofício: <strong>(I)</strong> ordenar, mesmo antes de iniciada a ação penal, a produção antecipada de provas urgentes e relevantes; <strong>(II)</strong> determinar, no curso da instrução, diligências para dirimir dúvida sobre ponto relevante.</p>`,
        flashcards:[
          {p:'Quem ocupa o vértice do triângulo processual penal, e quem ocupa a base?', r:'Vértice: Estado-juiz. Base: o autor (MP ou ofendido) e o réu.',},
          {p:'O que representa o "status libertatis" do indivíduo frente à pretensão punitiva do Estado?', r:'O direito à liberdade do indivíduo, que se contrapõe à pretensão punitiva estatal — a decisão justa busca equilibrar os dois, a partir da busca da verdade.'},
          {p:'Segundo a definição mais antiga de DPP, qual a equação entre infração, autoria e pena?', r:'Infração penal + autoria = pena, sendo o processo o caminho entre uma coisa e outra.'},
          {p:'O inquérito policial é processo?', r:'Não — mas integra o Direito Processual Penal, como fase pré-processual.'},
          {p:'O que faculta o art. 156 do CPP ao juiz, de ofício?', r:'Ordenar produção antecipada de provas urgentes mesmo antes da ação penal, e determinar diligências para dirimir dúvida relevante no curso da instrução.'}
        ]},
      { id:'pp-persecucao-acao-penal', titulo:'Persecução Penal e Classificação da Ação Penal',
        resumo:`<h4>Agir do Estado = Persecução Penal</h4>
          <p><strong>1ª fase — Polícia Judiciária</strong> (art. 4º/CPP): instaura e conduz o <strong>Inquérito Policial</strong> (investigativo, pré-processual).</p>
          <p><strong>2ª fase — Ministério Público</strong>: promove a ação penal pública por meio da <strong>denúncia</strong> (art. 46/CPP). <strong>Prazo para oferecer a denúncia</strong>: 5 dias se o indiciado estiver preso, 15 dias se solto — contados do recebimento do inquérito policial ou de peças de informação equivalentes.</p>
          <h4>Fases da ação penal pública</h4>
          <ol>
            <li><strong>Oferecimento da denúncia</strong> pelo MP → marca o início da ação penal.</li>
            <li><strong>Juízo de admissibilidade</strong> pelo juiz.</li>
            <li><strong>Recebimento da denúncia</strong> → <strong>citação</strong> do réu → aí <strong>surge o processo</strong>.</li>
          </ol>
          <h4>Jus puniendi x Pretensão punitiva</h4>
          <p><em>Jus puniendi</em>: direito genérico e abstrato do Estado de punir. <strong>Pretensão punitiva</strong>: quando esse direito se torna específico e é submetido a juízo (concretiza-se em um caso).</p>
          <h4>Ação penal como mecanismo</h4>
          <p>A ação penal é o mecanismo condutor da pretensão punitiva ao Judiciário (art. 100, <em>caput</em>/CPP).</p>
          <h4>Classificação: pública e privada</h4>
          <table style="width:100%; border-collapse:collapse; font-size:0.85rem;">
          <tr style="border-bottom:1px solid #8A6B3B;"><th style="text-align:left; padding:4px;">Pública</th><th style="text-align:left; padding:4px;">Privada</th></tr>
          <tr><td style="padding:4px;">Titular: Ministério Público</td><td style="padding:4px;">Titular: representante legal/ofendido</td></tr>
          <tr><td style="padding:4px;">Instrumento: <strong>denúncia</strong></td><td style="padding:4px;">Instrumento: <strong>queixa-crime</strong></td></tr>
          </table>
          <p><strong>Como saber se a ação é pública ou privada</strong>: a <strong>ação penal pública é a regra</strong>; a <strong>ação penal privada é a ressalva</strong>, cabível apenas quando expressamente prevista em lei — é exercício privativo do ofendido.</p>
          <h4>Ação penal pública (art. 24/CPP)</h4>
          <ul>
            <li><strong>Incondicionada</strong>: regra geral — quando a lei silencia sobre a necessidade de condição, a denúncia pode ser oferecida diretamente pelo MP.</li>
            <li><strong>Condicionada</strong>: quando a lei expressamente exigir <strong>representação do ofendido</strong> ou <strong>requisição do Ministro da Justiça</strong>.</li>
          </ul>
          <p><strong>Representação do ofendido</strong>: funciona como <strong>condição de procedibilidade</strong> — é uma manifestação de vontade do ofendido autorizando o MP a agir (sem ela, o MP não pode oferecer denúncia nos crimes que a exigem).</p>`,
        flashcards:[
          {p:'Quais as 2 fases da persecução penal e quem as conduz?', r:'1ª fase: Polícia Judiciária, com o Inquérito Policial. 2ª fase: Ministério Público, que promove a ação penal por meio da denúncia.'},
          {p:'Qual o prazo para o MP oferecer a denúncia, conforme o réu esteja preso ou solto?', r:'5 dias se preso, 15 dias se solto (art. 46/CPP).'},
          {p:'Em que momento surge o processo penal?', r:'No recebimento da denúncia seguido da citação do réu.'},
          {p:'Qual a diferença entre jus puniendi e pretensão punitiva?', r:'Jus puniendi é o direito genérico e abstrato de punir; pretensão punitiva é quando esse direito se concretiza em um caso específico, submetido a juízo.'},
          {p:'Qual a regra e qual a exceção entre ação penal pública e privada?', r:'Ação penal pública é a regra; a privada é a ressalva, cabível apenas quando expressamente prevista em lei, sendo exercício privativo do ofendido.'},
          {p:'O que é a representação do ofendido na ação penal pública condicionada?', r:'É uma manifestação de vontade do ofendido que funciona como condição de procedibilidade, autorizando o MP a agir.'}
        ]},
      { id:'pp-interpretacao-aplicacao-tempo', titulo:'Interpretação da Norma Processual Penal e sua Aplicação no Tempo',
        resumo:`<h4>Formas de interpretação (quanto à origem/fonte)</h4>
          <ul>
            <li><strong>Autêntica</strong>: dada pelo próprio legislador.</li>
            <li><strong>Doutrinária</strong>: dos estudiosos — força livre e criadora, sem efeito vinculante.</li>
            <li><strong>Judicial</strong>: dada pelos tribunais. Ex.: no crime de furto (art. 155/CP — <em>caput</em> simples, §1º agravada, §2º privilegiada, §4º qualificada), pelo <strong>critério lógico</strong> o privilégio do §2º não se aplicaria à forma qualificada do §4º (por estar topograficamente antes) — mas a <strong>jurisprudência não aplica esse critério lógico</strong>, admitindo a combinação.</li>
          </ul>
          <h4>Formas de interpretação (quanto ao modo/meio)</h4>
          <ul>
            <li><strong>Lógica</strong>: busca a razão de ser da norma.</li>
            <li><strong>Gramatical</strong>: literalidade do texto. Ex.: o texto original do art. 4º/CPP dizia que a polícia judiciária seria exercida "no território de suas jurisdições" — tecnicamente <strong>errado</strong>, pois a polícia não tem jurisdição; interpreta-se corretamente como "circunscrições".</li>
            <li><strong>Sistemática</strong>: busca o sentido da norma no contexto do sistema em que está inserida. Ex.: o art. 28/CPP, que autoriza o MP a não oferecer denúncia (arquivamento), deve ser lido em conjunto com o restante do sistema acusatório.</li>
            <li><strong>Histórica</strong>: analisa a história da elaboração da lei.</li>
          </ul>
          <h4>Interpretação restritiva x extensiva</h4>
          <ul>
            <li><strong>Restritiva</strong> (quando a lei "vai além" do que quis dizer): art. 271/CPP — "ao assistente será permitido propor meios de prova..." — interpreta-se restritivamente para não ampliar demais os poderes do assistente de acusação.</li>
            <li><strong>Extensiva</strong> (quando a lei "fica aquém"): art. 34/CPP — o ofendido entre 18 e 21 anos tem <strong>dupla legitimidade</strong> para exercer o direito de queixa: por ele mesmo ou por seu representante legal.</li>
          </ul>
          <h4>Analogia (integração, não interpretação)</h4>
          <p>Interpretação ocorre quando a lei "diz mal" (existe norma, mas de redação problemática); <strong>analogia</strong> ocorre quando a lei "não diz" (lacuna). <strong>Requisitos</strong>: inexistência de norma legal específica aplicável ao caso; semelhança de essência entre o caso em exame e a hipótese para a qual já existe disposição legal.</p>
          <p><strong>Classificação da lacuna</strong>: <em>legis</em> (falta uma disposição legal específica para suprir a lacuna) e <em>juris</em> (a lacuna é preenchida com princípios gerais de direito).</p>
          <p><strong>Autointegração</strong>: preenche a lacuna aplicando uma norma do próprio ordenamento, criada para situação semelhante. <strong>Heterointegração</strong>: o intérprete busca a solução <strong>fora</strong> do ordenamento jurídico principal.</p>
          <h4>Aplicação da norma processual penal no tempo</h4>
          <p>A regra da <strong>lei processual</strong> no tempo é diferente da regra da <strong>lei penal material</strong> no tempo: a lei penal aplica-se sempre a mais benéfica ao acusado (podendo retroagir); já a <strong>lei processual penal</strong> (art. 2º/CPP): <strong>"aplicar-se-á desde logo, sem prejuízo da validade dos atos realizados sob a vigência da lei anterior."</strong></p>
          <ul>
            <li><strong>Regra da aplicação imediata</strong>: a lei processual entra em vigor de imediato (superado o período de <em>vacatio legis</em>), sendo <strong>irrelevante</strong> se a nova lei é mais ou menos gravosa — comporta apenas as exceções previstas em lei.</li>
            <li><strong>Exceção</strong>: art. 6º da Lei de Introdução ao Código de Processo Penal — nas ações penais em que já se tivesse iniciado a produção de prova testemunhal, o processo prosseguiria até a sentença de 1ª instância pelo rito da lei anterior (dispositivo de <strong>categoria transitória</strong>, que valeu apenas para a entrada em vigor do CPP de 1941/1946).</li>
            <li><strong>Regra da irretroatividade</strong>: a lei processual rege o futuro — os atos já praticados sob a lei antiga continuam válidos. Mas isso não impede que uma lei processual nova, editada no curso do processo, se aplique aos atos processuais futuros daquele mesmo processo (a lei pode ser posterior ao fato/crime, desde que anterior ao ato processual que rege).</li>
          </ul>
          <blockquote><strong>Pergunta clássica de prova</strong>: uma lei processual nova pode se aplicar a fatos (crimes) anteriores à sua vigência? <strong>Sim</strong> — desde que o processo ainda esteja em andamento, a nova lei processual rege os atos daí em diante.</blockquote>`,
        flashcards:[
          {p:'Qual a diferença entre interpretação autêntica, doutrinária e judicial?', r:'Autêntica: dada pelo legislador. Doutrinária: dos estudiosos, sem efeito vinculante. Judicial: dada pelos tribunais.'},
          {p:'No exemplo do furto (art. 155/CP), a jurisprudência aplica o "critério lógico" entre o privilégio (§2º) e a qualificadora (§4º)?', r:'Não — apesar de o critério lógico sugerir que o privilégio do §2º não se aplicaria à forma qualificada do §4º, a jurisprudência não aplica essa lógica, admitindo a combinação.'},
          {p:'Por que a redação original do art. 4º do CPP era tecnicamente incorreta?', r:'Porque dizia que a polícia judiciária atuava "no território de suas jurisdições", mas a polícia não tem jurisdição — o correto é "circunscrições".'},
          {p:'Qual a diferença entre interpretação restritiva e extensiva?', r:'Restritiva: aplicada quando a lei "vai além" do que deveria dizer, restringindo seu alcance (ex.: art. 271/CPP). Extensiva: aplicada quando a lei "fica aquém", ampliando seu alcance (ex.: art. 34/CPP — dupla legitimidade do ofendido entre 18-21 anos).'},
          {p:'Qual a diferença entre interpretação e analogia?', r:'Interpretação ocorre quando a lei existe mas "diz mal"; analogia (integração) ocorre quando a lei "não diz" — há lacuna.'},
          {p:'Qual a diferença entre lacuna legis e lacuna juris?', r:'Legis: falta uma disposição legal específica para suprir. Juris: a lacuna é preenchida com princípios gerais de direito.'},
          {p:'Qual a diferença entre autointegração e heterointegração?', r:'Autointegração busca a solução dentro do próprio ordenamento (norma para caso semelhante); heterointegração busca a solução fora do ordenamento jurídico principal.'},
          {p:'Qual a diferença entre a regra de aplicação no tempo da lei penal e da lei processual penal?', r:'A lei penal aplica sempre a mais benéfica ao acusado; a lei processual penal aplica-se desde logo (art. 2º/CPP), sendo irrelevante se é mais ou menos gravosa.'},
          {p:'Uma lei processual nova pode se aplicar a um crime cometido antes de sua vigência?', r:'Sim, desde que o processo ainda esteja em andamento — a nova lei rege os atos processuais praticados dali em diante.'},
          {p:'O que estabelecia a exceção do art. 6º da Lei de Introdução ao CPP?', r:'Que ações com prova testemunhal já iniciada prosseguiriam até a sentença de 1ª instância pelo rito da lei anterior — regra transitória válida apenas para a entrada em vigor do CPP.'}
        ]}
    ] },
  { id:'direito-tributario', numeral:'IV', nome:'Direito Tributário',
    dates:{ 'AV1':'24/09/26', 'AV2':'27/12/26', 'AV Final':'24/11/26', '2ª chamada':'10/11/26', 'Especial':'10/12/26' },
    temas: [
      { id:'dt-competencia-fontes', titulo:'Competência Tributária e Fontes do Direito Tributário',
        resumo:`<h4>Repartição constitucional da competência tributária</h4>
          <p>A CF distribui uma parcela do poder de tributar entre União, Estados, DF e Municípios. Tributar é instituir uma norma cuja consequência, para determinada conduta, é a entrega de valor em dinheiro ao governo (ex.: ser proprietário de imóvel gera o dever de pagar IPTU).</p>
