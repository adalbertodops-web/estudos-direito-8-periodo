          <p>Junto com a competência, a CF cria limitações ao poder de tributar e veda a usurpação de competência — um ente não pode invadir a esfera de outro.</p>
          <h4>Direito tributário é matéria de competência concorrente (art. 24/CF)</h4>
          <ul>
            <li>União, Estados e DF legislam concorrentemente.</li>
            <li>A União edita <strong>normas gerais</strong>; Estados e DF fazem leis complementando essas normas gerais e adaptando às suas especificidades.</li>
            <li><strong>Municípios</strong> (art. 30/CF): competência <strong>suplementar</strong> — suplementam a legislação estadual e federal no que couber e for de interesse local.</li>
          </ul>
          <h4>Papel de cada tipo de lei</h4>
          <ul>
            <li><strong>Constituição Federal</strong>: estabelece o sistema tributário nacional (regras e princípios) e a repartição de competências.</li>
            <li><strong>Lei Complementar</strong> (art. 146/CF): função dupla — resolver potenciais conflitos de competência entre os entes (protegendo o pacto federativo) e estruturar as normas gerais do direito tributário (segurança jurídica), detalhando conceitos objetivos (o que é área urbana, o que é tributo, cobrança, extinção, prazos, responsáveis pelo pagamento etc). A LC deve descrever o fato tributável com todos os seus elementos.</li>
            <li><strong>Lei Ordinária</strong>: mecanismo, em regra, usado para efetivamente instituir o tributo (criar a obrigação concreta a partir do que a LC descreveu).</li>
          </ul>
          <blockquote><strong>Exceção do IPVA</strong>: não existe LC do IPVA, mas o STF considerou a cobrança constitucional, pois a CF já determina que 50% do IPVA vai ao município do emplacamento — cada município pertence a um único Estado, então não há risco de conflito de competência, dispensando a LC. O STF discute (sem julgamento definitivo) o problema do "emplacamento simulado" (carro emplacado em um Estado mas usado/rodando em outro), que evidenciaria a necessidade de LC. Entendimento geral do STF: a LC só é obrigatória quando há risco de conflito de competência entre entes; se não há esse risco, a LC é facultativa.</blockquote>
          <h4>Código Tributário Nacional (CTN)</h4>
          <p>O CTN é uma <strong>lei complementar</strong> recepcionada pela CF (a análise de recepção verifica se o conteúdo da norma é compatível com a Constituição — "fenômeno de conteúdo").</p>
          <blockquote><strong>Art. 3º do CTN</strong> — conceito de tributo: "Tributo é toda prestação pecuniária compulsória, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída em lei e cobrada mediante atividade administrativa plenamente vinculada."</blockquote>
          <ul>
            <li><strong>Prestação pecuniária</strong>: expressa em dinheiro ou equivalente.</li>
            <li><strong>Compulsória</strong>: a obrigação tributária nasce da lei, não da vontade — não pode ser modificada por acordo entre as partes.</li>
            <li><strong>Não constitui sanção de ato ilícito</strong>: a lei tributária incide sobre fatos lícitos — mas o dinheiro proveniente de atividade ilícita é tributável (ex.: traficante paga IPTU e IPVA).</li>
            <li><strong>Atividade administrativa plenamente vinculada</strong>: os atos de cobrança são vinculados — o agente não tem discricionariedade quanto a momento ou efeitos (sem juízo de conveniência e oportunidade).</li>
          </ul>`,
        flashcards:[
          {p:'Qual a competência dos Municípios em matéria tributária e onde está prevista?', r:'Competência suplementar (art. 30/CF) — suplementam a legislação estadual/federal no que couber e for de interesse local.'},
          {p:'Quais as duas funções da Lei Complementar em matéria tributária (art. 146/CF)?', r:'Dirimir conflitos de competência entre entes e estabelecer normas gerais de direito tributário.'},
          {p:'Por que o STF dispensou LC para o IPVA?', r:'Porque a CF já determina que 50% do IPVA vai ao município do emplacamento, eliminando o risco de conflito de competência entre entes.'},
          {p:'Quais os 4 elementos do conceito de tributo (art. 3º/CTN)?', r:'Prestação pecuniária compulsória, que não constitua sanção de ato ilícito, instituída em lei e cobrada por atividade administrativa plenamente vinculada.'},
          {p:'O dinheiro de atividade ilícita pode ser tributado? Por quê?', r:'Sim — a lei tributária incide sobre o fato gerador lícito descrito na norma, não sobre a origem lícita ou ilícita do dinheiro (ex.: traficante paga IPTU/IPVA).'},
          {p:'O que significa "atividade administrativa plenamente vinculada" na cobrança do tributo?', r:'Que o agente público não tem discricionariedade (conveniência/oportunidade) sobre a cobrança — é um ato vinculado.'}
        ]},
      { id:'dt-especies-norma', titulo:'Espécies Tributárias e Estrutura da Norma Tributária',
        resumo:`<h4>Espécies tributárias</h4>
          <ol>
            <li><strong>Impostos</strong> — o fato gerador é um fato econômico produzido e realizado pelo próprio particular. Previstos na CF: <strong>art. 153</strong> (União), <strong>art. 155</strong> (Estados), <strong>art. 156</strong> (Municípios) e, desde a Reforma Tributária (EC 132/2023), <strong>art. 156-A</strong> — o <strong>IBS</strong> (Imposto sobre Bens e Serviços). Além desses:
              <ul>
                <li><em>Impostos residuais</em> (competência da União): exigem <strong>lei complementar</strong>; o fato gerador e a base de cálculo não podem ser idênticos aos de impostos já previstos na CF; devem ser <strong>não cumulativos</strong>.</li>
                <li><em>Imposto extraordinário de guerra</em>: instituído pela União, de forma <strong>temporária e excepcional</strong>, em caso de guerra externa declarada ou iminente.</li>
                <li>Regra geral de instituição dos demais impostos: <strong>lei ordinária</strong>.</li>
              </ul>
            </li>
            <li><strong>Taxas</strong>:
              <ul>
                <li><em>Taxas de serviço público</em>: exigem serviço específico e divisível, prestado por órgão próprio, de modo que cada particular tenha a exata dimensão do quanto o serviço o beneficia. É devida pela disponibilização do serviço, independentemente do uso efetivo.</li>
                <li><em>Taxas de poder de polícia</em>: em regra exigem a efetividade do exercício do poder de polícia (o particular usar ou tirar proveito dele — ex.: emissão de passaporte). Exceção fixada pelo STF: para a atividade de <strong>fiscalização</strong>, basta que o ente tributante possua órgão específico para a fiscalização e que o contribuinte esteja sujeito a ela — não é necessário provar a fiscalização efetiva e individualizada.</li>
              </ul>
            </li>
            <li><strong>Contribuições de melhoria</strong> (art. 145, III/CF; art. 81/CTN) — vinculadas à realização de obra pública da qual decorra <strong>valorização imobiliária</strong>. Sujeitos a <strong>dois limites</strong>: <strong>limite total</strong> (a despesa total realizada com a obra) e <strong>limite individual</strong> (o acréscimo de valor que a obra resultou para cada imóvel beneficiado) — não pode exceder nenhum dos dois.</li>
            <li><strong>Contribuições especiais</strong> (art. 149/CF):
              <ul>
                <li><em>Sociais previdenciárias</em>: art. 195/CF — incidem sobre folha de salário e sobre bens/serviços (ex.: CBS).</li>
                <li><em>Sociais puras</em>: custeiam educação pública, acidente do trabalho etc. — incidem sobre receita bruta, faturamento ou valor da operação.</li>
                <li><em>CIDE</em> (intervenção no domínio econômico): instituída quando há intervenção estatal numa atividade econômica (ex.: ANATEL), para custear a atuação do órgão regulador sobre as empresas daquele setor, ou para regular mercados/financiar setores da economia.</li>
                <li><em>Corporativas/categoria profissional</em>: contribuições cobradas pelos conselhos regionais de profissões — financiam órgãos de classe e conselhos sociais.</li>
              </ul>
            </li>
            <li><strong>Empréstimo compulsório</strong> — cabível apenas por calamidade pública, guerra ou investimento público urgente; atualmente não há nenhum em vigor no Brasil (o sequestro das poupanças no Governo Collor é citado como exemplo de instituição ilegal).</li>
          </ol>
          <h4>Tributos vinculados x não vinculados</h4>
          <p><strong>Vinculados</strong> (taxas e contribuições de melhoria): o fato gerador é uma atuação estatal específica em relação ao contribuinte. <strong>Não vinculados</strong> (todo o resto — impostos, contribuições especiais, empréstimo compulsório): o fato gerador é um fato/atividade econômica do próprio particular, sem relação com atuação estatal direta.</p>
          <h4>Como identificar a natureza jurídica do tributo (art. 4º/CTN)</h4>
          <p><strong>1º passo — aspecto material</strong>: a lei descreve uma atuação estatal? Se sim → taxa ou contribuição de melhoria. Se descreve um fato do particular → pode ser imposto, contribuição especial ou empréstimo compulsório (analisar outras características).</p>
          <p><strong>2º passo — base de cálculo</strong>: se a base de cálculo forem os gastos do Estado para prestar o serviço → taxa ou contribuição de melhoria; se incidir sobre atividade econômica do particular → os demais tributos. <strong>O nome dado ao tributo é irrelevante</strong> para essa qualificação — o que importa é o fato gerador e a base de cálculo descritos na lei.</p>
          <blockquote>Se uma lei descreve, pelo aspecto material, um serviço do Estado, mas usa como base de cálculo o faturamento do particular, ela é <strong>inconstitucional</strong> — seria uma taxa com base de cálculo própria de imposto.</blockquote>
          <h4>Estrutura da norma tributária</h4>
          <p>Norma tributária = Hipótese de incidência + Consequência (obrigação tributária).</p>
          <p><strong>Elementos da hipótese de incidência (fato gerador)</strong>:</p>
          <ul>
            <li><strong>Aspecto pessoal</strong>: quem pratica o fato gerador.</li>
            <li><strong>Aspecto material</strong>: a conduta descrita pela lei que dá origem ao tributo.</li>
            <li><strong>Aspecto temporal</strong>: o momento em que se considera ocorrido o fato gerador.</li>
            <li><strong>Aspecto espacial</strong>: o local de ocorrência do fato gerador (pode ser área urbana/rural ou localidade específica).</li>
          </ul>
          <p><strong>Elementos da consequência</strong>:</p>
          <ul>
            <li><strong>Sujeito ativo</strong>: titular do crédito tributário — em regra é o mesmo titular da competência tributária; quando são pessoas diferentes, ocorre o fenômeno da <strong>parafiscalidade</strong> (um terceiro arrecada/fiscaliza o tributo, mas não é titular da competência para instituí-lo — ex.: entidades de classe profissional, como a OAB).</li>
            <li><strong>Sujeito passivo direto</strong>: o contribuinte — quem tem relação pessoal e direta com o fato gerador.</li>
            <li><strong>Sujeito passivo indireto</strong>: o responsável tributário — quem, sem praticar o fato gerador, é obrigado por lei a pagar o tributo (ex.: o espólio).</li>
          </ul>
          <p><strong>Quantificação da obrigação</strong>: <strong>base de cálculo</strong> (mensura o aspecto material do fato gerador — ex.: valor do imóvel no IPTU) e <strong>alíquota</strong> (percentual ou unidade de medida aplicado sobre a base). Alíquota <em>ad valorem</em>: percentual sobre a base de cálculo. Alíquota <em>ad mensuram</em>: unidade de medida (ex.: imposto de importação de tecido cobrado por kg; CIDE-combustíveis cobrada por litro).</p>`,
        flashcards:[
          {p:'Quais tributos são "vinculados" a uma atuação estatal?', r:'Taxas e contribuições de melhoria.'},
          {p:'Qual a diferença entre taxa de serviço público e taxa de poder de polícia quanto à efetividade?', r:'A taxa de poder de polícia, em regra, exige efetividade do exercício (uso/proveito pelo particular); o STF dispensou essa exigência apenas para a atividade de fiscalização, bastando órgão específico e sujeição do contribuinte a ela.'},
          {p:'Quais os 2 passos para identificar a natureza jurídica de um tributo (art. 4º/CTN)?', r:'1º: aspecto material (atuação estatal ou fato do particular); 2º: base de cálculo (gastos do Estado ou atividade econômica do particular).'},
          {p:'O nome dado ao tributo pela lei determina sua natureza jurídica?', r:'Não — o nome é irrelevante; o que importa é o fato gerador e a base de cálculo.'},
          {p:'O que é parafiscalidade?', r:'Quando o titular do crédito tributário (sujeito ativo) é pessoa diferente do titular da competência tributária.'},
          {p:'Diferença entre sujeito passivo direto e indireto?', r:'Direto (contribuinte) tem relação pessoal com o fato gerador; indireto (responsável) paga o tributo por força de lei, sem ter praticado o fato gerador (ex.: espólio).'},
          {p:'Diferença entre alíquota ad valorem e ad mensuram?', r:'Ad valorem é um percentual sobre a base de cálculo; ad mensuram é um valor por unidade de medida (ex.: por kg ou litro).'},
          {p:'Cite as 4 modalidades de contribuições especiais do art. 149/CF.', r:'Sociais previdenciárias, sociais puras, CIDE e corporativas/categoria profissional.'},
          {p:'Quais os 3 requisitos para a União instituir um imposto residual?', r:'Lei complementar; fato gerador e base de cálculo diferentes dos impostos já previstos na CF; não cumulatividade.'},
          {p:'Quando cabe o imposto extraordinário de guerra?', r:'Em caso de guerra externa declarada ou iminente — é temporário e excepcional.'},
          {p:'Quais os dois limites da contribuição de melhoria?', r:'Limite total (despesa total realizada com a obra) e limite individual (acréscimo de valor resultante da obra para cada imóvel beneficiado).'},
          {p:'Qual artigo constitucional prevê o IBS, criado pela Reforma Tributária (EC 132/2023)?', r:'Art. 156-A da CF.'}
        ]},
      { id:'dt-justificacao-especies', titulo:'Justificação das Espécies Tributárias e Jurisprudência sobre Taxas',
        resumo:`<h4>Teorias classificatórias dos tributos</h4>
          <p>A doutrina diverge sobre quantas espécies tributárias existem: <strong>bipartite</strong> (imposto e taxa), <strong>tripartite</strong> (a classificação do CTN: imposto, taxa e contribuição de melhoria), <strong>quadripartite</strong> (soma o empréstimo compulsório) e <strong>pentapartite</strong> — adotada pelo <strong>STF</strong> — que soma também a contribuição especial às 4 anteriores.</p>
          <p><strong>Critérios da teoria pentapartite</strong>: vinculação a uma atuação estatal; existência de destinação específica da receita; direito à restituição.</p>
          <h4>Fundamento de cobrança de cada espécie ("justificação")</h4>
          <ul>
            <li><strong>Taxa</strong>: princípio da equivalência (paga-se pelo custo/proveito de uma atuação estatal específica).</li>
            <li><strong>Imposto</strong>: capacidade contributiva.</li>
            <li><strong>Contribuição de melhoria</strong>: princípio da equivalência.</li>
            <li><strong>Empréstimo compulsório</strong>: princípio da equivalência ou capacidade contributiva, a depender do caso.</li>
            <li><strong>Contribuição social</strong>: capacidade contributiva.</li>
            <li><strong>Contribuição especial (de interesse de categorias)</strong>: referibilidade — precisa haver uma relação entre quem paga e o benefício da atuação estatal financiada.</li>
          </ul>
          <h4>Não afetação da receita de impostos (art. 167, IV/CF)</h4>
          <p>Regra: a receita de <strong>impostos</strong> não pode ser vinculada a órgão, fundo ou despesa específica. <strong>Exceções</strong>: repartição constitucional de receitas (arts. 158/159); destinação para saúde (art. 198, §2º); para manutenção e desenvolvimento do ensino (art. 212); para atividades da administração tributária (art. 37, XXII); e garantia de operações de crédito por antecipação de receita.</p>
          <h4>Taxa: base de cálculo e jurisprudência</h4>
          <p><strong>Vedação constitucional</strong> (art. 145, §2º/CF): as taxas não podem ter base de cálculo própria de impostos.</p>
          <p><strong>Exemplos julgados válidos</strong> (usam elemento que apenas mede o custo/proveito, não a capacidade econômica genérica): taxa de coleta de lixo com base na metragem do imóvel (RE 232.393); taxa de fiscalização de valores mobiliários com base no patrimônio líquido do contribuinte (ADI 453; Súmula 665/STF); taxa de controle/fiscalização de mineração com valor fixo por quantidade extraída (ADIs 4785/4786/4787); Súmula Vinculante 29/STF — é constitucional taxa que, na apuração do valor devido, tome um ou mais elementos da base de cálculo própria de imposto, desde que não haja integral identidade entre uma base e outra.</p>
          <p><strong>Exemplos julgados inválidos</strong> ou controvertidos: taxa judiciária sem limite sobre o valor da causa (Súmula 667/STF — é inconstitucional a taxa judiciária calculada sem limite sobre o valor da causa); taxa de iluminação pública (declarada inconstitucional como taxa — Súmula Vinculante 41/STF, por não ser serviço específico e divisível; hoje cobrada como <strong>contribuição</strong>, art. 149-A/CF).</p>
          <h4>Taxa x preço público (tarifa)</h4>
          <p>Serviço ligado à soberania (ex.: emissão de passaporte) ou essencial ao interesse público (ex.: coleta de lixo): cobrado como <strong>taxa</strong> (regime tributário, compulsório). Serviço público não essencial, prestado em regime de mercado (ex.: serviço postal, energia elétrica): cobrado como <strong>tarifa/preço público</strong> (regime contratual, facultativo).</p>
          <h4>Empréstimo compulsório — forma de restituição</h4>
          <p>Deve ser restituído <strong>em moeda</strong> (não em bens ou títulos), com atualização monetária (RE 175.385/STF). A Constituição não determina uma base econômica específica sobre a qual o empréstimo compulsório deva incidir.</p>
          <h4>Contribuições especiais — classificação mais detalhada</h4>
          <p><strong>Sociais</strong>: gerais (art. 149/CF) e para a seguridade social — subdivididas em nominadas (art. 195, I-V/CF), residuais (art. 195, §4º), previdenciárias (art. 195, I "a" e II) e constitucionalizadas (salário-educação, PIS/PASEP, sistema S). <strong>De intervenção no domínio econômico (CIDE)</strong>: gerais e nominadas (ex.: CIDE-combustíveis, art. 177, §4º). <strong>Corporativas</strong> e <strong>de iluminação pública</strong> (art. 149-A/CF, cobrança facultada na fatura de energia).</p>
          <p><strong>Requisitos de validade das contribuições especiais</strong>: compatibilidade entre a finalidade da norma instituidora e a finalidade constitucional; necessidade de intervenção estatal (tributo teleológico); existência de <strong>referibilidade</strong> (Tema 495/STF) — direta (contribuições de categorias profissionais/econômicas) ou indireta (contribuições sociais e CIDEs).</p>`,
        flashcards:[
          {p:'Qual teoria classificatória de tributos é adotada pelo STF?', r:'A teoria pentapartite: imposto, taxa, contribuição de melhoria, empréstimo compulsório e contribuição especial.'},
          {p:'Qual o fundamento ("justificação") da cobrança de um imposto? E de uma taxa?', r:'Imposto: capacidade contributiva. Taxa: princípio da equivalência.'},
          {p:'A receita de impostos pode ser vinculada a um fundo específico? Há exceções?', r:'Em regra não (art. 167, IV/CF); exceções: repartição constitucional de receitas, saúde, ensino, administração tributária e garantia de crédito por antecipação de receita.'},
          {p:'O que diz a Súmula Vinculante 29/STF sobre base de cálculo de taxas?', r:'É constitucional a taxa que usa um ou mais elementos da base de cálculo própria de um imposto, desde que não haja identidade integral entre as duas bases.'},
          {p:'Por que a taxa de iluminação pública foi considerada inconstitucional, e como ela é cobrada hoje?', r:'Porque não é serviço específico e divisível (Súmula Vinculante 41/STF); hoje é cobrada como contribuição (art. 149-A/CF).'},
          {p:'Qual a diferença entre taxa e tarifa (preço público)?', r:'Taxa: serviço ligado à soberania ou essencial, regime tributário e compulsório. Tarifa: serviço não essencial, regime contratual e facultativo.'},
          {p:'Como deve ser restituído o empréstimo compulsório?', r:'Em moeda, com atualização monetária (RE 175.385/STF).'},
          {p:'O que é a "referibilidade" exigida para a validade de uma contribuição especial?', r:'A relação entre quem paga a contribuição e o benefício da atuação estatal financiada por ela — pode ser direta (categorias profissionais) ou indireta (contribuições sociais e CIDEs).'}
        ]},
      { id:'dt-principios-isonomia-capacidade', titulo:'Princípios Tributários: Isonomia, Capacidade Contributiva e Neutralidade',
        resumo:`<h4>Isonomia tributária (art. 150, II/CF)</h4>
          <p>Impõe tratamento igualitário entre contribuintes que se encontrem em situação equivalente, proibindo distinções tributárias arbitrárias — trata igualmente os iguais e desigualmente os desiguais. É esse princípio que <strong>justifica cobrar mais de quem tem maior capacidade contributiva</strong> (a diferenciação, aqui, não fere a isonomia — pelo contrário, a concretiza).</p>
          <h4>Capacidade contributiva</h4>
          <p>Expressa a <strong>justiça tributária</strong>: a carga tributária deve variar de acordo com a riqueza de cada contribuinte. Manifesta-se sobre três grandezas — <strong>patrimônio, renda e consumo</strong> — por meio da <strong>alíquota</strong>, que pode ser:</p>
          <ul>
            <li><strong>Proporcional</strong>: percentual fixo, qualquer que seja a base.</li>
            <li><strong>Progressiva</strong>: percentual aumenta conforme aumenta a base (usada para tributar renda e patrimônio, ampliando a capacidade contributiva).</li>
            <li><strong>Regressiva</strong>: percentual diminui conforme aumenta a base.</li>
          </ul>
          <p><strong>Renda</strong>: deve ser tributada obrigatoriamente de forma <strong>progressiva</strong>. <strong>Consumo</strong>: rege-se pelo princípio da <strong>essencialidade</strong> — quanto mais essencial o produto, menor deve ser a carga tributária sobre ele (para não onerar desproporcionalmente quem tem menor capacidade econômica, já que todos consomem os mesmos bens essenciais).</p>
          <p><strong>Imposto pessoal</strong> (ex.: Imposto de Renda): leva em consideração características individuais do contribuinte. <strong>Imposto real</strong>: incide sobre o fato descrito na lei, independentemente das características do contribuinte.</p>
          <h4>Neutralidade tributária (art. 146-A/CF)</h4>
          <p>Determina que os impostos devem <strong>interferir o mínimo possível</strong> nas decisões de consumo, produção e investimento dos agentes econômicos — a tributação não pode desequilibrar a atividade econômica. Permite, porém, que se criem <strong>critérios especiais de tributação por lei complementar</strong> justamente para <strong>evitar desequilíbrios na concorrência</strong> entre empresas (ou seja, a neutralidade pode admitir intervenção pontual quando o objetivo é corrigir uma distorção concorrencial, e não criá-la).</p>`,
        flashcards:[
          {p:'Como a isonomia tributária justifica cobrar mais de quem tem maior capacidade contributiva?', r:'Porque a isonomia exige tratar igualmente os iguais e desigualmente os desiguais — diferenciar conforme a capacidade contributiva concretiza a isonomia, não a viola.'},
          {p:'Sobre quais 3 grandezas se manifesta a capacidade contributiva?', r:'Patrimônio, renda e consumo.'},
          {p:'Qual tipo de alíquota deve obrigatoriamente incidir sobre a renda?', r:'Alíquota progressiva.'},
          {p:'O que rege a tributação do consumo, segundo o princípio da essencialidade?', r:'Quanto mais essencial o produto, menor deve ser a carga tributária sobre ele.'},
          {p:'Qual a diferença entre imposto pessoal e imposto real?', r:'Pessoal leva em conta características individuais do contribuinte (ex.: IR); real incide sobre o fato descrito na lei, independentemente de quem o pratica.'},
          {p:'O que determina o princípio da neutralidade tributária (art. 146-A/CF)?', r:'Que os impostos interfiram o mínimo possível nas decisões econômicas dos agentes — mas admite critérios especiais por LC para evitar desequilíbrios concorrenciais.'}
        ]},
      { id:'dt-irretroatividade', titulo:'Irretroatividade Tributária',
        resumo:`<h4>Regra geral (art. 150, III, "a"/CF)</h4>
          <p>É vedado aos entes tributantes cobrar tributos em relação a fatos geradores ocorridos <strong>antes</strong> da vigência da lei que os houver instituído ou aumentado — a lei tributária <strong>não atinge fatos anteriores à sua vigência</strong> (seja para criar ou aumentar, seja para reduzir o tributo, a regra geral é a irretroatividade).</p>
          <h4>Exceções — quando a lei tributária pode retroagir</h4>
          <ul>
            <li><strong>Leis interpretativas</strong>: aquelas que apenas esclarecem o sentido de uma lei anterior, sem criar tributo novo nem aplicar penalidade — podem retroagir, pois não inovam a ordem jurídica, apenas declaram o que já era.</li>
            <li><strong>Ato não definitivamente julgado, quando a lei nova é mais benéfica</strong>: se a nova lei deixa de considerar determinado ato como infração, ou reduz a penalidade aplicável ao contribuinte, ela retroage em favor do contribuinte, desde que o caso ainda não tenha sido definitivamente julgado (retroatividade benigna, análoga à da lei penal).</li>
          </ul>`,
        flashcards:[
          {p:'O que veda o princípio da irretroatividade tributária (art. 150, III, "a"/CF)?', r:'Cobrar tributos em relação a fatos geradores ocorridos antes da vigência da lei que os instituiu ou aumentou.'},
          {p:'Uma lei tributária meramente interpretativa pode retroagir?', r:'Sim — desde que apenas esclareça o sentido de lei anterior, sem criar tributo novo nem aplicar penalidade.'},
          {p:'Em que hipótese uma lei tributária mais benéfica retroage em favor do contribuinte?', r:'Quando deixa de considerar um ato como infração, ou reduz a penalidade, e o caso ainda não foi definitivamente julgado.'}
        ]}
    ] },
  { id:'direito-administrativo', numeral:'V', nome:'Direito Administrativo',
    dates:{ 'AV1':'25/09/26', 'AV2':'30/10/26', 'AV Final':'27/11/26' },
    temas: [
      { id:'da-agentes-publicos', titulo:'Agentes Públicos: Conceito e Espécies',
        resumo:`<h4>Conceito</h4>
          <p>Agentes públicos é o gênero: todo aquele que exerce atividade em nome da Administração Pública e se coloca na condição de agente público.</p>
          <h4>Espécies</h4>
          <ul>
            <li>Agentes políticos</li>
            <li>Servidores públicos</li>
            <li>Militares</li>
            <li>Particulares em colaboração com a administração</li>
          </ul>
          <h4>Agentes políticos</h4>
          <p><strong>Doutrina inicial (antiga)</strong>: considerava agentes políticos todos que tinham alta liberdade decisória e de comando — além do Legislativo e chefes do Executivo, incluía membros do Judiciário, do MP e dos Tribunais de Contas.</p>
          <p><strong>Doutrina moderna (atual)</strong>: agentes políticos são apenas os que possuem vínculo político-eleitoral, criado por processo eleitoral — deputados estaduais e federais, vereadores, governador, prefeito, presidente, senadores, ministros de Estado, secretários estaduais e municipais.</p>
          <h4>Aplicação prática do conceito</h4>
          <ul>
            <li>O processo de responsabilização dos agentes políticos é diferente do dos demais agentes.</li>
            <li><strong>Nepotismo — Súmula Vinculante 13/STF</strong>: proíbe a nomeação de parentes consanguíneos ou por afinidade até o 3º grau (inclusive) para cargo em comissão ou função de confiança, incluindo o "nepotismo cruzado" (troca de indicações entre autoridades). <strong>Exceção</strong>: a própria SV 13 ressalva que a nomeação para cargos políticos de secretariado e ministério (agentes políticos) não é alcançada pela vedação.</li>
          </ul>
          <h4>Servidores públicos</h4>
          <ul>
            <li><strong>Servidores públicos stricto sensu (estatutários)</strong>: cargo efetivo, adquirem estabilidade após 3 anos de estágio probatório.</li>
            <li><strong>Cargo em comissão (comissionado)</strong>: direção, chefia e assessoramento; nomeação e exoneração ad nutum (sem justificativa); não adquire estabilidade.</li>
            <li><strong>Empregados públicos</strong>: regime celetista.</li>
            <li><strong>Servidores temporários</strong>: vinculados por contrato administrativo (contratação temporária de excepcional interesse público).</li>
          </ul>
          <h4>Militares</h4>
          <p>Não podem fazer greve.</p>
          <h4>Particulares em colaboração com a Administração</h4>
          <p>Não possuem vínculo de trabalho, mas representam a Administração. Exemplos: jurados do Tribunal do Júri, mesários eleitorais, estagiários, tabelião de cartório, fiscal de concurso, peritos. Categoria especial: gestor de negócios (quem, em calamidade, exerce papel que seria do Estado, como no caso da Boate Kiss).</p>`,
        flashcards:[
          {p:'O que caracteriza um agente político pela doutrina moderna?', r:'Vínculo político-eleitoral criado por processo eleitoral.'},
          {p:'O que diz a Súmula Vinculante 13/STF sobre nepotismo?', r:'Proíbe a nomeação de parentes até 3º grau (consanguíneo ou por afinidade) para cargo em comissão/função de confiança, inclusive o nepotismo cruzado.'},
          {p:'Existe exceção à SV 13 quanto a agentes políticos?', r:'Sim — a nomeação para cargos de secretariado e ministério não é alcançada pela vedação.'},
          {p:'Quanto tempo leva para um servidor estatutário efetivo adquirir estabilidade?', r:'3 anos de estágio probatório.'},
          {p:'O que significa nomeação e exoneração ad nutum do cargo em comissão?', r:'Que podem ocorrer sem necessidade de justificativa.'},
          {p:'Cite exemplos de particulares em colaboração com a Administração.', r:'Jurados do Tribunal do Júri, mesários eleitorais, estagiários, tabelião de cartório, fiscal de concurso, peritos, e o gestor de negócios em situação de calamidade.'},
          {p:'Quais as 4 espécies de agentes públicos (gênero)?', r:'Agentes políticos, servidores públicos, militares e particulares em colaboração com a administração.'}
        ]},
      { id:'da-acesso-concurso', titulo:'Acesso a Cargos Públicos e Concurso Público',
        resumo:`<h4>Direito de acesso (art. 37, I/CF)</h4>
          <p>Cargos, empregos e funções públicas são acessíveis a brasileiros e, desde a <strong>EC 19/98</strong>, também a estrangeiros, nos termos da lei.</p>
          <h4>Concurso de ingresso (art. 37, II/CF) e exceções</h4>
          <ul>
            <li><strong>Cargo em comissão e função de confiança</strong> — livre nomeação.</li>
            <li><strong>Função temporária</strong> (art. 37, IX/CF) — ex.: contratados durante a pandemia.</li>
            <li><strong>Quinto constitucional</strong> — lista sêxtupla, exige reputação ilibada e notório saber jurídico; quem ingressa se torna vitalício.</li>
          </ul>
          <h4>Prazo de validade do concurso (art. 37, III/CF)</h4>
          <p>Até 2 anos, prorrogável por igual período (1+1), contado a partir da homologação.</p>
          <h4>Prioridade dos aprovados e direito à nomeação (art. 37, IV/CF)</h4>
          <p>Havendo concurso vigente, deve-se dar prioridade a seus aprovados antes de abrir novo certame. Se, mesmo assim, forem nomeados candidatos de outro concurso "de forma excedente" às vagas do edital, os aprovados dentro do número de vagas originais têm <strong>direito subjetivo à nomeação</strong> (RE 227.480/STF; RMS 20.718/STJ).</p>
          <h4>Reservas de vagas</h4>
          <ul>
            <li><strong>PCD</strong> (art. 37, VIII/CF; art. 5º, §2º da Lei 8.112/90): 20%.</li>
            <li><strong>Pessoas pretas, pardas e indígenas</strong> (Lei 15.142/2025): 30%, com prazo de vigência de 10 anos.</li>
          </ul>
          <h4>Lei dos Concursos Públicos</h4>
          <p>Lei 14.965/2024 — regulamentação nacional dos concursos públicos; só entrará em vigor em <strong>01/01/2028</strong>.</p>
          <h4>Vedações e exame psicotécnico</h4>
          <p>Vedada distinção de critérios de admissão em razão de idade, sexo ou outros fatores sem justificativa objetiva (art. 39, §3º/CF; Súmulas 683 e 684/STF) — exceto quando a natureza do cargo justificar (ex.: policial penal para presídio masculino/feminino). Exame psicotécnico eliminatório: exige previsão legal e critérios objetivos (<strong>Súmula Vinculante 44/STF</strong>).</p>`,
        flashcards:[
          {p:'Desde quando estrangeiros podem ter acesso a cargos públicos no Brasil?', r:'Desde a EC 19/98, nos termos da lei (art. 37, I/CF).'},
          {p:'Qual o prazo de validade do concurso público e sua prorrogação?', r:'Até 2 anos, prorrogável por igual período (1+1), a partir da homologação (art. 37, III/CF).'},
          {p:'Em que consiste o direito subjetivo à nomeação dos aprovados dentro do número de vagas?', r:'Se, em vez de nomear os aprovados de um concurso vigente, forem nomeados candidatos de outro concurso de forma excedente, os primeiros têm direito subjetivo à nomeação (RE 227.480/STF; RMS 20.718/STJ).'},
          {p:'Qual o percentual de reserva de vagas para PCD em concursos federais?', r:'20% (art. 37, VIII/CF; art. 5º, §2º da Lei 8.112/90).'},
          {p:'O que estabelece a Lei 15.142/2025 sobre reserva de vagas, e por quanto tempo?', r:'Reserva de 30% das vagas para pessoas pretas, pardas e indígenas, por 10 anos.'},
          {p:'Quando a Lei dos Concursos Públicos (Lei 14.965/2024) entra em vigor?', r:'Em 01/01/2028.'},
          {p:'O que garante a Súmula Vinculante 44/STF sobre exame psicotécnico?', r:'Que ele só pode ser eliminatório em concurso público se houver previsão legal e critérios objetivos.'}
        ]},
      { id:'da-regime-remuneratorio', titulo:'Regime Remuneratório, Subsídio e Teto Remuneratório',
        resumo:`<h4>Regras gerais de remuneração</h4>
          <ul>
            <li><strong>Paridade entre poderes</strong> (art. 37, XII/CF): vencimentos do Legislativo e Judiciário não podem superar os do Executivo.</li>
            <li><strong>Fixação por lei específica e revisão geral anual</strong> (art. 37, X/CF), sempre na mesma data e sem distinção de índices.</li>
            <li><strong>Vedação de vinculação/equiparação automática</strong> de espécies remuneratórias (art. 37, XIII/CF) — reforçada pelas <strong>Súmulas Vinculantes 4</strong> (veda vincular reajustes a índices) e <strong>37</strong> (veda ao Judiciário aumentar vencimentos sob o argumento de isonomia).</li>
          </ul>
          <h4>Regime de subsídio (parcela única — art. 39, §4º/CF)</h4>
          <p>Recebem exclusivamente por subsídio, vedado qualquer acréscimo (gratificação, adicional, abono etc.): chefes do Executivo, secretários estaduais/municipais, parlamentares (senadores, deputados, vereadores), magistrados, membros dos Tribunais de Contas, MP, AGU/AGE/Defensoria Pública (art. 135/CF) e carreiras policiais (art. 144, §9º/CF).</p>
          <h4>Teto remuneratório (art. 37, XI/CF)</h4>
          <p><strong>Teto máximo nacional</strong>: subsídio dos Ministros do STF. <strong>Subtetos</strong>: no Estado — Executivo (Governador), Legislativo (Deputado Estadual, 75% do subsídio do Deputado Federal) e Judiciário (Desembargador, 90,25% do subsídio de Ministro do STF — também aplicável a MP, Procuradorias e Defensoria); no Município — Executivo (Prefeito) e Legislativo (Vereador, percentual do Deputado Estadual conforme o porte do município, sem ultrapassar o teto do Prefeito).</p>
          <p><strong>Peculiaridades</strong>: procuradores municipais vinculam-se ao teto de 90,25% do STF (RE 651.703); para magistrados, não se aplica mais o teto de 90,25% (art. 93, V/CF; ADI 3.854-MC) — mas continua valendo para os demais servidores do Judiciário; acumulação de cargos — o teto incide <strong>por cargo</strong>, isoladamente, não somado (Tema 377/STF; RE 602.043 e RE 612.975), respeitada carga horária total de até 60h semanais e compatibilidade de horários; <strong>honorários de sucumbência de advogados públicos têm natureza remuneratória e SÃO limitados ao teto</strong> — somados às demais verbas remuneratórias mensais (ADI 6135/GO e ADI 6160/AP, entre outras, e ADPF 596 no caso de SP); aposentadoria + pensão por morte podem ser acumuladas, mas a soma não pode ultrapassar o teto (Tema 359/STF).</p>
          <h4>Irredutibilidade e demais garantias</h4>
          <p>Irredutibilidade de vencimentos/subsídio (art. 37, XV/CF) é a regra geral, excepcionada apenas pelos tetos remuneratórios. <strong>Empresas estatais</strong> (empresas públicas e sociedades de economia mista) só se submetem ao teto remuneratório se receberem da Administração Pública recursos para <strong>custeio em geral ou de pessoal</strong> (art. 37, §9º/CF) — se forem financeiramente autossuficientes, seus empregados não estão sujeitos ao teto.</p>
          <h4>Direito de greve e associação sindical</h4>
          <p>Assegurados aos servidores civis (art. 37, VI e VII/CF), respeitados os serviços essenciais — MI 670/ES. <strong>Militares</strong> não podem fazer greve (art. 142, IV/CF); se o fizerem, perdem a remuneração do período.</p>
          <h4>Proibição de acumulação de cargos</h4>
          <p>Regra geral do art. 37, XVI/CF, estendida à administração indireta — empresas estatais e sociedades de economia mista (art. 37, XVII/CF; não abrange autarquias/fundações, que seguem a regra do teto). Peculiaridades: vereador que é servidor público se afasta durante a campanha e, eleito, pode acumular a remuneração dos dois cargos se houver compatibilidade de horário (art. 18, II) — o prefeito, similarmente, mas pode optar pela remuneração mais vantajosa; magistrados (art. 95, I) e membros do MP (art. 128, §5º, II, "d") só podem acumular com o magistério, com compatibilidade de horário, e o teto considera cada cargo separadamente.</p>`,
        flashcards:[
          {p:'O que veda o art. 37, XIII/CF e quais súmulas vinculantes o reforçam?', r:'Veda vinculação ou equiparação automática de espécies remuneratórias — reforçado pelas SV 4 (índices) e SV 37 (isonomia pelo Judiciário).'},
          {p:'Quem é remunerado exclusivamente por subsídio em parcela única (art. 39, §4º/CF)?', r:'Chefes do Executivo, secretários, parlamentares, magistrados, membros dos Tribunais de Contas, MP, AGU/AGE/Defensoria e carreiras policiais.'},
          {p:'Qual o teto remuneratório máximo nacional e os subtetos no âmbito estadual?', r:'Teto máximo: subsídio de Ministro do STF. Subtetos estaduais: Governador (Executivo), Deputado Estadual/75% do Federal (Legislativo), Desembargador/90,25% do STF (Judiciário, MP, Procuradorias e Defensoria).'},
          {p:'O teto remuneratório, em caso de acumulação lícita de cargos, incide sobre a soma ou sobre cada cargo?', r:'Sobre cada cargo isoladamente, não somados (Tema 377/STF).'},
          {p:'Os magistrados se submetem ao teto de 90,25% do STF?', r:'Não mais — apenas os demais servidores do Judiciário continuam sujeitos a esse subteto (art. 93, V/CF; ADI 3.854-MC).'},
          {p:'Os militares têm direito de greve?', r:'Não — art. 142, IV/CF; se fizerem greve, perdem a remuneração do período.'},
          {p:'Os honorários de sucumbência de advogados públicos entram no cálculo do teto remuneratório?', r:'Sim — o STF fixou que têm natureza remuneratória e devem ser somados às demais verbas, respeitado o teto do art. 37, XI/CF (ADI 6135/GO, ADI 6160/AP, entre outras).'},
          {p:'A proibição de acumulação de cargos se estende à administração indireta?', r:'Sim, a empresas estatais e sociedades de economia mista (art. 37, XVII/CF) — não a autarquias e fundações.'}
        ]},
      { id:'da-estabilidade-provimento', titulo:'Estabilidade, Vacância e Provimento dos Cargos Públicos',
        resumo:`<h4>Estágio probatório e estabilidade</h4>
          <p>Estágio probatório: <strong>3 anos</strong>, contados do <strong>exercício</strong> (não da posse) — sequência: nomeação → posse → exercício (art. 41, §4º/CF; Lei 8.112/90, mas Estados/Municípios podem ter regras próprias). Durante o estágio, o servidor passa por avaliação de desempenho por comissão examinadora; se reprovado, é exonerado. Aprovado, torna-se <strong>estável</strong>.</p>
          <p><strong>Estável ≠ vitalício</strong>: vitalícios são magistrados, membros do MP e Conselheiros dos Tribunais de Contas. O estável pode perder o cargo por PAD ou processo judicial; o vitalício só perde por processo judicial — e ainda goza de <strong>inamovibilidade</strong> (não pode ser removido sem sua concordância).</p>
          <h4>Hipóteses de perda do cargo (art. 41/CF)</h4>
          <ul>
            <li>Sentença judicial transitada em julgado (§1º).</li>
            <li>Processo Administrativo Disciplinar (PAD).</li>
            <li>Avaliação periódica de desempenho — depende de Lei Complementar até hoje não editada (falta de viabilidade política).</li>
            <li>Descumprimento do limite de despesas com pessoal (art. 169/CF — LRF): havendo excesso, os cortes seguem a ordem: 20% dos cargos comissionados, depois servidores não estáveis, depois servidores estáveis.</li>
          </ul>
          <h4>Direitos decorrentes da estabilidade</h4>
          <ul>
            <li><strong>Reintegração</strong> (art. 41, §2º): retorno do servidor efetivo afastado por ação judicial julgada improcedente. Se seu cargo já estiver ocupado: por servidor sem estabilidade → este é demitido e o efetivo é reconduzido; por outro servidor estável → o reintegrado tem prioridade, e o outro vai para disponibilidade ou aproveitamento.</li>
            <li><strong>Recondução</strong>, <strong>Disponibilidade</strong> (art. 41, §3º — sem vaga, o servidor fica com remuneração reduzida) e <strong>Aproveitamento</strong> (art. 30 da Lei 8.112/90 — condução a outro cargo, na falta de vaga).</li>
          </ul>
          <h4>Afastamento para mandato eletivo (art. 38/CF)</h4>
          <p>O servidor tem licença remunerada para a campanha. Se eleito, em regra se afasta do cargo efetivo (<strong>"descompatibilização"</strong>) e passa a receber pelo cargo eletivo. <strong>Prefeito</strong>: pode optar pela remuneração mais vantajosa entre os dois cargos. <strong>Vereador</strong>: pode acumular a remuneração dos dois cargos, se compatíveis os horários.</p>
          <h4>Direitos sociais dos servidores (art. 39, §3º/CF)</h4>
          <p>Estende aos ocupantes de cargo público vários direitos do art. 7º/CF (trabalhistas), podendo a lei estabelecer requisitos diferenciados de admissão conforme a natureza do cargo.</p>
          <h4>Provimento</h4>
          <p><strong>Modalidades</strong>: originário (ex.: juiz, via concurso) e derivado (evolução de carreira — ex.: desembargador, procurador de justiça). <strong>Fluxo do provimento originário</strong>: concurso → aprovação → nomeação → posse → exercício (estágio probatório de 3 anos) → estabilidade. <strong>Investidura</strong> do comissionado: nomeação/exoneração <em>ad nutum</em>.</p>
          <h4>Vacância</h4>
          <p>Gera vacância: <strong>exoneração</strong> (hipóteses sem penalidade, inclusive a pedido); <strong>demissão</strong> (sempre penalidade, decorrente de PAD ou processo judicial); <strong>aposentadoria</strong>; <strong>promoção</strong> (só gera vacância no cargo de origem para Juiz, Procurador de Justiça e Ministro); <strong>readaptação</strong> (ex.: professor que perdeu a voz é remanejado para outra função); e <strong>falecimento</strong>. Não há vacância em progressão dentro da mesma carreira (ex.: enfermeiro nível 1 → nível 2).</p>`,
        flashcards:[
          {p:'A partir de qual etapa começa a contar o estágio probatório: da posse ou do exercício?', r:'Do exercício.'},
          {p:'Qual a diferença entre servidor estável e servidor vitalício quanto à perda do cargo?', r:'O estável pode perder o cargo por PAD ou processo judicial; o vitalício só perde por processo judicial, e ainda tem inamovibilidade.'},
          {p:'Em que ordem ocorrem os cortes de pessoal quando se ultrapassa o limite de despesas da LRF?', r:'Primeiro 20% dos cargos comissionados, depois servidores não estáveis, por último servidores estáveis.'},
          {p:'O que ocorre se o cargo do servidor reintegrado estiver ocupado por outro servidor estável?', r:'O reintegrado tem prioridade sobre o cargo; o outro servidor vai para disponibilidade ou aproveitamento.'},
          {p:'O prefeito e o vereador têm o mesmo tratamento quanto à remuneração ao serem eleitos, sendo servidores públicos?', r:'Não — o prefeito escolhe a remuneração mais vantajosa; o vereador pode acumular a remuneração dos dois cargos, se compatíveis os horários.'},
          {p:'Quais eventos geram vacância no cargo público?', r:'Exoneração, demissão, aposentadoria, promoção (só para Juiz, Procurador de Justiça e Ministro), readaptação e falecimento.'},
          {p:'Qual o fluxo do provimento originário até a estabilidade?', r:'Concurso → aprovação → nomeação → posse → exercício (estágio probatório de 3 anos) → estabilidade.'}
        ]},
      { id:'da-responsabilidade-pad', titulo:'Responsabilidade dos Agentes Públicos e Processo Administrativo Disciplinar',
        resumo:`<h4>Espécies de responsabilidade</h4>
          <p>Civil, penal, administrativa, por <strong>improbidade administrativa (LIA)</strong> — específica dos agentes públicos — e <strong>política</strong> (crime de responsabilidade), esta última reservada a certos agentes.</p>
          <h4>Responsabilidade política (impeachment)</h4>
          <p>Regulada pela <strong>Lei 1.079/1950</strong> (Presidente, Vice, Ministros de Estado, Ministros do STF, membros do CNJ/CNMP, PGR e AGU) e pelo <strong>Decreto-Lei 201/1967</strong> (prefeitos e vereadores). Competência: <strong>Senado</strong> processa e julga o Presidente/Vice e Ministros de Estado (art. 52, I/CF) e Ministros do STF, membros do CNJ/CNMP, PGR e AGU (art. 52, II/CF) — presidido pelo Presidente do STF nesses casos, com condenação por 2/3 dos votos, limitada à perda do cargo com inabilitação por 8 anos. Governadores respondem por crime comum perante o <strong>STJ</strong> (art. 105, I, "a"/CF); Ministros de Estado e comandantes das Forças Armadas, membros de Tribunais Superiores e chefes de missão diplomática, por crime comum e de responsabilidade, perante o <strong>STF</strong> (art. 102, I, "c"/CF).</p>
          <h4>Comunicabilidade de instâncias</h4>
          <ul>
            <li>Quando o mesmo fato é ilícito penal e administrativo: se o réu é <strong>absolvido no penal por negativa de autoria/inexistência do fato</strong>, a absolvição repercute no administrativo; o inverso não é automático. Admite-se prova emprestada entre os processos penal e administrativo (art. 126 da Lei 8.112/90; art. 935/CC; art. 65/CP; art. 6º da Lei 13.869/2019).</li>
            <li>Quando o fato é apenas ilícito penal, fora da atividade do servidor: pela regra do <strong>art. 92/CP</strong>, crime contra a Administração Pública com pena privativa de liberdade, mesmo fora do exercício do cargo, gera perda automática do cargo (sem necessidade de PAD); outros crimes com pena privativa de liberdade de 4 anos ou mais também geram perda do cargo (Súmula 18/STF).</li>
          </ul>
          <h4>Processo Administrativo Disciplinar (art. 41/CF)</h4>
          <p><strong>Penalidades</strong>: advertência (por escrito, fica na ficha funcional como precedente); suspensão de até 30 dias (sem remuneração); suspensão de 30 a 90 dias (sem remuneração); demissão (mais grave); aposentadoria compulsória com proventos proporcionais; e cassação de aposentadoria (para quem já se aposentou após cometer o ilícito — bastante criticada, pois o servidor contribuiu para a previdência).</p>
          <h4>Sindicância</h4>
          <p>Inquérito administrativo (sem ampla defesa/contraditório) para apurar materialidade e autoria (art. 145 da Lei 8.112/90). Resultados possíveis: (1) sem materialidade nem autoria → arquivamento; (2) com materialidade, sem autoria → abre-se PAD; (3) autoria "comprovada" → pode gerar advertência ou suspensão de até 30 dias diretamente, com recurso em 15 dias — solução criticada por parte da doutrina como violação ao contraditório/ampla defesa, ainda sem posição unânime nos tribunais.</p>
          <h4>Fases do PAD</h4>
          <ol>
            <li><strong>Instauração</strong>: portaria → comissão processante (3 servidores estáveis, presidida por quem tenha grau de instrução igual ou superior ao do indiciado) — observado o princípio do juízo natural (lista pré-determinada, distribuição aleatória).</li>
            <li><strong>Produção de provas</strong>: a Comissão produz de ofício (documental, testemunhal, pericial), buscando a verdade real; o indiciado também pode requerer provas.</li>
            <li><strong>Defesa</strong>: tipificação da conduta e indicação da penalidade (libelo).</li>
            <li><strong>Relatório</strong>: a Comissão avalia e propõe a penalidade.</li>
            <li><strong>Julgamento</strong>: a autoridade julgadora, em regra, segue a proposta da Comissão, salvo irregularidade processual ou de provas (hipótese em que devolve o processo à Comissão).</li>
            <li><strong>Decisão</strong>: é decisão administrativa (não sentença), autoexecutória desde logo.</li>
            <li><strong>Recurso administrativo</strong>: admite-se <em>reformatio in pejus</em>; se a situação do indiciado piorar em grau de recurso, deve ser aberto novo prazo recursal. Nessa fase, a autoridade recursal pode usar medida cautelar para afastar o indiciado, como medida de segurança do processo.</li>
          </ol>
          <blockquote><strong>Súmula Vinculante 5/STF</strong>: a falta de defesa técnica por advogado no processo administrativo disciplinar <strong>não ofende</strong> a Constituição (posição contestada por parte da doutrina, como Romeu Felipe Bacellar Filho).</blockquote>`,
        flashcards:[
          {p:'Quem julga o Presidente da República nos crimes de responsabilidade, e quem preside a sessão?', r:'O Senado Federal (art. 52, I/CF), presidido pelo Presidente do STF.'},
          {p:'A absolvição na esfera penal sempre repercute na esfera administrativa?', r:'Só quando a absolvição se dá por negativa de autoria ou inexistência do fato — o inverso (condenação penal) não gera automaticamente repercussão administrativa idêntica.'},
          {p:'O que diz o art. 92 do CP sobre perda de cargo por crime contra a Administração Pública?', r:'Gera perda automática do cargo mesmo que o crime tenha sido cometido fora do exercício da função, dispensando PAD.'},
          {p:'Quais as penalidades do PAD, da mais branda à mais grave?', r:'Advertência, suspensão até 30 dias, suspensão de 30 a 90 dias, demissão, aposentadoria compulsória e cassação de aposentadoria.'},
          {p:'Na sindicância, o que ocorre se houver materialidade mas não se identificar a autoria?', r:'Abre-se o Processo Administrativo Disciplinar (PAD).'},
          {p:'Quais as 3 características da comissão processante que instaura o PAD?', r:'Composta por 3 servidores estáveis; o presidente deve ter grau de instrução igual ou superior ao do indiciado; distribuição por lista pré-determinada (juízo natural).'},
          {p:'O que garante a Súmula Vinculante 5/STF sobre o PAD?', r:'Que a falta de defesa técnica por advogado no PAD não ofende a Constituição.'},
          {p:'O que é a "reformatio in pejus" no recurso administrativo do PAD e qual sua consequência?', r:'É a possibilidade de a situação do indiciado piorar em grau de recurso — nesse caso, deve-se abrir novo prazo recursal.'}
        ]},
      { id:'da-aposentadoria', titulo:'Aposentadoria dos Servidores Públicos e Reformas Previdenciárias',
        resumo:`<h4>Regimes previdenciários</h4>
          <ul>
            <li><strong>RGPS</strong> (Regime Geral de Previdência Social): empregados públicos (CLT), cargos em comissão e temporários.</li>
            <li><strong>RPPS</strong> (Regime Próprio de Previdência): servidores estáveis e vitalícios — o Brasil possui 2.151 RPPS distintos.</li>
          </ul>
          <h4>Reformas previdenciárias</h4>
          <ul>
            <li><strong>EC 20/1998</strong>: instituiu o regime contributivo — antes o servidor não contribuía, aposentando-se com o salário da ativa (muitos antes dos 50 anos); hoje contribui com 11% para o RPPS.</li>
            <li><strong>EC 41/2003</strong>: extinguiu a paridade de remuneração entre ativos e inativos e extinguiu os proventos integrais automáticos.</li>
            <li><strong>EC 103/2019</strong>: tornou obrigatória a previdência complementar para novos servidores (Lei 12.618/2012).</li>
          </ul>`,
        flashcards:[
          {p:'Quem se enquadra no RGPS entre os agentes públicos?', r:'Empregados públicos (CLT), cargos em comissão e servidores temporários.'},
          {p:'Quem se enquadra no RPPS?', r:'Servidores estáveis e vitalícios.'},
          {p:'O que instituiu a EC 20/1998 em matéria previdenciária?', r:'O regime contributivo — o servidor passou a contribuir (hoje 11%) para o RPPS, o que antes não existia.'},
          {p:'O que extinguiu a EC 41/2003?', r:'A paridade de remuneração entre ativos e inativos, e os proventos integrais automáticos.'},
          {p:'O que tornou obrigatório a EC 103/2019?', r:'A previdência complementar para os novos servidores (regulamentada pela Lei 12.618/2012).'}
        ]},
      { id:'da-improbidade-administrativa', titulo:'Improbidade Administrativa',
        resumo:`<h4>Conceito e natureza</h4>
          <p>É um <strong>mecanismo punitivo aplicado no âmbito judicial</strong> (não administrativo). As sanções são de natureza <strong>civil e política</strong>, sem prejuízo das sanções penais cabíveis — <strong>improbidade não é crime</strong>.</p>
          <h4>Fundamento: princípio da probidade</h4>
          <p>Dever de <strong>honestidade e integridade</strong> que todo agente público deve seguir. Direito positivo: art. 37, §4º/CF e <strong>Lei 8.429/92</strong> (Lei de Improbidade Administrativa — LIA), profundamente alterada pela <strong>Lei 14.230/2021</strong>.</p>
          <h4>Elementos constitutivos do ato de improbidade</h4>
          <ul>
            <li><strong>Sujeito passivo</strong> ("vítima"): regra geral, a <strong>Administração Pública</strong>. Partidos políticos como possível vítima (art. 23-C da lei) — dispositivo considerado <strong>inconstitucional</strong>.</li>
            <li><strong>Sujeito ativo</strong>: quem comete a improbidade — <strong>qualquer pessoa investida de função pública</strong>, ainda que transitoriamente ou sem remuneração (art. 2º).</li>
            <li><strong>Terceiros</strong>: também respondem por improbidade os que induzam ou concorram para a prática do ato, ou dele se beneficiem (art. 3º).</li>
            <li><strong>Responsabilidade dos sócios</strong> de pessoa jurídica envolvida: é <strong>subjetiva</strong> — depende de comprovação de culpa/dolo individual (art. 3º, §1º).</li>
            <li><strong>Responsabilidade das pessoas jurídicas</strong>: também pode ser apurada com base na <strong>Lei Anticorrupção (Lei 12.846/13)</strong> (art. 3º, §2º).</li>
            <li><strong>Sucessores</strong>: respondem, mas apenas pelo <strong>ressarcimento ao erário</strong>, e até o limite do valor da herança recebida (art. 8º).</li>
            <li><strong>Sucessão empresarial</strong>: a empresa sucessora responde nos limites do valor do negócio adquirido (art. 8º-A).</li>
          </ul>
          <h4>Agentes políticos e improbidade administrativa</h4>
          <p>Tema controvertido. Na <strong>Reclamação 2.138/DF</strong> (STF, 2007), a Corte entendeu que agentes políticos de alto escalão (Ministros de Estado etc.), quando a mesma conduta já é tipificada como <strong>crime de responsabilidade</strong> (Lei 1.079/50), não respondem cumulativamente pela <strong>Lei de Improbidade</strong> — a Constituição não admitiria dois regimes de responsabilidade político-administrativa simultâneos para esses agentes. Esse entendimento é <strong>polêmico</strong> e não impede, por exemplo, que <strong>prefeitos</strong> (sujeitos ao Decreto-Lei 201/67) sejam responsabilizados por improbidade administrativa, segundo entendimento consolidado do STJ.</p>
          <h4>Improbidade x Crime de responsabilidade</h4>
          <p>São regimes distintos: a <strong>improbidade administrativa</strong> (Lei 8.429/92) é apurada por <strong>ação judicial civil</strong>, perante o juízo de 1º grau (regra geral), com sanções civis/políticas. O <strong>crime de responsabilidade</strong> (Lei 1.079/50; Decreto-Lei 201/67) é uma infração <strong>político-administrativa</strong> julgada pelo <strong>Legislativo</strong> (ou, para prefeitos, pelo Judiciário conforme o caso) — não se trata de crime penal comum, apesar do nome.</p>`,
        flashcards:[
          {p:'A improbidade administrativa é apurada em qual esfera, e é considerada crime?', r:'É apurada na esfera judicial civil; não é crime — as sanções são de natureza civil e política, sem prejuízo de eventuais sanções penais cabíveis.'},
          {p:'Qual princípio fundamenta a Lei de Improbidade Administrativa, e qual seu conteúdo?', r:'O princípio da probidade — o dever de honestidade e integridade que todo agente público deve seguir.'},
          {p:'Qual lei alterou profundamente a Lei 8.429/92 (LIA)?', r:'A Lei 14.230/2021.'},
          {p:'Quem pode ser sujeito ativo de um ato de improbidade administrativa?', r:'Qualquer pessoa investida de função pública, ainda que transitoriamente ou sem remuneração (art. 2º da LIA).'},
          {p:'Qual a natureza da responsabilidade dos sócios de uma pessoa jurídica envolvida em improbidade?', r:'Subjetiva — depende de comprovação de culpa ou dolo individual (art. 3º, §1º).'},
          {p:'Por qual limite respondem os sucessores de quem praticou ato de improbidade?', r:'Apenas pelo ressarcimento ao erário, até o limite do valor da herança recebida (art. 8º).'},
          {p:'O que decidiu o STF na Reclamação 2.138/DF sobre agentes políticos e improbidade?', r:'Que agentes políticos de alto escalão, quando a conduta já é crime de responsabilidade (Lei 1.079/50), não respondem cumulativamente pela Lei de Improbidade — entendimento polêmico.'},
          {p:'Prefeitos respondem por improbidade administrativa mesmo estando sujeitos ao Decreto-Lei 201/67?', r:'Sim, segundo entendimento consolidado do STJ.'},
          {p:'Qual a diferença entre a ação de improbidade e o processo por crime de responsabilidade?', r:'Improbidade: ação judicial civil, regra geral em 1º grau, sanções civis/políticas. Crime de responsabilidade: infração político-administrativa julgada pelo Legislativo (ou Judiciário, no caso de prefeitos), apesar do nome não é crime penal comum.'}

    ] },

let currentTab = 'inicio';
let storageCache = {};

function parseData(str){
  const [d,m,y] = str.split('/').map(Number);
  return new Date(2000+y, m-1, d);
}

function getStorage(key, fallback){
  try{
    const r = localStorage.getItem(key);
    return r !== null ? JSON.parse(r) : fallback;
  }catch(e){ return fallback; }
}
function setStorage(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

function getRevisado(temaId){
  if(storageCache['rev:'+temaId] !== undefined) return storageCache['rev:'+temaId];
  const v = getStorage('rev:'+temaId, false);
  storageCache['rev:'+temaId] = v;
  return v;
}
function toggleRevisado(temaId){
  const cur = getRevisado(temaId);
  storageCache['rev:'+temaId] = !cur;
  setStorage('rev:'+temaId, !cur);
  render();
}

function getExtraTemas(subjectId){
  const key = 'extra-temas:'+subjectId;
  if(storageCache[key] !== undefined) return storageCache[key];
  const v = getStorage(key, []);
  storageCache[key] = v;
  return v;
}
function addExtraTema(subjectId, tema){
  const key = 'extra-temas:'+subjectId;
  const list = getExtraTemas(subjectId);
  list.push(tema);
  storageCache[key] = list;
  setStorage(key, list);
}

function allTemas(subject, extra){
  return [...subject.temas, ...extra];
}

function nextExam(){
  const now = new Date();
  let best = null;
  SUBJECTS.forEach(s=>{
    Object.entries(s.dates).forEach(([tipo,str])=>{
      const d = parseData(str);
      if(d >= now && (!best || d < best.date)){
        best = {date:d, tipo, subject:s.nome};
      }
    });
  });
  return best;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  let html = `<button class="${currentTab==='inicio'?'active':''}" onclick="goTo('inicio')">Início</button>`;
  SUBJECTS.forEach(s=>{
    html += `<button class="${currentTab===s.id?'active':''}" onclick="goTo('${s.id}')"><span class="num">${s.numeral}</span>${s.nome}</button>`;
  });
  tabs.innerHTML = html;
}

function goTo(id){
  currentTab = id;
  render();
}

function renderInicio(){
  const main = document.getElementById('main');
  const next = nextExam();
  const now = new Date();
  let countdownHtml = '';
  if(next){
    const days = Math.ceil((next.date - now) / 86400000);
    countdownHtml = `
      <div class="countdown-card">
        <div class="eyebrow">Próxima prova</div>
        <div class="big">${days} dia${days===1?'':'s'}</div>
        <div class="sub">${next.tipo} de ${next.subject} — ${next.date.toLocaleDateString('pt-BR')}</div>
      </div>`;
  }

  const rows = [];
  SUBJECTS.forEach(s=>{
    Object.entries(s.dates).forEach(([tipo,str])=>{
      rows.push({subject:s.nome, tipo, date:parseData(str), str});
    });
  });
  rows.sort((a,b)=>a.date-b.date);

  let tableRows = rows.map(r=>{
    const soon = r.date >= now && (r.date - now) < 7*86400000;
    return `<tr class="${soon?'soon':''}">
      <td class="materia">${r.subject}</td>
      <td>${r.tipo}</td>
      <td class="dim">${r.str}</td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    ${countdownHtml}
    <table class="pauta">
      <caption>Calendário de provas</caption>
      <thead><tr><th>Matéria</th><th>Avaliação</th><th>Data</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  `;
}

function renderMateria(subject){
  const main = document.getElementById('main');
  const extra = getExtraTemas(subject.id);
  const temas = allTemas(subject, extra);

  let revisadoCount = 0;
  for(const t of temas){ if(getRevisado(t.id)) revisadoCount++; }
  const pct = temas.length ? Math.round(100*revisadoCount/temas.length) : 0;

  const datasHtml = Object.entries(subject.dates).map(([tipo,str])=>
    `<span>${tipo}: <b>${str}</b></span>`
  ).join('');

  let temasHtml = '';
  if(temas.length === 0){
    temasHtml = `<div class="empty">Nenhum tema cadastrado ainda nesta matéria.<br>Adicione um tema manualmente abaixo.</div>`;
  } else {
    for(const t of temas){
      const rev = getRevisado(t.id);
      const fcHtml = (t.flashcards||[]).map(fc=>`
        <div class="flashcard" onclick="this.classList.toggle('flipped')">
          <div class="flashcard-inner">
            <div class="flashcard-face front">${fc.p}</div>
            <div class="flashcard-face back">${fc.r}</div>
          </div>
        </div>
      `).join('');
      temasHtml += `
        <div class="tema" id="tema-${t.id}">
          <div class="tema-head" onclick="toggleTemaOpen('${t.id}')">
            <span class="chev">▸</span>
            <span class="titulo">${t.titulo}</span>
            <span class="revisado-pill ${rev?'on':''}" onclick="event.stopPropagation(); toggleRevisado('${t.id}')">${rev?'revisado':'a revisar'}</span>
          </div>
          <div class="tema-body">
            <div class="resumo">${t.resumo}</div>
            ${fcHtml ? `<div class="section-label">Flashcards</div><div class="flashcards">${fcHtml}</div>` : ''}
          </div>
        </div>`;
    }
  }

  main.innerHTML = `
    <div class="materia-head">
      <h2 class="serif">${subject.nome}</h2>
      <div class="datas">${datasHtml}</div>
      ${temas.length ? `
        <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${revisadoCount} de ${temas.length} temas revisados (${pct}%)</div>
      ` : ''}
    </div>
    ${temasHtml}
    <button class="add-tema-btn" onclick="openModal('${subject.id}')">+ Adicionar tema manualmente</button>
  `;
}

function toggleTemaOpen(id){
  const el = document.getElementById('tema-'+id);
  el.classList.toggle('open');
}

function render(){
  renderTabs();
  if(currentTab === 'inicio'){
    renderInicio();
  } else {
    const subject = SUBJECTS.find(s=>s.id===currentTab);
    renderMateria(subject);
  }
}

// ---------- Modal: novo tema manual ----------
let modalSubjectId = null;
function openModal(subjectId){
  modalSubjectId = subjectId;
  document.getElementById('novoTitulo').value = '';
  document.getElementById('novoResumo').value = '';
  document.getElementById('fcList').innerHTML = '';
  addFlashcardRow();
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}
function addFlashcardRow(){
  const wrap = document.createElement('div');
  wrap.className = 'fc-row';
  wrap.innerHTML = `
    <input type="text" placeholder="Pergunta" class="fc-p">
    <input type="text" placeholder="Resposta" class="fc-r">
    <button onclick="this.parentElement.remove()">×</button>
  `;
  document.getElementById('fcList').appendChild(wrap);
}
function salvarTema(){
  const titulo = document.getElementById('novoTitulo').value.trim();
  const resumo = document.getElementById('novoResumo').value.trim();
  if(!titulo){ return; }
  const flashcards = [];
  document.querySelectorAll('#fcList .fc-row').forEach(row=>{
    const p = row.querySelector('.fc-p').value.trim();
    const r = row.querySelector('.fc-r').value.trim();
    if(p && r) flashcards.push({p,r});
  });
  const tema = {
    id: modalSubjectId+'-'+Date.now(),
    titulo,
    resumo: '<p>'+resumo.replace(/\n/g,'</p><p>')+'</p>',
    flashcards
  };
  addExtraTema(modalSubjectId, tema);
  closeModal();
  render();
}

render();
</script>
