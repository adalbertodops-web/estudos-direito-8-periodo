<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direito — 8º Período</title>
<style>
:root {
  --bg: #12162A;
  --surface: #1B2140;
  --surface-2: #232B4D;
  --paper: #EDE7D8;
  --paper-text: #241F14;
  --brass: #B98D4A;
  --text: #E9E6DC;
  --text-dim: #A9AFC7;
  --border: #2C3357;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
}
.app { max-width: 760px; margin: 0 auto; padding: 20px; }
header.top {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 20px;
  z-index: 10;
}
header.top .title { font-size: 1.5rem; margin: 0 0 15px; color: var(--text); }
nav.tabs {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  margin-bottom: 15px;
}
nav.tabs button {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 4px;
  white-space: nowrap;
}
nav.tabs button.active {
  background: var(--brass);
  color: #1B1204;
  border-color: var(--brass);
}
main { padding: 20px 0; }
.countdown-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
  margin-bottom: 20px;
}
.countdown-card .big { font-size: 2rem; color: var(--brass); margin: 10px 0; }
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}
table th, table td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
table th {
  background: var(--surface-2);
  color: var(--text-dim);
}
.tema {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  margin: 10px 0;
  overflow: hidden;
}
.tema-head {
  padding: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.tema-head:hover { background: var(--surface-2); }
.chev { color: var(--brass); transition: transform 0.3s; }
.tema.open .chev { transform: rotate(90deg); }
.titulo { flex: 1; font-weight: bold; }
.tema-body {
  display: none;
  padding: 15px;
  background: var(--surface-2);
}
.tema.open .tema-body { display: block; }
.resumo {
  background: var(--paper);
  color: var(--paper-text);
  padding: 15px;
  border-radius: 4px;
  margin-bottom: 15px;
  line-height: 1.6;
}
.flashcards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 600px) {
  .flashcards { grid-template-columns: 1fr; }
}
.flashcard {
  background: var(--paper);
  color: var(--paper-text);
  padding: 15px;
  border-radius: 4px;
  cursor: pointer;
  min-height: 100px;
  display: flex;
  align-items: center;
  border: 1px solid var(--brass);
}
.flashcard:hover { background: var(--paper); opacity: 0.9; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">Direito — 8º Período</div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>

<script>
const SUBJECTS = [
  {
    id: 'processo-trabalho',
    numeral: 'I',
    nome: 'Processo do Trabalho',
    dates: { 'AV1': '16/09/26', 'AV2': '19/10/26', 'AV Final': '25/11/26' },
    temas: [
      {
        id: 'pt-tgp',
        titulo: 'TGP: Jurisdição, Ação e Processo',
        resumo: 'Jurisdição: aplicação da lei a situações concretas. Características: terceiro imparcial, órgão de decisão, decisão insuscetível de controle externo. Ação: direito de provocar a atividade jurisdicional. Processo: instrumento previsto em lei para exercer a jurisdição.',
        flashcards: [
          { p: 'O que é jurisdição?', r: 'Aplicação da lei a situações concretas, de forma racional e argumentativa.' },
          { p: 'Quais os escopos da jurisdição?', r: 'Social, político, educacional e jurídico.' }
        ]
      }
    ]
  },
  {
    id: 'direito-familia',
    numeral: 'II',
    nome: 'Direito de Família',
    dates: { 'AV1': '17/09/26', 'AV2': '29/10/26', 'AV Final': '26/11/26' },
    temas: [
      {
        id: 'df-conceito',
        titulo: 'Conceito de Família',
        resumo: 'Conjunto de normas jurídicas que regulam as relações familiares. A família é a base da sociedade (art. 226 CR/88). É fato natural e social anterior ao Direito.',
        flashcards: [
          { p: 'O que é família segundo a CR/88?', r: 'Base da sociedade. Pode ser constituída por casamento, união estável ou família monoparental.' },
          { p: 'Qual o elemento principal da família contemporânea?', r: 'A afetividade.' }
        ]
      }
    ]
  },
  {
    id: 'processo-penal',
    numeral: 'III',
    nome: 'Processo Penal',
    dates: { 'AV1': '22/09/26', 'AV2': '26/10/26', 'AV Final': '23/11/26' },
    temas: [
      {
        id: 'pp-fontes',
        titulo: 'Fontes do Direito Processual Penal',
        resumo: 'Fontes formais diretas principais: Código de Processo Penal e Constituição Federal. Fontes formais diretas: lei, decreto. Fontes formais indiretas: jurisprudência, costumes, doutrina.',
        flashcards: [
          { p: 'Quais são as fontes formais diretas principais do DPP?', r: 'Código de Processo Penal e Constituição Federal.' }
        ]
      }
    ]
  },
  {
    id: 'direito-tributario',
    numeral: 'IV',
    nome: 'Direito Tributário',
    dates: { 'AV1': '24/09/26', 'AV2': '27/12/26', 'AV Final': '24/11/26' },
    temas: [
      {
        id: 'dt-competencia',
        titulo: 'Competência Tributária',
        resumo: 'Repartição de competências tributárias entre União, Estados, DF e Municípios conforme a Constituição Federal. Cada ente tem suas atribuições específicas de tributação.',
        flashcards: [
          { p: 'Quem estabelece a competência tributária?', r: 'A Constituição Federal.' }
        ]
      }
    ]
  },
  {
    id: 'direito-administrativo',
    numeral: 'V',
    nome: 'Direito Administrativo',
    dates: { 'AV1': '25/09/26', 'AV2': '30/10/26', 'AV Final': '27/11/26' },
    temas: [
      {
        id: 'da-agentes',
        titulo: 'Agentes Públicos',
        resumo: 'Agentes públicos: todo aquele que exerce atividade em nome da Administração Pública. Espécies: agentes políticos, servidores públicos, militares, particulares em colaboração.',
        flashcards: [
          { p: 'O que é um agente público?', r: 'Todo aquele que exerce atividade em nome da Administração Pública.' }
        ]
      }
    ]
  }
];

let currentTab = 'inicio';

function parseData(str) {
  const [d, m, y] = str.split('/').map(Number);
  return new Date(2000 + y, m - 1, d);
}

function nextExam() {
  const now = new Date();
  let best = null;
  SUBJECTS.forEach(s => {
    Object.entries(s.dates).forEach(([tipo, str]) => {
      const d = parseData(str);
      if (d >= now && (!best || d < best.date)) {
        best = { date: d, tipo, subject: s.nome };
      }
    });
  });
  return best;
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  let html = `<button class="${currentTab === 'inicio' ? 'active' : ''}" onclick="goTo('inicio')">Início</button>`;
  SUBJECTS.forEach(s => {
    html += `<button class="${currentTab === s.id ? 'active' : ''}" onclick="goTo('${s.id}')">${s.numeral}. ${s.nome}</button>`;
  });
  tabs.innerHTML = html;
}

function goTo(id) {
  currentTab = id;
  render();
}

function renderInicio() {
  const main = document.getElementById('main');
  const next = nextExam();
  const now = new Date();
  let countdownHtml = '';
  
  if (next) {
    const days = Math.ceil((next.date - now) / 86400000);
    countdownHtml = `<div class="countdown-card"><div>Próxima prova</div><div class="big">${days} dias</div><div>${next.tipo} de ${next.subject}</div></div>`;
  }

  const rows = [];
  SUBJECTS.forEach(s => {
    Object.entries(s.dates).forEach(([tipo, str]) => {
      rows.push({ subject: s.nome, tipo, date: parseData(str), str });
    });
  });
  rows.sort((a, b) => a.date - b.date);

  let tableRows = rows.map(r => `<tr><td>${r.subject}</td><td>${r.tipo}</td><td>${r.str}</td></tr>`).join('');

  main.innerHTML = `${countdownHtml}<table><caption>Calendário de provas</caption><thead><tr><th>Matéria</th><th>Tipo</th><th>Data</th></tr></thead><tbody>${tableRows}</tbody></table>`;
}

function renderMateria(subject) {
  const main = document.getElementById('main');
  const temas = subject.temas;

  const datasHtml = Object.entries(subject.dates).map(([tipo, str]) => `${tipo}: ${str}`).join(' | ');

  let temasHtml = temas.map(t => {
    const fcHtml = (t.flashcards || []).map(fc => `<div class="flashcard" onclick="alert('${fc.p}\\n\\n${fc.r}')">${fc.p}</div>`).join('');
    return `
      <div class="tema" id="tema-${t.id}">
        <div class="tema-head" onclick="toggleTemaOpen('${t.id}')">
          <span class="chev">▸</span>
          <span class="titulo">${t.titulo}</span>
        </div>
        <div class="tema-body">
          <div class="resumo">${t.resumo}</div>
          ${fcHtml ? `<div style="font-size:0.9rem; margin-bottom:10px; color: var(--text-dim);">Clique nos cards para ver resposta:</div><div class="flashcards">${fcHtml}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  main.innerHTML = `<h2>${subject.nome}</h2><p style="color: var(--text-dim); font-size: 0.9rem;">Datas: ${datasHtml}</p>${temasHtml}`;
}

function toggleTemaOpen(id) {
  const el = document.getElementById('tema-' + id);
  el.classList.toggle('open');
}

function render() {
  renderTabs();
  if (currentTab === 'inicio') {
    renderInicio();
  } else {
    const subject = SUBJECTS.find(s => s.id === currentTab);
    if (subject) renderMateria(subject);
  }
}

render();
</script>
</body>
</html>
