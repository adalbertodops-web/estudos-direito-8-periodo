<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direito — 8º Período</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12162A;
    --surface:#1B2140;
    --surface-2:#232B4D;
    --paper:#EDE7D8;
    --paper-text:#241F14;
    --brass:#B98D4A;
    --brass-dim:#8A6B3B;
    --sage:#7C8B63;
    --urgent:#A94438;
    --text:#E9E6DC;
    --text-dim:#A9AFC7;
    --border:#2C3357;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Source Serif 4', serif;}
  .app{max-width:760px;margin:0 auto;padding:0 0 64px;}

  header.top{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:18px 20px 0;
  }
  header.top .title{
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0 0 14px;
    color:var(--text);
  }
  header.top .title em{
    font-style:italic;
    color:var(--brass);
  }
  nav.tabs{
    display:flex;
    gap:4px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.88rem;
    padding:10px 14px 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button .num{
    color:var(--brass-dim);
    font-family:'Source Serif 4', serif;
    font-style:italic;
    margin-right:6px;
  }
  nav.tabs button.active{
    color:var(--text);
    border-bottom:2px solid var(--brass);
  }
  nav.tabs button.active .num{color:var(--brass);}

  main{padding:24px 20px 0;}

  /* ---------- Início ---------- */
  .countdown-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px;
    padding:22px 22px;
    margin-bottom:28px;
  }
  .countdown-card .eyebrow{
    color:var(--text-dim);
    font-size:0.8rem;
    margin-bottom:8px;
  }
  .countdown-card .big{
    font-family:'Source Serif 4', serif;
    font-size:2.1rem;
    font-weight:600;
    color:var(--brass);
    line-height:1.2;
  }
  .countdown-card .sub{
    color:var(--text-dim);
    font-size:0.92rem;
    margin-top:4px;
  }

  table.pauta{
    width:100%;
    border-collapse:collapse;
    font-size:0.88rem;
  }
  table.pauta caption{
    text-align:left;
    font-family:'Source Serif 4', serif;
    font-size:1.05rem;
    margin-bottom:12px;
    color:var(--text);
  }
  table.pauta th{
    text-align:left;
    color:var(--text-dim);
    font-weight:500;
    font-size:0.76rem;
    padding:0 10px 8px 0;
    border-bottom:1px solid var(--border);
  }
  table.pauta td{
    padding:10px 10px 10px 0;
    border-bottom:1px solid var(--border);
    color:var(--text);
    vertical-align:top;
  }
  table.pauta td.materia{font-family:'Source Serif 4', serif;}
  table.pauta tr.soon td{color:var(--brass);}
  table.pauta td.dim{color:var(--text-dim);}

  /* ---------- Matéria ---------- */
  .materia-head{margin-bottom:18px;}
  .materia-head h2{margin:0 0 4px; font-size:1.5rem;}
  .materia-head .datas{
    display:flex; flex-wrap:wrap; gap:6px 14px;
    font-size:0.78rem; color:var(--text-dim); margin-top:8px;
  }
  .materia-head .datas span b{color:var(--text);}

  .progress-bar{
    height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-top:14px;
  }
  .progress-bar .fill{height:100%; background:var(--sage);}
  .progress-label{font-size:0.76rem; color:var(--text-dim); margin-top:6px;}

  .empty{
    color:var(--text-dim);
    font-size:0.92rem;
    padding:28px 0;
    line-height:1.6;
  }

  .tema{
    border:1px solid var(--border);
    border-radius:4px;
    margin-bottom:12px;
    background:var(--surface);
    overflow:hidden;
  }
  .tema-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px;
    cursor:pointer;
  }
  .tema-head .chev{
    color:var(--brass);
    font-size:0.8rem;
    transition:transform 0.15s ease;
  }
  .tema.open .tema-head .chev{transform:rotate(90deg);}
  .tema-head .titulo{
    flex:1;
    font-family:'Source Serif 4', serif;
    font-size:1.05rem;
  }
  .tema-head .revisado-pill{
    font-size:0.72rem;
    padding:3px 9px;
    border-radius:20px;
    border:1px solid var(--border);
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
  }
  .tema-head .revisado-pill.on{
    background:rgba(124,139,99,0.18);
    border-color:var(--sage);
    color:var(--sage);
  }

  .tema-body{
    display:none;
    padding:0 16px 20px;
  }
  .tema.open .tema-body{display:block;}

  .resumo{
    background:var(--paper);
    color:var(--paper-text);
    border-radius:3px;
    padding:16px 18px;
    font-size:0.92rem;
    line-height:1.65;
  }
  .resumo h4{
    font-family:'Source Serif 4', serif;
    font-size:0.95rem;
    margin:0 0 8px;
    color:var(--paper-text);
  }
  .resumo blockquote{
    margin:12px 0 0;
    padding-left:12px;
    border-left:3px solid var(--brass);
    font-style:italic;
  }
  .resumo ul{margin:8px 0 0; padding-left:20px;}
  .resumo strong{color:#5c3d1a;}

  .section-label{
    font-size:0.76rem;
    color:var(--text-dim);
    margin:18px 0 8px;
  }

  .flashcards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:480px){
    .flashcards{grid-template-columns:1fr;}
  }
  .flashcard{
    perspective:1000px;
    height:120px;
    cursor:pointer;
  }
  .flashcard-inner{
    position:relative; width:100%; height:100%;
    transition:transform 0.5s;
    transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flashcard-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:3px;
    padding:12px;
    font-size:0.84rem;
    line-height:1.4;
    display:flex; align-items:center;
    overflow-y:auto;
  }
  .flashcard-face.front{
    background:var(--paper); color:var(--paper-text);
    border:1px solid var(--brass-dim);
  }
  .flashcard-face.back{
    background:var(--surface-2); color:var(--text);
    border:1px solid var(--sage);
    transform:rotateY(180deg);
  }
  .flashcard-face .tag{
    position:absolute; top:6px; right:8px;
    font-size:0.65rem; color:var(--text-dim);
  }

  .add-tema-btn{
    display:block;
    width:100%;
    background:none;
    border:1px dashed var(--border);
    color:var(--text-dim);
    padding:12px;
    border-radius:4px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.85rem;
    cursor:pointer;
    margin-top:6px;
  }
  .add-tema-btn:hover{color:var(--brass); border-color:var(--brass-dim);}

  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(10,12,24,0.7);
    z-index:20;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px 10px 0 0;
    width:100%; max-width:520px;
    max-height:85vh;
    overflow-y:auto;
    padding:20px;
  }
  .modal h3{margin:0 0 14px;}
  .modal label{
    display:block; font-size:0.78rem; color:var(--text-dim); margin:14px 0 6px;
  }
  .modal input, .modal textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:4px;
    color:var(--text);
    padding:10px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.88rem;
    resize:vertical;
  }
  .fc-row{display:flex; gap:8px; margin-bottom:8px;}
  .fc-row input{flex:1;}
  .fc-row button{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    border-radius:4px; padding:0 10px; cursor:pointer;
  }
  .modal-actions{
    display:flex; gap:10px; margin-top:18px;
  }
  .modal-actions button{
    flex:1;
    padding:12px;
    border-radius:4px;
    border:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.88rem;
    cursor:pointer;
  }
  .btn-cancel{background:var(--surface-2); color:var(--text-dim);}
  .btn-save{background:var(--brass); color:#1B1204; font-weight:600;}
  .btn-add-fc{background:none; border:1px dashed var(--border); color:var(--text-dim); width:100%; padding:8px; border-radius:4px; cursor:pointer; font-size:0.8rem;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">Direito — <em>8º Período</em></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 class="serif">Novo tema</h3>
    <label>Título do tema</label>
    <input type="text" id="novoTitulo" placeholder="Ex: Tutela de urgência">
    <label>Resumo (didático, para revisão rápida)</label>
    <textarea id="novoResumo" rows="5" placeholder="Explique o tema de forma direta, com os pontos que mais caem em prova..."></textarea>
    <label>Flashcards</label>
    <div id="fcList"></div>
    <button class="btn-add-fc" onclick="addFlashcardRow()">+ Adicionar flashcard</button>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarTema()">Salvar tema</button>
    </div>
  </div>
</div>

<script>
const SUBJECTS = [
  { id:'processo-trabalho', numeral:'I', nome:'Processo do Trabalho',
    dates:{ 'AV1':'16/09/26', 'AV2':'19/10/26', 'AV Final':'25/11/26', '2ª chamada':'11/11/26', 'Especial':'09/12/26' },
    temas: [
      { id:'pt-tgp', titulo:'TGP: Jurisdição, Ação e Processo',
        resumo:`<h4>Jurisdição</h4>
          <p>É a aplicação da lei a situações concretas, de forma racional e argumentativa. Características: <strong>terceiro imparcial</strong> (não neutro), <strong>órgão de decisão</strong> (não consultivo) e <strong>decisão insuscetível de controle externo</strong> ao Judiciário.</p>
          <p><strong>Escopos:</strong> social (pacificação/lide sociológica), político (garantia de liberdades), educacional (efeito pedagógico) e jurídico (aplicação da norma ao caso concreto).</p>
          <p><strong>Jurisdição trabalhista</strong>: função estatal exercida para solucionar conflitos trabalhistas de forma definitiva. Marcas: desigualdade entre as partes e protagonismo judicial.</p>
          <h4>Ação</h4>
          <p>Direito de provocar a atividade jurisdicional. Condições da ação (art. 17 e 485, VI do CPC): <strong>interesse</strong> (utilidade/necessidade) e <strong>legitimidade</strong> (pertinência subjetiva).</p>
          <p><strong>Ação trabalhista</strong>: marcada pelo <em>jus postulandi</em> da parte. Exceções ao jus postulandi: Súmula 425/TST e homologação de acordo extrajudicial (art. 855-B a E CLT).</p>
          <blockquote><strong>Súmula 425/TST</strong>: o jus postulandi das partes (art. 791/CLT) limita-se às Varas do Trabalho e aos TRTs, não alcançando a ação rescisória, a ação cautelar, o mandado de segurança e os recursos de competência do TST — nessas hipóteses é indispensável advogado.</blockquote>
          <h4>Processo</h4>
          <blockquote>Processo é o instrumento previsto em lei para exercer a jurisdição; procedimento é a exteriorização do processo pelos atos praticados.</blockquote>
          <p><strong>Processo trabalhista</strong>: simplificado e informal, usando o CPC de forma supletiva e subsidiária (art. 769/CLT; art. 15/CPC).</p>`,
        flashcards:[
          {p:'Quais as 3 características da jurisdição?', r:'Terceiro imparcial (não neutro); órgão de decisão (não consultivo); decisão insuscetível de controle externo ao Judiciário.'},
          {p:'Quais os 4 escopos da jurisdição?', r:'Social, político, educacional e jurídico.'},
          {p:'Quais as condições da ação e onde estão previstas?', r:'Interesse e legitimidade — art. 17 e 485, VI do CPC.'},
          {p:'O que é jus postulandi e quais suas exceções?', r:'Capacidade de a própria parte postular sem advogado na Justiça do Trabalho. Exceções: Súmula 425/TST e homologação de acordo extrajudicial (art. 855-B a E da CLT).'},
          {p:'Diferença entre processo e procedimento?', r:'Processo é o instrumento previsto em lei para o exercício da jurisdição; procedimento é a exteriorização do processo pelos atos processuais praticados.'}
        ]},
      { id:'pt-conceito-fontes', titulo:'Conceito, Autonomia e Fontes do DPT',
        resumo:`<h4>Conceito</h4>
          <p>Disciplina que estuda a jurisdição trabalhista, usando supletiva e subsidiariamente o processo civil, à luz dos princípios constitucionais, para concretizar as normas de Direito do Trabalho.</p>
          <h4>Autonomia frente ao Direito Processual Civil</h4>
          <ul>
            <li><strong>Monista</strong>: mero desdobramento do DPC, sem institutos próprios.</li>
            <li><strong>Dualista</strong>: autonomia plena — legislação, princípios e justiça especializada próprios.</li>
            <li><strong>Intermediária</strong>: autonomia relativa, com recurso subsidiário ao CPC (art. 769/CLT).</li>
            <li><strong>Posição moderna</strong> (arts. 15 e 1046, §2º do CPC): o DPT é um <em>subsistema</em> da Teoria Geral do Processo, compartilhando princípios e institutos comuns.</li>
          </ul>
          <h4>Fontes formais diretas</h4>
          <p><strong>CF</strong> (direitos fundamentais art. 5º, direitos trabalhistas art. 7º, organização da JT arts. 92 e 111-117) → <strong>CLT</strong> (cláusula de barreira art. 769) → <strong>CPC</strong> (arts. 15 e 1046, §2º; normas fundamentais arts. 1º a 12) → legislação extravagante e subsidiária → tratados/convenções da OIT → regimentos internos e resoluções → costumes (ex.: mandato tácito, art. 791, §3º/CLT).</p>
          <h4>Fontes formais indiretas</h4>
          <p>Doutrina; jurisprudência (Súmulas e OJs do TST — não vinculantes); Súmulas Vinculantes; precedentes; teses vinculantes do TST.</p>
          <h4>Fontes de explicitação</h4>
          <p>Analogia, princípios gerais de direito e equidade (art. 8º da CLT; art. 4º da LINDB; art. 766/CLT; art. 140 do CPC — vedação ao <em>non liquet</em>).</p>`,
        flashcards:[
          {p:'Quais as 3 correntes tradicionais sobre a autonomia do DPT?', r:'Monista (sem autonomia), Dualista (autonomia plena) e Intermediária (autonomia relativa, recurso subsidiário ao CPC).'},
          {p:'Qual a posição moderna sobre a autonomia do DPT?', r:'O DPT é um subsistema da Teoria Geral do Processo — arts. 15 e 1046, §2º do CPC.'},
          {p:'O que é a "cláusula de barreira/abertura" e onde está prevista?', r:'Art. 769 da CLT — permite o uso subsidiário do CPC quando há lacuna e compatibilidade com os princípios do processo do trabalho.'},
          {p:'Cite 2 exemplos de costume como fonte do DPT.', r:'Mandato tácito (art. 791, §3º/CLT) e o protesto (art. 795, caput, CLT).'},
          {p:'As Súmulas do TST são fontes diretas ou indiretas?', r:'Indiretas — não são obrigatórias, refletem a prática dos Tribunais.'}
        ]},
      { id:'pt-principios', titulo:'Princípios do Processo do Trabalho',
        resumo:`<p>Lista dos princípios mais cobrados, com a lógica de cada um:</p>
          <ul>
            <li><strong>Proteção</strong>: compensa a desigualdade entre as partes (ex.: inversão do ônus da prova, art. 818/CLT; requisitos de recurso diferenciados). A Reforma Trabalhista relativizou esse princípio.</li>
            <li><strong>Busca da verdade real</strong>: simetria com a primazia da realidade (art. 765/CLT) — prevalece a função exercida sobre o nome do cargo, por exemplo.</li>
            <li><strong>Conciliação</strong>: obrigatória na JT, com momentos próprios (arts. 846 e 850/CLT); equivale à coisa julgada (art. 831/CLT).</li>
            <li><strong>Jurisdição normativa</strong>: só existe na JT — permite criar ou manter condições de trabalho por via processual (art. 114, §2º e 3º da CF), com limite no art. 611-B/CLT.</li>
            <li><strong>Julgamento extra petita</strong>: autoriza o juiz a conceder mais do que foi pedido (ex.: art. 467/CLT — 50% sobre verbas rescisórias).</li>
            <li><strong>Oralidade</strong>: o processo do trabalho é essencialmente um processo de audiência — sinônimo de informalidade e simplicidade.</li>
            <li><strong>Imediatidade/imediação</strong>: contato direto do juiz com partes e testemunhas na produção da prova (art. 820/CLT).</li>
            <li><strong>Concentração</strong>: a prova deve, na medida do possível, ser toda produzida em audiência (arts. 845 e 852-C/CLT).</li>
            <li><strong>Irrecorribilidade imediata das interlocutórias</strong>: fundamento no art. 893, §1º/CLT e Súmula 214/TST.</li>
          </ul>`,
        flashcards:[
          {p:'O que fez a Reforma Trabalhista com o princípio da proteção?', r:'Relativizou-o, diminuindo a distância de tratamento entre reclamante e reclamado.'},
          {p:'Qual princípio se conecta com a "primazia da realidade" do Direito do Trabalho?', r:'Princípio da busca da verdade (real).'},
          {p:'O que é jurisdição normativa e qual seu limite?', r:'Poder da JT de criar/manter condições de trabalho por via processual (art. 114, §2º/3º CF); limite no art. 611-B da CLT.'},
          {p:'Dê um exemplo de julgamento extra petita na CLT.', r:'Art. 467/CLT: acréscimo de 50% sobre verbas rescisórias incontroversas não pagas na data certa.'},
          {p:'Qual a base legal da irrecorribilidade imediata das interlocutórias?', r:'Art. 893, §1º da CLT e Súmula 214/TST.'}
        ]},
      { id:'pt-organizacao-jt', titulo:'Organização da Justiça do Trabalho',
        resumo:`<h4>Histórico</h4>
          <p>Prevista na CF de 1934; instalada em 1941 (fora do Judiciário); incorporada ao Judiciário em 1946 (3 instâncias: TST-TRT-JCJ). A <strong>EC 24/99</strong> extinguiu a representação classista; a <strong>EC 45/2004</strong> ampliou a competência da JT (art. 114/CF).</p>
          <h4>Estrutura atual (art. 111/CF)</h4>
          <p>Órgãos da JT: <strong>TST, TRTs e Juízes do Trabalho</strong> (não mais "Varas do Trabalho" como órgão — art. 644, "c"/CLT). Juízes de Direito administram a JT onde não houver jurisdição trabalhista instalada (art. 112/CF), mas não compõem a estrutura da Justiça do Trabalho.</p>
          <p><strong>TST</strong>: órgão de cúpula, jurisdição em todo território nacional (art. 92, II-A/CF). <strong>Composição</strong>: 27 Ministros, togados e vitalícios (art. 111-A/CF). <strong>Escolha</strong>: brasileiros (não precisa ser nato) entre 35 e 70 anos, notável saber jurídico e reputação ilibada, nomeados pelo Presidente da República após aprovação do Senado por maioria absoluta (50%+1) — 1/5 entre advogados e membros do MPT com +10 anos de atividade (fluxo: lista sêxtupla da OAB → lista tríplice → escolha) e 4/5 entre Desembargadores dos TRTs, por lista tríplice (quem entrou pelo 1/5 constitucional não concorre a essa vaga). <strong>Órgãos internos</strong>: Tribunal Pleno (órgão máximo), Órgão Especial (só em tribunais com mais de 25 membros — questões administrativas e judiciais de menor complexidade), SDC (Seção de Dissídios Coletivos), SBDI-1 (Seção de Dissídios Individuais), SBDI-2 e Turmas (8 atualmente). Funcionam junto ao TST a Escola Nacional da Magistratura e o CSJT (Conselho Superior da Justiça do Trabalho). Regimento Interno: Lei 7.701/88.</p>
          <p><strong>TRTs</strong>: mínimo 7 juízes por região, nomeados entre 30 e 70 anos (art. 115/CF) — chamados de <strong>desembargadores</strong> por força da Resolução 104/CSJT. Escolha: 1/5 entre advogados/MPT (+10 anos, sem sabatina) e o restante por promoção de juízes do trabalho — antiguidade e merecimento, alternadamente (art. 93, II, "b"/CF; critérios de merecimento na Resolução 106/CNJ). Existe também a Justiça Itinerante / Turma Descentralizada (art. 115/CF).</p>
          <p><strong>Juízes do Trabalho / Varas</strong>: jurisdição exercida por um juiz do trabalho (art. 116/CF). Ingresso por concurso público (art. 93, I/CF; Resolução 75/CNJ). Garantias e deveres dos juízes: art. 95/CF, art. 658/CLT e art. 35 da LOMAN (LC 35/79).</p>
          <p><strong>Serviços auxiliares</strong>: secretarias, secretário de vara, distribuidor, oficial de justiça, peritos e intérpretes.</p>`,
        flashcards:[
          {p:'O que mudou com a EC 24/99 e com a EC 45/2004?', r:'EC 24/99: extinguiu a representação classista. EC 45/2004: ampliou a competência da JT (art. 114/CF).'},
          {p:'Quantos Ministros compõem o TST e como são escolhidos?', r:'27 Ministros. 1/5 entre advogados e membros do MPT com +10 anos de atividade (lista sêxtupla→tríplice); 4/5 entre Desembargadores dos TRTs (lista tríplice), aprovados pelo Senado por maioria absoluta.'},
          {p:'Quais os órgãos internos do TST?', r:'Tribunal Pleno, Órgão Especial (tribunais com +25 membros), SDC, SBDI-1, SBDI-2 e Turmas (8 atualmente).'},
          {p:'Qual o número mínimo de juízes de um TRT e a faixa etária para nomeação?', r:'Mínimo de 7, entre brasileiros com mais de 30 e menos de 70 anos (art. 115/CF).'},
          {p:'Como são escolhidos os desembargadores do TRT que não entram pelo quinto constitucional?', r:'Por promoção de juízes do trabalho, por antiguidade e merecimento, alternadamente (art. 93, II, "b"/CF).'},
          {p:'Por quem é exercida a jurisdição na Vara do Trabalho?', r:'Por um juiz do trabalho (art. 116/CF) — não existe mais "Vara" como órgão da JT no art. 111/CF, apenas "Juízes do Trabalho".'}
        ]},
      { id:'pt-mpt', titulo:'Ministério Público do Trabalho (MPT)',
        resumo:`<h4>Conceito e princípios</h4>
          <p>Instituição permanente, essencial à função jurisdicional do Estado, com a defesa da ordem jurídica, do regime democrático e dos direitos sociais e individuais indisponíveis (art. 127/CF) — cláusula pétrea implícita. <strong>Direito indisponível</strong> é aquele cuja proteção não fica à mercê da vontade do titular. Regra prática: individual + disponível, em regra, não justifica atuação do MP; individual + indisponível pode justificar. <strong>O MP não julga — não pertence ao Poder Judiciário</strong> (este julga; o MP atua na defesa dos interesses que a Constituição lhe atribui, funcionando, na ação penal, como o "acusador", mas na esfera cível/trabalhista sua atuação vai muito além disso).</p>
          <p><strong>Princípios institucionais</strong> (art. 127, §1º/CF): unidade (um só órgão), indivisibilidade (membros substituíveis entre si) e independência funcional (hierarquia apenas administrativa).</p>
          <h4>MPT no MPU</h4>
          <p>Art. 128/CF — o MPU reúne: MPF (federal), <strong>MPT</strong> (trabalho), MPM (militar) e MPDFT.</p>
          <h4>Formas de atuação</h4>
          <ul>
            <li><strong>Judicial</strong> (art. 83 da LC 75/93): como <em>órgão agente</em> (propõe ACP, ação anulatória, dissídio coletivo de greve) ou <em>órgão interveniente/custos legis</em> (fiscal da lei).</li>
            <li><strong>Extrajudicial</strong> (art. 84 da LC 75/93): <em>Inquérito Civil Público</em> (investigativo, privativo do MPT, sem contraditório) e <em>Termo de Ajuste de Conduta — TAC</em> (pacto com fixação de prazos e condições, título executivo extrajudicial, art. 876/CLT).</li>
          </ul>
          <h4>Outras matérias envolvendo o MPT</h4>
          <ul>
            <li>No <strong>procedimento sumaríssimo</strong>, o parecer do MPT é oral (art. 895, §1º, III/CLT).</li>
            <li>O MPT tem direito a <strong>ciência pessoal</strong> das decisões (art. 84, IV, da LC 75/93).</li>
            <li>Jurisprudência do TST citada com frequência ligada ao MPT: <strong>Súmula 100, VI</strong> (prazo de ação rescisória) e <strong>Súmula 407</strong> (hipótese de cabimento de ação rescisória) — e as <strong>OJs da SBDI-1</strong> nº 130 (prescrição), 237 e 338 (concurso) e 350 (arguição de nulidade).</li>
          </ul>`,
        flashcards:[
          {p:'Quais os 3 princípios institucionais do MP (art. 127, §1º/CF)?', r:'Unidade, indivisibilidade e independência funcional.'},
          {p:'Quais os ramos do MPU (art. 128/CF)?', r:'MPF (federal), MPT (trabalho), MPM (militar) e MPDFT.'},
          {p:'Diferença entre órgão agente e órgão interveniente do MPT?', r:'Órgão agente: propõe a ação (ACP, anulatória, dissídio coletivo). Órgão interveniente: atua como fiscal da lei (custos legis).'},
          {p:'O que é o TAC e qual sua natureza jurídica?', r:'Termo de Ajuste de Conduta — pacto entre MPT e infrator fixando prazos/condições para regularização; natureza de confissão com compromisso; vale como título executivo extrajudicial (art. 876/CLT).'}
        ]},
      { id:'pt-competencia', titulo:'Competência da Justiça do Trabalho (art. 114/CF)',
        resumo:`<p>Desde a EC 45/2004, o critério é a <strong>relação de trabalho</strong> (natureza da lide, direito material), e não mais a condição de empregado/empregador — a expressão "relação de trabalho" surgiu com essa emenda (Tema 1.389/STF). O juiz do trabalho passa a ser o "juiz natural do mundo do trabalho". <strong>Conceito de relação de trabalho</strong>: prestação de serviço sem os requisitos da relação de emprego, com continuidade, por pessoa natural, subordinada ou autônoma, habitual ou eventual (ex.: autônomo, avulso, estagiário, corretor). A conciliação, embora não conste do <em>caput</em> do art. 114, também é competência da JT.</p>
          <h4>Exceções firmadas pelo STF (limitação da competência)</h4>
          <p>Competência criminal (ADIN 3684), servidor público estatutário (ADIN 3395), trabalho temporário (art. 37, IX/CF), previdência complementar (art. 202/CF; art. 876, <em>caput</em>/CLT) e representante comercial autônomo (RE 606.003 — Tema 550/STF). Decisões recentes do STF sobre os limites da competência: ADI 3961, ADI 5625, ADC 48, Tema 725, ADPF 324.</p>
          <h4>Inciso I — entes de direito público e organismos internacionais</h4>
          <ul>
            <li><strong>Estados soberanos</strong>: têm imunidade de jurisdição para <em>atos de império</em> (ex.: assinatura de tratados), mas não para <em>atos de gestão</em> (ex.: contratação de mão de obra em embaixada). Têm <strong>imunidade de execução absoluta</strong> (art. 34 da Convenção de Viena) sobre bens vinculados à representação diplomática — "ganha, mas não leva" (RE 222.368-4).</li>
            <li><strong>Organismos internacionais</strong>: OJ 416/SBDI-1 do TST, seguindo o entendimento do STF.</li>
            <li><strong>Pessoas jurídicas de direito público interno</strong> (Administração direta e indireta): quando o vínculo é regido pela CLT (ADIN 3395-0).</li>
          </ul>
          <h4>Inciso II — direito de greve</h4>
          <ul>
            <li>Reconhecido desde a CF/46; assegurado pelo art. 9º da CF vigente e regulado pela <strong>Lei 7.783/89</strong>.</li>
            <li><strong>Setor público</strong>: aplica-se a lei do setor privado por analogia (art. 37, VII/CF — MI 708, Rel. Min. Gilmar Mendes, 2007).</li>
            <li><strong>SV 23/STF</strong>: a JT é competente para julgar ações possessórias (ex.: interdito proibitório), indenizatórias e obrigações de fazer decorrentes do exercício do direito de greve por trabalhadores da iniciativa privada.</li>
            <li><strong>Dissídio coletivo de greve</strong> (art. 114, §3º/CF): a <strong>abusividade da greve</strong> é aferida pelo cumprimento dos requisitos da Lei 7.783/89 — tentativa prévia de negociação (art. 3º), deliberação em assembleia da categoria e comunicação prévia ao empregador e à comunidade. Se abusiva, os direitos pleiteados no movimento não são devidos (OJ 10/SDC-TST: "greve abusiva não gera efeitos"). Antes da EC 45/2004, questões individuais sobre greve eram julgadas pela Justiça Comum.</li>
          </ul>
          <h4>Inciso III — representação sindical</h4>
          <ul>
            <li><strong>Lides intersindicais</strong>: entre sindicatos — representação, unicidade sindical, federações (ex.: qual sindicato representa uma categoria).</li>
            <li><strong>Lides intrassindicais</strong>: criação/registro de sindicato, eleições sindicais, relação com associado.</li>
            <li><strong>Contribuições</strong>: confederativa (art. 8º, IV/CF), assistencial, sindical — hoje facultativa (art. 578 e ss./CLT; ADI 5794 confirmou a constitucionalidade dessa mudança) e do sindicalizado.</li>
          </ul>
          <h4>Inciso IV — habeas corpus, mandado de segurança, habeas data e competência criminal</h4>
          <ul>
            <li><strong>SV 25/STF</strong>: é ilícita a prisão civil do depositário infiel (auxiliar do juízo), qualquer que seja a modalidade de depósito (art. 7º, 7 do Pacto de São José da Costa Rica) — ele responde civilmente pelos prejuízos, sem prejuízo de responsabilidade penal e sanção por ato atentatório à dignidade da justiça (art. 161, parágrafo único/CPC).</li>
            <li><strong>Mandado de segurança</strong>: ampliado na JT (art. 5º, LXIX/CF; Lei 12.016/2009) contra atos de auditores fiscais, superintendentes do MTE, registradores de cartório de PJ e o MPT em Inquérito Civil Público. Desde a EC 45/2004, pode ser impetrado já em 1º grau (antes só no Tribunal).</li>
            <li><strong>Competência criminal</strong> (ADIN 3684-DF): crimes contra a organização do trabalho (de forma coletiva) e falso testemunho no processo do trabalho são julgados pela <strong>Justiça Federal</strong>, não pela JT (Súmula 165/STJ; art. 109, VI/CF).</li>
            <li><strong>Habeas data</strong>: art. 5º, LXXII/CF e Lei 9.507/97.</li>
          </ul>
          <h4>Inciso V — conflitos de competência</h4>
          <p>Na JT fala-se em conflito de <strong>competência</strong>, não de jurisdição. Definição: arts. 804/CLT e 66, III, parágrafo único/CPC. Regra geral do art. 808/CLT não se aplica literalmente: quando o conflito envolve segmentos diferentes da Justiça, quem decide é o <strong>STJ</strong> (ex.: TRT x TJ) — ressalva do art. 105, I, "d"/CF; quando envolve órgãos da própria JT em regiões diferentes (ex.: TRT-SP x TRT-MG), quem decide é o <strong>TST</strong> — ressalva do art. 102, I, "o"/CF (competência do STF só nas hipóteses expressamente ressalvadas).</p>
          <h4>Hierarquia funcional — Súmula 420/TST</h4>
          <p>Não se configura conflito de competência entre um Tribunal e a Vara a ele vinculada, nem entre TRT e TST (art. 803/CLT).</p>
          <h4>Inciso VI — dano moral e material</h4>
          <blockquote><strong>Súmula 392/TST</strong> (redação atual): a JT é competente para processar e julgar ações de indenização por dano moral e material decorrentes da relação de trabalho, inclusive as oriundas de acidente de trabalho e doenças equiparadas, <strong>ainda que propostas pelos dependentes ou sucessores do trabalhador falecido</strong> — a atualização veio para se adequar ao RE 600.091/MG (Tema 242/STF), que considerou irrelevante, para fins de competência, que os autores sejam sucessores, já que a causa de pedir continua sendo o infortúnio ocorrido na relação de trabalho.</blockquote>
          <p>Reforçada pela <strong>SV 22/STF</strong> quanto a acidente de trabalho. <strong>ADIs 6050/6069/6082</strong>: os limites do art. 223-A a G/CLT para o valor da indenização por dano moral são <em>parâmetro</em>, não teto rígido (interpretação conforme a Constituição). <strong>Dano moral pré-contratual</strong> (RE 960.429 — Tema 992/STF): é da <strong>Justiça Comum</strong>, não da JT, por ainda não existir relação de trabalho.</p>
          <h4>Inciso VII — penalidades administrativas aos empregadores</h4>
          <p>Antes era julgado pela Justiça Federal (União no polo passivo). Hoje, compete à JT julgar ações declaratórias, anulatórias e mandados de segurança contra a autuação; a execução fiscal segue a Lei 6.830/80. Fluxo: fiscalização do Ministério do Trabalho → orientação para regularizar → autuação se não corrigido → inscrição em Dívida Ativa → execução (competência da JT).</p>
          <h4>Inciso VIII — execução de ofício das contribuições previdenciárias</h4>
          <p>Regulamentado pelos arts. 831 e 832/CLT (decisão proferida após frustrada a conciliação; o termo de conciliação vale como decisão irrecorrível, salvo para a Previdência quanto às contribuições devidas — Súmula 259/TST). <strong>SV 53/STF</strong>: a execução de ofício das contribuições previdenciárias pela JT se restringe aos valores decorrentes de condenações ou acordos por ela homologados (nova leitura do art. 876/CLT).</p>
          <h4>Inciso IX — outras controvérsias decorrentes da relação de trabalho</h4>
          <p>Rol ampliável por lei (ampliação pela via legislativa). Abrange a <strong>homologação de acordo extrajudicial</strong> (art. 652, "f" e art. 855-B a E/CLT) e a <strong>pequena empreitada</strong> (art. 652, "a", III/CLT — ex.: pedreiro, pintor).</p>
          <h4>§§1º, 2º e 3º — poder normativo e dissídio coletivo</h4>
          <p>Frustrada a negociação coletiva, as partes podem eleger árbitros (§1º); recusando-se à negociação/arbitragem, podem, <strong>de comum acordo</strong>, ajuizar dissídio coletivo de natureza econômica (§2º, incluído pela EC 45/2004 — critica-se como regra atípica, que fragiliza o poder normativo e contraria a lógica de acesso à justiça, pois normalmente uma só parte provoca a jurisdição). Em greve de atividade essencial com risco ao interesse público, o <strong>MPT</strong> pode ajuizar dissídio coletivo mesmo sem esse "comum acordo" (§3º). O STF (28/05/2020), ao julgar improcedentes as ADIs 3423, 3392, 3431, 3432 e 3520, confirmou a <strong>constitucionalidade do §2º</strong>, entendendo tratar-se de norma de procedimento/condição da ação que fomenta a negociação coletiva (Convenção 154 da OIT).</p>
          <h4>Competência funcional e territorial</h4>
          <p><strong>Funcional</strong>: absoluta; inicia-se, em regra, nas Varas do Trabalho (competência originária) — previsão no Regimento Interno, art. 652/CLT (Varas), arts. 678-679/CLT (TRTs) e Lei 7.701/88 (TST).</p>
          <p><strong>Territorial</strong> (art. 651/CLT — norma de ordem pública, mas de natureza relativa): não pode ser conhecida ou declarada de ofício (Súmula 33/STJ; OJ 149/SDI-2-TST). Regra geral (<em>caput</em>): local da prestação de serviços, ainda que a contratação tenha ocorrido em outro local ou no exterior. <strong>§1º</strong>: para agente/viajante comercial, competência da localidade da agência/filial a que estiver subordinado, ou do domicílio do empregado na falta dela. <strong>§2º</strong>: estende-se a dissídios ocorridos em agência/filial no exterior, se o empregado for brasileiro (art. 3º da Lei 7.064/82 permite aplicar a lei mais favorável). <strong>§3º</strong>: se o empregador atua fora do local do contrato, o empregado pode reclamar no foro da celebração do contrato <strong>ou</strong> no da prestação dos serviços.</p>
          <blockquote><strong>Tema 215/TST</strong> (julgamento em 19/08/2026): a regra do art. 651/CLT pode ser excepcionalmente flexibilizada, em nome do acesso à Justiça e da ampla defesa, para admitir o ajuizamento no domicílio do trabalhador — independentemente do porte/âmbito do empregador — sempre que o foro legal tornar o acesso à Justiça inviável ou desproporcionalmente oneroso, exigindo fundamentação específica quanto às circunstâncias concretas (ex.: limitação de locomoção por doença ocupacional, vulnerabilidade agravada do migrante rural). A mera hipossuficiência econômica presumida, isoladamente, <strong>não basta</strong> para essa exceção — deve-se sempre garantir o direito de defesa da parte contrária.</blockquote>`,
        flashcards:[
          {p:'Qual o critério para fixar a competência da JT após a EC 45/2004?', r:'A relação de trabalho (natureza da lide), não mais a condição de empregado/empregador.'},
          {p:'Cite 3 exceções à competência da JT reconhecidas pelo STF.', r:'Competência criminal (ADIN 3684), servidor público estatutário (ADIN 3395) e trabalho temporário (art. 37, IX/CF).'},
          {p:'Qual a diferença entre atos de império e atos de gestão de Estados soberanos, quanto à imunidade de jurisdição?', r:'Atos de império (ex.: tratados) têm imunidade; atos de gestão (ex.: contratação de mão de obra) não têm imunidade de jurisdição.'},
          {p:'O que diz a Súmula Vinculante 23/STF sobre greve?', r:'A Justiça do Trabalho é competente para julgar ação possessória, indenizatória e de obrigação de fazer decorrente do exercício do direito de greve por trabalhadores da iniciativa privada.'},
          {p:'Quais os requisitos da Lei 7.783/89 para que a greve não seja considerada abusiva?', r:'Tentativa prévia de negociação, deliberação em assembleia da categoria e comunicação prévia ao empregador e à comunidade.'},
          {p:'Quando um conflito de competência entre TRT e TJ é decidido, quem julga? E entre dois TRTs?', r:'TRT x TJ: julga o STJ. TRT x TRT: julga o TST.'},
          {p:'O que estabelece a Súmula 420/TST sobre conflito de competência?', r:'Não se configura conflito de competência entre um Tribunal e a Vara a ele vinculada, nem entre TRT e TST.'},
          {p:'A quem compete julgar dano moral pré-contratual, segundo o Tema 992/STF?', r:'À Justiça Comum, não à JT, pois ainda não existe relação de trabalho.'},
          {p:'O que a Súmula Vinculante 53/STF limitou quanto à execução de contribuições previdenciárias pela JT?', r:'Restringiu essa execução de ofício aos valores decorrentes de condenações ou acordos homologados pela própria JT.'},
          {p:'A incompetência territorial pode ser reconhecida de ofício pelo juiz?', r:'Não — é competência relativa (Súmula 33/STJ).'},
          {p:'O que decidiu o Tema 215/TST (2026) sobre competência territorial e domicílio do trabalhador?', r:'A regra do art. 651/CLT pode ser excepcionalmente flexibilizada para admitir ajuizamento no domicílio do trabalhador, quando o foro legal tornar o acesso à Justiça inviável ou desproporcionalmente oneroso, com fundamentação específica — a mera hipossuficiência econômica presumida não basta.'},
          {p:'O que o STF decidiu em 2020 sobre a exigência de "comum acordo" para o dissídio coletivo (art. 114, §2º/CF)?', r:'Confirmou a constitucionalidade da exigência, por maioria, entendendo tratar-se de norma de procedimento/condição da ação que fomenta a negociação coletiva.'}
        ]},
      { id:'pt-atos-comunicacao-prazos', titulo:'Atos Processuais, Comunicação e Prazos',
        resumo:`<h4>Atos processuais (art. 770/CLT)</h4>
          <p>São atos voluntários praticados no processo (pelas partes, juiz, auxiliares e terceiros) — diferem dos fatos, que são involuntários. Regra: <strong>públicos</strong> (exceção: segredo de justiça — art. 189, I e III/CPC), praticados das <strong>6h às 20h</strong> (exceção: PJe, até 24h do último dia do prazo, art. 213/CPC).</p>
          <p><strong>Classificação</strong>: atos das partes (arts. 200-202/CPC); <strong>pronunciamentos do juiz</strong> — <strong>sentença</strong> (põe fim à fase cognitiva ou extingue a execução, arts. 485/487/CPC; a CLT fala apenas em "decisão"), <strong>decisão interlocutória</strong> (qualquer pronunciamento decisório que não seja sentença) e <strong>despacho</strong> (demais pronunciamentos, de ofício ou a requerimento — os atos meramente ordinatórios, como juntada, independem de despacho); atos dos auxiliares do juízo (arts. 710-721/CLT); <strong>negócio processual/calendarização</strong> (arts. 190-191/CPC — a CLT não previa, mas o TST tem admitido: possível pactuar sustentação oral, dispensa de assistente técnico; impossível dispor sobre competência absoluta ou dispensa de manifestação do MPT); e os atos praticados via <strong>PJe</strong> (Lei 11.419/2006).</p>
          <h4>Comunicação dos atos processuais</h4>
          <p>Finalidade: dar ciência aos sujeitos do processo sobre determinado ato — é a concretização dos princípios do <strong>contraditório</strong> e da <strong>publicidade</strong>. Na Justiça do Trabalho existem 3 formas de comunicação, cada uma com regime próprio: <strong>notificação, intimação e citação</strong>.</p>
          <p><strong>1) Notificação</strong> (art. 841/CLT, com o §3º acrescentado; arts. 18 e 19, §4º da Resolução 185/241 do CSJT):</p>
          <ul>
            <li><em>Esclarecimentos sobre o meio material</em>: <strong>franquia</strong> — a isenção de despesas postais que a JT tinha para notificar foi <strong>revogada pela Lei 6.358/78</strong> (hoje a JT paga o serviço postal normalmente); <strong>registro</strong> — carta com aviso de recebimento (AR) ou SEED (serviço especial de entrega de documento judicial dos Correios); <strong>e-carta</strong> — modalidade com rastreamento eletrônico da correspondência.</li>
            <li><em>Objetivos/características</em>: dá ciência da reclamação, da audiência e da necessidade de apresentar defesa; <strong>dispensa despacho prévio do juiz</strong> para ser expedida; é considerada <strong>cumprida</strong> assim que enviada ao endereço da parte constante dos autos, independentemente de efetivo recebimento (art. 248, §2º/CPC); havendo embaraço (a parte não é localizada), expede-se <strong>edital</strong>, com apoio do oficial de justiça.</li>
            <li><em>Peculiaridades</em> (aplicação subsidiária do CPC): arts. 242, §3º; 245, <em>caput</em> e parágrafos; 246, §1º-A; e 252 a 255 (que tratam da notificação/intimação por <strong>hora certa</strong>, quando há indício de ocultação da parte).</li>
          </ul>
          <p><strong>2) Intimação</strong> (pode ocorrer por citação em comarcas contíguas feita pelo oficial de justiça — art. 255/CPC e art. 1º da Portaria 7.156/CGJ/2022, que define comarca contígua como a área geográfica fronteiriça, de fácil comunicação, mesmo que abranja apenas parte da comarca vizinha). Formas:</p>
          <ol>
            <li><strong>Meio eletrônico</strong> (art. 5º, §§1º a 3º, e art. 9º da Lei 11.419/2006).</li>
            <li><strong>Publicação no órgão oficial</strong> (art. 4º, §§2º a 4º, da Lei 11.419/2006; art. 224, §§2º e 3º/CPC).</li>
            <li><strong>Via postal</strong> — Súmula 16/TST (presunção de recebimento da notificação enviada por essa via), com fundamento no art. 774, parágrafo único/CLT.</li>
            <li><strong>Pessoal</strong> — obrigatória, por exemplo, para o MPT (art. 84, IV, da LC 75/93).</li>
          </ol>
          <p><strong>3) Citação</strong> (art. 880/CLT; há também referência ao termo "citação" no art. 852-B, II, para o rito sumaríssimo): é a forma de comunicação típica da <strong>fase de execução</strong>. Há discussão na jurisprudência sobre a exigência (ou não) de que seja necessariamente <strong>pessoal</strong>.</p>
          <h4>Prazos processuais</h4>
          <p><strong>Classificação</strong>: quanto à origem (legal, judicial, convencional); quanto à natureza (dilatórios ou <strong>peremptórios</strong> — art. 222/CPC permite prorrogação por até 2 meses); quanto ao destinatário (<strong>próprios</strong> — partes, sujeitos a preclusão; <strong>impróprios</strong> — juiz e auxiliares).</p>
          <p><strong>Contagem</strong>: em dias úteis (art. 775/CLT e art. 219/CPC); inicia-se com a ciência do ato (intimação/publicação, art. 774/CLT) e a contagem começa no dia seguinte (art. 775/CLT). O juiz pode prorrogar prazos por força maior ou alterar a ordem de produção de provas. Notificação por via postal: presunção de recebimento em 2 dias (Súmula 16/TST) — não se conta em horas (art. 132, §4º/CC). Diário eletrônico: distingue-se dia da divulgação e dia da publicação (art. 224, §§2º/3º do CPC).</p>
          <p><strong>Paralisação dos prazos</strong>: <em>suspensão</em> — o prazo para e retoma de onde parou (Súmula 262, II/TST; art. 775-A/CLT — recesso forense de <strong>20/12 a 20/01</strong>, inclusive; já o recesso do Judiciário federal, que se equipara a feriado, vai de <strong>20/12 a 06/01</strong>, art. 62, I, da Lei 5.010/66) x <em>interrupção</em> — o prazo para e é devolvido por inteiro (ex.: embargos de declaração tempestivos, art. 897-A, §3º/CLT).</p>
          <p><strong>Prazo em dobro</strong>: Fazenda Pública (art. 183, <em>caput</em>/CPC; Decreto-Lei 779/69) e Ministério Público, atuando como <em>custos legis</em> ou como órgão agente.</p>`,
        flashcards:[
          {p:'Quais as 3 formas de comunicação de atos na CLT?', r:'Notificação, intimação e citação.'},
          {p:'O que era a "franquia" na notificação trabalhista, e ela ainda existe?', r:'Era a isenção de despesas postais da JT para notificar — foi revogada pela Lei 6.358/78.'},
          {p:'A expedição de uma notificação depende de despacho prévio do juiz?', r:'Não — a notificação dispensa despacho prévio.'},
          {p:'Quando se considera cumprida a notificação enviada ao endereço da parte?', r:'Assim que enviada, independentemente do efetivo recebimento (art. 248, §2º/CPC).'},
          {p:'O que ocorre se a parte não for localizada para notificação (embaraço)?', r:'Expede-se edital, com apoio do oficial de justiça.'},
          {p:'Quais as 4 formas de intimação na Justiça do Trabalho?', r:'Meio eletrônico, publicação no órgão oficial, via postal (Súmula 16/TST) e pessoal (ex.: obrigatória para o MPT).'},
          {p:'Em qual fase do processo a citação (art. 880/CLT) é típica?', r:'Na fase de execução.'},
          {p:'Qual a diferença entre sentença, decisão interlocutória e despacho?', r:'Sentença: põe fim à fase cognitiva ou extingue a execução. Decisão interlocutória: pronunciamento decisório que não é sentença. Despacho: os demais pronunciamentos do juiz no processo.'},
          {p:'O que é possível e o que é impossível em negócio processual (calendarização) no processo do trabalho?', r:'Possível: sustentação oral, dispensa de assistente técnico. Impossível: dispor sobre competência absoluta ou dispensar a manifestação do MPT.'},
          {p:'Diferença entre suspensão e interrupção de prazo?', r:'Suspensão: o prazo para e retoma de onde parou. Interrupção: o prazo para e recomeça a contar do zero (ex.: embargos de declaração tempestivos).'},
          {p:'Como e quando se conta o prazo processual trabalhista?', r:'Em dias úteis (art. 775/CLT), começando no dia seguinte à ciência do ato.'},
          {p:'Qual o período do recesso forense do art. 775-A da CLT, e qual o do recesso do Judiciário federal pela Lei 5.010/66?', r:'CLT (art. 775-A): 20/12 a 20/01. Lei 5.010/66 (art. 62, I): 20/12 a 06/01.'},
          {p:'Quem tem prazo em dobro no processo do trabalho?', r:'Fazenda Pública (art. 183/CPC; DL 779/69) e Ministério Público, atuando como custos legis ou órgão agente.'},
          {p:'Qual a presunção da Súmula 16/TST?', r:'Presunção de recebimento da notificação enviada por via postal ao endereço da parte, em 2 dias.'}
        ]},
      { id:'pt-partes-honorarios', titulo:'Partes, Procuradores e Honorários',
        resumo:`<h4>Capacidades</h4>
          <ul>
            <li><em>Legitimatio ad causam</em>: capacidade de ser parte.</li>
            <li><em>Legitimatio ad processum</em>: capacidade de estar em juízo.</li>
            <li><em>Jus postulandi</em>: capacidade postulatória — regra no processo do trabalho (art. 791, caput/CLT), com exceções (Súmula 425/TST; art. 855-B/CLT).</li>
          </ul>
          <h4>Representação</h4>
          <p>Dissídios individuais: sindicato ou advogado (art. 791, §1º/CLT). Dissídios coletivos: assistência obrigatória por advogado (§2º). Mandato tácito é admitido (§3º).</p>
          <p><strong>Particularidades sobre representação/procuração</strong>: <strong>Súmula 436/TST</strong> — a União, Estados, Municípios e o DF, suas autarquias e fundações, quando representados por procuradores, estão dispensados de juntar instrumento de mandato ou comprovar a nomeação, bastando que o signatário se declare exercente do cargo (não basta indicar o nº de inscrição na OAB). <strong>Súmula 456/TST</strong> — é inválido o instrumento de mandato firmado em nome de pessoa jurídica que não contenha, ao menos, o nome do outorgante e do signatário da procuração.</p>
          <p><strong>Art. 793/CLT</strong>: a reclamação trabalhista do menor de 18 anos é feita por seus representantes legais e, na falta, pela Procuradoria da Justiça do Trabalho, pelo sindicato, pelo MP estadual ou por curador nomeado em juízo (hipótese em que o MP atua como órgão agente).</p>
          <h4>Honorários advocatícios de sucumbência (art. 791-A/CLT)</h4>
          <p><strong>Percentual</strong>: 5% a 15% sobre liquidação da sentença, proveito econômico ou valor atualizado da causa (percentuais diferenciados — art. 85, §2º/CPC). <strong>Possibilidades de pagamento</strong> (§1º): também cabíveis em ações contra a Fazenda Pública e em caso de assistência/substituição processual pelo sindicato. <strong>Critérios de fixação</strong> (§2º): zelo, lugar da prestação de serviço, natureza/importância da causa, trabalho e tempo despendidos. <strong>Procedência parcial</strong> (§3º): honorários recíprocos, vedada compensação. <strong>Justiça gratuita</strong> (§4º): o STF (ADI 5766) declarou inconstitucional cobrar honorários do beneficiário que não tenha condições de pagar mesmo que receba algum valor no processo — a exigibilidade fica sob condição suspensiva por 2 anos, cabendo ao credor demonstrar que o devedor deixou de ser hipossuficiente; passado esse prazo sem isso, extinguem-se as obrigações do beneficiário. <strong>Reconvenção</strong> (§5º): também são devidos honorários de sucumbência na reconvenção.</p>
          <h4>Responsabilidade por dano processual — litigância de má-fé</h4>
          <p>Fundamento: boa-fé objetiva e vedação ao abuso processual (arts. 77 e 78/CPC; arts. 793-B a 793-D/CLT). Responsabilidade é <strong>apenas das partes</strong>; fixação de multa e indenização (art. 793-C/CLT); também há multa à <strong>testemunha</strong> que falta com a verdade (art. 793-D e parágrafo único) — o que, somado ao crime de falso testemunho (art. 342/CP, "fazer afirmação falsa, ou negar ou calar a verdade"), gera discussão sobre dupla punição pelo mesmo fato.</p>`,
        flashcards:[
          {p:'O que é jus postulandi e quais suas 2 principais exceções?', r:'Capacidade de a parte postular sem advogado. Exceções: Súmula 425/TST e homologação de acordo extrajudicial (art. 855-B/CLT).'},
          {p:'O que dispensa a Súmula 436/TST para os procuradores de entes públicos?', r:'Dispensa a juntada de instrumento de mandato e a comprovação da nomeação, bastando que o signatário se declare exercente do cargo de procurador.'},
          {p:'O que exige a Súmula 456/TST para a validade de procuração em nome de pessoa jurídica?', r:'Que conste, ao menos, o nome do outorgante e do signatário da procuração.'},
          {p:'Quem pode ajuizar reclamação trabalhista em nome de menor de 18 anos, na falta dos representantes legais (art. 793/CLT)?', r:'A Procuradoria da Justiça do Trabalho, o sindicato, o MP estadual ou curador nomeado em juízo.'},
          {p:'Qual a faixa percentual dos honorários de sucumbência na CLT?', r:'5% a 15%, sobre liquidação da sentença, proveito econômico ou valor atualizado da causa (art. 791-A/CLT).'},
          {p:'O que o STF decidiu na ADI 5766 sobre justiça gratuita e honorários?', r:'Declarou inconstitucional responsabilizar o beneficiário da justiça gratuita pelo pagamento de honorários, mesmo que receba algum valor no processo; a exigibilidade fica suspensa por 2 anos.'},
          {p:'Em caso de procedência parcial, o que ocorre com os honorários?', r:'São recíprocos, mas é vedada a compensação entre eles.'},
          {p:'A testemunha que falta com a verdade pode sofrer dupla punição?', r:'Há discussão: pode ser multada no processo (art. 793-D/CLT) e ainda responder pelo crime de falso testemunho (art. 342/CP).'}
        ]},
      { id:'pt-nulidades', titulo:'Nulidades Processuais',
        resumo:`<p><strong>Nulidade</strong> é a consequência do defeito na prática de um ato processual. A regra geral é a <em>não</em> declaração de nulidade (prevalece o aproveitamento do ato).</p>
          <h4>Gradação da gravidade do defeito</h4>
          <ul>
            <li><strong>Inexistente</strong>: ex. ausência de citação.</li>
            <li><strong>Nulidade absoluta</strong>: ex. incompetência absoluta, impedimento do juiz.</li>
            <li><strong>Nulidade relativa</strong>: ex. incompetência relativa, suspeição.</li>
            <li><strong>Mera irregularidade</strong>: princípio da insignificância — não gera nulidade.</li>
          </ul>
          <h4>Princípios das nulidades</h4>
          <ul>
            <li><strong>Prejuízo ou transcendência</strong> (art. 794/CLT): só há nulidade se houver prejuízo comprovado.</li>
            <li><strong>Instrumentalidade ou finalidade</strong> (arts. 118 e 277/CPC): o ato que atinge sua finalidade não é anulado, ainda que praticado de forma diferente da prevista.</li>
            <li><strong>Convalidação ou preclusão</strong> (art. 852-F e 795, §1º/CLT): a nulidade não arguida no momento oportuno se convalida.</li>
            <li><strong>Aproveitamento do ato (sanabilidade)</strong> (art. 797/CLT).</li>
            <li>Possibilidade de sanar a nulidade pelo próprio Tribunal (art. 938, §1º/CPC) — antes de anular o processo, o Tribunal deve tentar saná-lo.</li>
            <li>A conversão do rito ordinário para o sumaríssimo (ou o inverso, na fase recursal/audiência) não é, por si só, causa de nulidade (art. 283/CPC).</li>
          </ul>
          <p><strong>Disciplina legal</strong>: na CLT, arts. 794 a 798; no CPC, arts. 276 a 283 (aplicação subsidiária).</p>`,
        flashcards:[
          {p:'Qual a regra geral em matéria de nulidade processual?', r:'A não declaração da nulidade — prevalece o aproveitamento do ato processual.'},
          {p:'Dê um exemplo de nulidade absoluta e um de nulidade relativa.', r:'Absoluta: incompetência absoluta ou impedimento do juiz. Relativa: incompetência relativa ou suspeição.'},
          {p:'O que diz o princípio do prejuízo ou transcendência?', r:'Só se declara nulidade se houver prejuízo efetivo — art. 794/CLT.'},
          {p:'O que acontece se a parte não arguir a nulidade no momento oportuno?', r:'Ocorre a convalidação/preclusão — arts. 852-F e 795, §1º da CLT.'}
        ]},
      { id:'pt-procedimentos', titulo:'Procedimentos Trabalhistas: Sumário e Sumaríssimo',
        resumo:`<h4>Linha do tempo dos ritos</h4>
          <p>Ordinário (1943) → Sumário (1970, Lei 5584/70) → Sumaríssimo (2000, Lei 9957/2000). Há ainda procedimentos especiais, como o inquérito para apuração de falta grave e a consignação em pagamento.</p>
          <h4>Procedimento Sumário (dissídio de alçada) — art. 2º, §§3º e 4º da Lei 5.584/70</h4>
          <ul>
            <li>Dissídios individuais, com uma única proposta de conciliação.</li>
            <li>Valor da causa fixado pelo juiz antes da instrução (e não pelo autor) — pode ser impugnado, mas se mantido pelo juiz, cabe <strong>pedido de revisão</strong>: recurso especial (fora da regulamentação do art. 893/CLT), prazo de <strong>48 horas</strong>, julgado pelo Presidente do Tribunal em petição instruída com cópia da inicial e da ata de audiência, também em 48 horas.</li>
            <li>O salário mínimo de referência é o da época do ajuizamento (mantido se não houver impugnação); aplicam-se subsidiariamente as normas do sumaríssimo.</li>
            <li>Regra: <strong>nenhum recurso cabível</strong>, mesmo na execução, salvo matéria constitucional (apenas Recurso Extraordinário, art. 102, II/CF — Súmula 640/STF).</li>
          </ul>
          <h4>Jurisprudência sobre a alçada</h4>
          <ul>
            <li><strong>Súmula 71/TST</strong>: a alçada é fixada pelo valor dado à causa no ajuizamento, desde que não impugnado, sendo inalterável no curso do processo.</li>
            <li><strong>Súmula 356/TST</strong>: o art. 2º, §4º da Lei 5.584/70 foi recepcionado pela CF/88, sendo lícita a fixação da alçada com base no salário mínimo.</li>
            <li><strong>Súmula 365/TST</strong>: a alçada não se aplica em ação rescisória e em mandado de segurança.</li>
          </ul>
          <h4>Procedimento Sumaríssimo (Lei 9957/2000, art. 852-A a I/CLT)</h4>
          <ul>
            <li>Inspirado no juizado especial (complementado subsidiariamente pela Lei 9.099/95); a mudança de rito ocorre só na fase de conhecimento, sem alterar a execução. Aplicável a dissídio individual <strong>inferior a 40 salários mínimos</strong>, de forma imperativa (art. 852-A) — discute-se se essa imperatividade fere a isonomia ou se é legítima fixação de limites processuais.</li>
            <li>Pedido deve ser certo <strong>ou</strong> determinado, com indicação de valor — pela <strong>Tese Jurídica Prevalecente 16 do TRT da 3ª Região</strong>, os valores indicados na inicial são apenas estimativos, para fins de definir o rito, e não limitam a apuração das parcelas na liquidação de sentença.</li>
            <li><strong>Audiência única</strong> (art. 852-C), podendo ser cindida, com concentração de toda a prova em audiência (documentos, perícia, até <strong>2 testemunhas</strong>, cujo comparecimento pode ser provado por convite ou carta precatória).</li>
            <li>Condução do processo mais ativa pelo juiz (art. 852-D): determinação dos prazos, definição do ônus da prova, indeferimento de provas, uso das regras de experiência comum/técnica.</li>
            <li>Sentença (art. 852-I) dispensa relatório formal, mas exige resumo dos fatos; proferida na própria audiência ou em até 30 dias úteis.</li>
            <li>Recurso ordinário (art. 895, §1º/CLT): distribuição diária, sem revisor, parecer oral do MPT, e acórdão lavrado em certidão de julgamento.</li>
          </ul>`,
        flashcards:[
          {p:'Qual a ordem cronológica de criação dos ritos trabalhistas?', r:'Ordinário (1943), Sumário (1970), Sumaríssimo (2000).'},
          {p:'No procedimento sumário, qual o prazo e a quem cabe o pedido de revisão do valor da causa?', r:'Prazo de 48 horas, julgado pelo Presidente do Tribunal também em 48 horas, mediante petição instruída com cópia da inicial e da ata de audiência.'},
          {p:'Qual o teto de valor da causa para o rito sumaríssimo?', r:'Dissídio individual inferior a 40 salários mínimos (art. 852-A/CLT), de forma imperativa.'},
          {p:'No procedimento sumário (dissídio de alçada), quais recursos cabem?', r:'Regra geral: nenhum recurso, mesmo na execução, salvo matéria constitucional — apenas Recurso Extraordinário (Súmula 640/STF).'},
          {p:'Segundo a Tese 16 do TRT da 3ª Região, o valor indicado na inicial do rito sumaríssimo limita a condenação?', r:'Não — é apenas estimativo, para fins de definição do rito, não limitando a apuração das parcelas na liquidação de sentença.'},
          {p:'Quantas testemunhas são admitidas no rito sumaríssimo?', r:'2 testemunhas.'},
          {p:'A sentença do rito sumaríssimo dispensa o relatório?', r:'Sim, formalmente dispensa relatório, mas exige resumo dos fatos (art. 852-I/CLT).'},
          {p:'Como é lavrado o acórdão do recurso ordinário no rito sumaríssimo?', r:'Em certidão de julgamento, com distribuição diária, sem revisor e com parecer oral do MPT.'}
        ]},
      { id:'pt-conducao-coercitiva', titulo:'Posição do STF sobre a Condução Coercitiva',
        resumo:`<p>Julgado de referência: <strong>ADPF 395 e 444</strong> (fases policial e judicial), acórdão publicado em 22/05/2019.</p>
          <blockquote>O STF declarou a incompatibilidade com a Constituição Federal da condução coercitiva de investigados ou réus <strong>para interrogatório</strong>, já que o imputado não é legalmente obrigado a participar do ato — e considerou não recepcionada a expressão "para interrogatório" do <strong>art. 260 do CPP</strong>.</blockquote>
          <p><strong>Importante — o que a decisão NÃO alcança:</strong></p>
          <ul>
            <li>Não abrange a condução coercitiva de <strong>testemunhas</strong> (art. 342 do CP tipifica o crime de "calar a verdade" como testemunha).</li>
            <li>O <strong>art. 218 do CPP</strong> (condução coercitiva de testemunha) não foi atingido pela decisão do STF.</li>
            <li>Voto do Min. Gilmar Mendes: há outras hipóteses de condução coercitiva que não foram objeto dessa ação — como a condução de outras pessoas na qualidade de testemunhas, ou atos diversos do interrogatório do investigado.</li>
          </ul>
          <p>Lógica de fundo: a testemunha declara o que sabe sobre o fato, mas não se compromete com as consequências jurídicas dele — por isso pode ser coercitivamente conduzida a depor, diferente do investigado/réu, que tem direito ao silêncio.</p>`,
        flashcards:[
          {p:'O que o STF decidiu sobre condução coercitiva para interrogatório (ADPF 395/444)?', r:'Declarou incompatível com a CF a condução coercitiva de investigados/réus para interrogatório e considerou não recepcionada a expressão "para interrogatório" do art. 260 do CPP.'},
          {p:'A decisão do STF sobre condução coercitiva se aplica a testemunhas?', r:'Não — o art. 218 do CPP (condução coercitiva de testemunha) não foi atingido pela decisão.'},
          {p:'Por que a testemunha pode ser conduzida coercitivamente e o investigado não?', r:'Porque a testemunha apenas declara o que sabe, sem se comprometer com as consequências, enquanto o investigado tem o direito ao silêncio e não é obrigado a participar do interrogatório.'}
        ]}
    ] },
  { id:'direito-familia', numeral:'II', nome:'Direito de Família',
    dates:{ 'AV1':'17/09/26', 'AV2':'29/10/26', 'AV Final':'26/11/26', '2ª chamada':'12/11/26', 'Especial':'10/12/26' },
    temas: [
      { id:'df-conceito-familia', titulo:'Conceito de Família e de Direito de Família',
        resumo:`<h4>Direito de Família</h4>
          <p>Conjunto de normas jurídicas que regulam as múltiplas relações familiares. Integra o Direito Civil, logo o Direito Privado.</p>
          <h4>O que é família?</h4>
          <ul>
            <li><strong>CR/88, art. 226</strong>: a família é a base da sociedade.</li>
            <li><strong>Declaração Universal dos Direitos Humanos (ONU, 1948), art. 16</strong>: núcleo natural e fundamental da sociedade.</li>
            <li>É <strong>fato natural e social</strong> — anterior ao Direito e ao próprio Estado; muda de forma e conteúdo conforme o local e o tempo (daí a dificuldade de um conceito atemporal).</li>
            <li>Torna-se <strong>fato jurídico</strong> ao gerar consequências jurídicas — o Direito se preocupa com a família por ela ser considerada base da sociedade.</li>
          </ul>
          <h4>A "moldura" jurídica da família até 1988</h4>
          <p>Desde a independência do Brasil (1822) até a CR/88, as Constituições reconheciam apenas o <strong>casamento</strong> como forma de família — excluindo uniões informais.</p>
          <blockquote><strong>CR/1967, art. 167</strong>: "A família é constituída pelo casamento e terá direito à proteção dos Poderes Públicos." <strong>CC/1916, art. 229</strong>: "Criando a família legítima, o casamento legitima os filhos comuns, antes dele nascidos ou concebidos."</blockquote>
          <p>O CC/1916 regulava a família em função de um projeto específico: a <strong>família proprietária de bens (burguesa)</strong>, na qual o marido era chefe, em posição superior à mulher e aos filhos.</p>
          <h4>A revolução da CR/88</h4>
          <p>Colocou a pessoa (dignidade da pessoa humana, art. 1º, III) no centro do ordenamento, provocando:</p>
          <ul>
            <li><strong>a) Família plural</strong> (art. 226, §§3º e 4º): casamento deixa de ser sinônimo de família e passa a ser apenas uma espécie de entidade familiar — união estável e família monoparental são expressamente reconhecidas.</li>
            <li><strong>b) Igualdade entre homens e mulheres</strong> (art. 226, §5º).</li>
            <li><strong>c) Igualdade entre os filhos</strong> (art. 227, §6º).</li>
            <li><strong>d) Liberdade</strong> (art. 226, §§6º e 7º): aumento da autonomia privada e diminuição da interferência do Estado na família, manifestada em várias frentes:
              <ul>
                <li>Liberdade para escolher a modalidade de família (STF, RE 878.694/MG — que, em conjunto com o RE 646721, equiparou os regimes sucessórios de cônjuge e companheiro, tanto em uniões hetero quanto homoafetivas).</li>
                <li>Liberdade para escolher com quem formar família (STF, ADI 4277 e ADPF 132, 2011 — união homoafetiva).</li>
                <li>Liberdade para dissolver a entidade familiar sem observar prazo ou pré-requisitos (EC 66/2010).</li>
                <li>Liberdade para escolher o próprio regime de bens, inclusive para maiores de 70 anos (STF, ARE 1.309.642, Tema 1.236, julgado em 2024): o regime de separação obrigatória de bens do art. 1.641, II/CC pode ser afastado por manifestação expressa de vontade das partes, mediante escritura pública (no casamento, exige-se autorização judicial).</li>
              </ul>
            </li>
          </ul>
          <p><strong>Vale lembrar</strong>: o Direito tem por principal função harmonizar as relações sociais.</p>
          <p>A família deixa de ser vista por sua função econômica e passa a valorizar os <strong>laços afetivos</strong> — o respeito aos sentimentos supera a proteção ao patrimônio.</p>
          <h4>Por que veio o CC/2002?</h4>
          <p>O CC/1916, sistema fechado sob influência da Escola da Exegese, tornou-se insuficiente, gerando proliferação de leis esparsas (fragmentação/descodificação). O CC/2002 buscou reunificar o sistema, com técnica de <strong>cláusulas gerais</strong> e forte influência de princípios e valores constitucionais. Tramitou por 26 anos (Projeto de Lei 634/1975, ainda antes da CR/88) até ser sancionado em 2002, entrando em vigor em 11/01/2003 — por isso "nasceu antigo" em alguns pontos.</p>
          <blockquote><strong>Reforma em curso</strong>: uma Comissão de Juristas (presidida pelo Min. Luis Felipe Salomão, do STJ) concluiu, em abril de 2024, um anteprojeto de atualização do Código Civil, entregue ao Senado. Em 31/01/2025 o então presidente do Senado, Rodrigo Pacheco, protocolou esse texto como o <strong>PL 4/2025</strong>, que propõe alterar cerca de 900 artigos e incluir mais de 300 novos dispositivos — tratando também de temas de Direito de Família, além de sucessões, responsabilidade civil e direito digital. Em setembro de 2025 o Senado instalou a comissão temporária para análise do projeto; ainda está em tramitação, sem data de aprovação definida.</blockquote>
          <h4>Concepção contemporânea de família</h4>
          <p><em>Locus</em> (local) para o livre desenvolvimento da personalidade dos seus membros — toda formação social que propicie ambiente para o pleno desenvolvimento das pessoas, com ou sem sexualidade. Elemento principal: a <strong>afetividade</strong> (personalização da família — "ser" maior que o "ter"). Observação histórica: a família como fenômeno social sempre foi plural; o que não era plural era o <em>Direito</em> de Família, que no Brasil só reconheceu a família pelo casamento — primeiro exclusivamente religioso (católico) e, após 1890, exclusivamente civil.</p>
          <h4>Constitucionalização do Direito Civil</h4>
          <p>As leis devem estar em conformidade com a Constituição, especialmente quanto aos direitos fundamentais, todos decorrentes da dignidade da pessoa humana (art. 1º, III/CF).</p>
          <h4>Dinâmica do Direito de Família em Belo Horizonte</h4>
          <p>Justiça Comum Estadual: <strong>12 Varas de Família</strong> e <strong>2 Câmaras Cíveis</strong> (4ª e 8ª).</p>`,
        flashcards:[
          {p:'O que diz o art. 226 da CR/88 sobre a família?', r:'Que a família é a base da sociedade.'},
          {p:'Antes da CR/88, qual era a única forma de família reconhecida no Brasil?', r:'O casamento (CR/1967, art. 167; CC/1916, art. 229).'},
          {p:'Quais as 4 principais mudanças trazidas pela CR/88 no Direito de Família?', r:'Família plural (art. 226, §§3º e 4º), igualdade entre homens e mulheres (art. 226, §5º), igualdade entre os filhos (art. 227, §6º) e liberdade (art. 226, §§6º e 7º).'},
          {p:'Qual o principal elemento da concepção contemporânea de família?', r:'A afetividade (personalização da família).'},
          {p:'Quantas Varas de Família e Câmaras Cíveis de família existem em Belo Horizonte?', r:'12 Varas de Família e 2 Câmaras Cíveis (4ª e 8ª).'},
          {p:'Por que se diz que o CC/2002 "nasceu antigo" em alguns pontos?', r:'Porque tramitou por 26 anos (Projeto de Lei 634/1975) antes de ser sancionado em 2002 e entrar em vigor em 2003.'},
          {p:'O que decidiu o STF no ARE 1.309.642 (Tema 1.236, 2024) sobre regime de bens de maiores de 70 anos?', r:'Que o regime de separação obrigatória de bens (art. 1.641, II/CC) pode ser afastado por manifestação expressa de vontade das partes, mediante escritura pública.'},
          {p:'O que é o PL 4/2025?', r:'O projeto de lei de reforma do Código Civil, baseado em anteprojeto de comissão de juristas presidida pelo Min. Luis Felipe Salomão, protocolado no Senado em janeiro de 2025, propondo alterar cerca de 900 artigos e incluir mais de 300 novos dispositivos.'}
        ]},
      { id:'df-quadro-comparativo', titulo:'Quadro Comparativo: Família no CC/1916 x Atualidade',
        resumo:`<p>Comparação entre a concepção de família no CC/1916 (influência do Código Civil Francês de 1804, individualismo liberal, patrimonialismo) e no CC/2002 e na atualidade (interpretação dos Tribunais Superiores):</p>
          <table style="width:100%; border-collapse:collapse; font-size:0.85rem;">
          <tr style="border-bottom:1px solid #8A6B3B;"><th style="text-align:left; padding:4px;">CC/1916</th><th style="text-align:left; padding:4px;">CC/2002 e atualidade</th><th style="text-align:left; padding:4px;">Princípio associado</th></tr>
          <tr><td style="padding:4px;"><strong>Matrimonializada</strong> (art. 167/CR67; art. 229/CC16)</td><td style="padding:4px;"><strong>Pluralizada</strong> (art. 226, §§3º/4º CF; art. 1.723 CC)</td><td style="padding:4px;">Pluralismo das entidades familiares</td></tr>
          <tr><td style="padding:4px;"><strong>Hierarquizada e patriarcal</strong> (arts. 6º, 233, 242-VII, 380 CC16)</td><td style="padding:4px;"><strong>Igualitária e democrática</strong> (arts. 1.511 e 1.631 CC)</td><td style="padding:4px;">Igualdade</td></tr>
          <tr><td style="padding:4px;"><strong>Filhos legítimos/ilegítimos</strong> (arts. 332, 337 CC16)</td><td style="padding:4px;"><strong>Igualdade entre os filhos</strong> (art. 1.596 CC)</td><td style="padding:4px;">Igualdade</td></tr>
          <tr><td style="padding:4px;"><strong>Heteroafetiva</strong></td><td style="padding:4px;"><strong>Hetero ou homoafetiva</strong> (STF ADI 4277 e ADPF 132/2011; Res. CNJ 175/2013)</td><td style="padding:4px;">Livre desenvolvimento da personalidade</td></tr>
          <tr><td style="padding:4px;"><strong>Biológica</strong> ou socioafetiva restrita à adoção (art. 332 CC16)</td><td style="padding:4px;"><strong>Biológica e/ou socioafetiva — multiparental</strong> (STF RE 898.060; art. 1.593 CC)</td><td style="padding:4px;">Livre desenvolvimento da personalidade / mínima intervenção estatal</td></tr>
          <tr><td style="padding:4px;"><strong>Unidade de produção e reprodução</strong> (patrimonial)</td><td style="padding:4px;"><strong>Unidade socioafetiva</strong> — comunhão de vida (art. 1.511 CC)</td><td style="padding:4px;">—</td></tr>
          <tr><td style="padding:4px;"><strong>Caráter institucional</strong> (casamento indissolúvel — art. 167, §1º CR67)</td><td style="padding:4px;"><strong>Caráter instrumental</strong> (família como instrumento para o pleno desenvolvimento das pessoas — art. 226, caput, CF)</td><td style="padding:4px;">Solidariedade familiar / proteção especial aos vulneráveis</td></tr>
          </table>
          <h4>Jurisprudência-chave por linha do quadro</h4>
          <ul>
            <li><strong>Pluralização — família anaparental</strong>: TJMG reconheceu como núcleo familiar a relação entre irmã e cunhado para fins de auxílio-funeral, por não haver restrição constitucional ao conceito de família (art. 226, §4º/CF, interpretado extensivamente).</li>
            <li><strong>Hetero/homoafetiva — STF, ADI 4277 e ADPF 132 (05/05/2011)</strong>: equiparou a união homoafetiva à união estável heteroafetiva, dando ao art. 1.723/CC interpretação conforme a Constituição. Voto do Min. Marco Aurélio: ninguém pode ser "instrumentalizado" para viabilizar projeto de sociedade alheio baseado em preconceito.</li>
            <li><strong>Multiparentalidade — STF, RE 898.060 (2016, repercussão geral)</strong>: "A paternidade socioafetiva, declarada ou não em registro público, não impede o reconhecimento do vínculo de filiação concomitante baseado na origem biológica, com os efeitos jurídicos próprios."</li>
            <li><strong>Autonomia privada — STF, RE 646721 (2017)</strong>: declarou inconstitucional o art. 1.790/CC (regime sucessório diferenciado do companheiro), equiparando a sucessão entre cônjuges e companheiros — fundamento nos princípios da igualdade, dignidade humana, proporcionalidade e vedação ao retrocesso.</li>
          </ul>`,
        flashcards:[
          {p:'Quais os fundamentos legais da família "pluralizada" no CC/2002?', r:'Art. 226, §§3º e 4º da CF/88 e art. 1.723 do CC.'},
          {p:'O que decidiu o STF na ADI 4277 e ADPF 132 (2011)?', r:'Equiparou a união homoafetiva à união estável heteroafetiva, dando interpretação conforme a Constituição ao art. 1.723 do CC.'},
          {p:'O que estabeleceu o STF no RE 898.060 sobre multiparentalidade?', r:'Que a paternidade socioafetiva não impede o reconhecimento concomitante do vínculo biológico, com efeitos jurídicos próprios de ambos.'},
          {p:'O que o STF decidiu no RE 646721 (2017) sobre sucessão?', r:'Declarou inconstitucional o art. 1.790/CC, que dava direitos sucessórios inferiores ao companheiro em relação ao cônjuge — equiparou os regimes sucessórios.'},
          {p:'O que caracteriza a "família anaparental" segundo julgado do TJMG?', r:'Núcleo familiar formado por parentes sem a presença de ascendentes (ex.: irmã e cunhado), reconhecido por não haver restrição constitucional ao conceito de família.'},
          {p:'Qual o fundamento legal do "caráter instrumental" da família atual?', r:'Art. 226, caput, da CF — a família como instrumento para o pleno desenvolvimento das pessoas que a compõem.'}
        ]},
      { id:'df-evolucao-historica', titulo:'Evolução Histórica da Família e Princípios Contemporâneos',
        resumo:`<h4>A dificuldade de conceituar família</h4>
          <p>A família é objeto de estudo de várias ciências (Biologia, Sociologia, Psicologia, Antropologia) além do Direito. Muitos Códigos e Constituições, no mundo todo, não definem expressamente o termo "família" — a Declaração da ONU (1948, art. XVI, nº 3) apenas afirma que "a família é o núcleo natural e fundamental da sociedade e tem direito à proteção da sociedade e do Estado". Para Philippe Malaurie, não é possível um conceito abstrato e intertemporal de família — deve-se reconhecer a coexistência de vários modelos de família em uma mesma época e lugar (<strong>princípio da pluralidade dos tipos</strong>).</p>
          <h4>Origem e evolução: monogamia e patriarcado</h4>
          <p>Duas grandes teorias sobre a evolução familiar: a <strong>Escola Evolucionista</strong> (evolução progressiva da promiscuidade sexual até a família monogâmica) e a corrente que considera a monogamia a forma originária em culturas primitivas. Duas características marcam a família ocidental: <strong>monogamia</strong> (assegurava a convicção de paternidade, para transmissão de poder/patrimônio) e <strong>patriarcado</strong> (poder do <em>pater familias</em> em Roma — a <em>potestas</em>).</p>
          <p>Na <strong>Grécia</strong>, o homem atuava no espaço público (polis) e a mulher no espaço doméstico (<em>oikia</em>); Aristóteles definia a família como associação natural comandada pelo membro mais velho. Em <strong>Roma</strong>, a família (<em>domus</em>) reunia descendentes, escravos e bens sob a <em>potestas</em> de um único <em>pater familias</em>, que podia inclusive não reconhecer um filho.</p>
          <h4>Marcos legislativos da família contemporânea no Brasil</h4>
          <ul>
            <li><strong>Estatuto da Mulher Casada (Lei 4.121/1962)</strong>: aboliu a incapacidade relativa da mulher casada, tornou facultativo o acréscimo do sobrenome do marido.</li>
            <li><strong>Lei do Divórcio (Lei 6.515/1977)</strong>, após a EC 09/1977: introduziu o divórcio no Brasil (até então o casamento era indissolúvel — refletindo forte influência religiosa) e mudou o regime supletivo de bens de comunhão universal para comunhão parcial.</li>
            <li><strong>CF/88</strong>: ampliou o reconhecimento de família para casamento, união estável e família monoparental.</li>
          </ul>
          <h4>Princípios no Direito de Família contemporâneo</h4>
          <p>A <strong>constitucionalização</strong> inverteu a lógica: antes os direitos fundamentais dependiam da lei (primado da legalidade, positivismo jurídico); hoje as leis devem estar em conformidade com os direitos fundamentais. A insuficiência dos Códigos oitocentistas fechados para resolver todos os conflitos foi chamada por Michele Giorgianni de <strong>"crise da legalidade"</strong>. O CC/2002 buscou reunificar o sistema por meio de <strong>cláusulas gerais</strong> — normas que permitem a incorporação de princípios, padrões de conduta e valores constitucionais, com conteúdo dinâmico construído pelo juiz no caso concreto (Judith Martins-Costa). Nenhum princípio é absoluto — eventual colisão entre princípios se resolve por ponderação de valores no caso concreto.</p>`,
        flashcards:[
          {p:'Quais as duas características centrais da família ocidental na sua evolução histórica?', r:'Monogamia e patriarcado.'},
          {p:'O que aboliu o Estatuto da Mulher Casada (Lei 4.121/1962)?', r:'A incapacidade relativa da mulher casada, tornando facultativo o acréscimo do sobrenome do marido.'},
          {p:'O que mudou com a Lei do Divórcio (Lei 6.515/1977)?', r:'Introduziu o divórcio no Brasil (antes o casamento era indissolúvel) e alterou o regime supletivo de bens de comunhão universal para comunhão parcial.'},
          {p:'O que é a "crise da legalidade" segundo Michele Giorgianni?', r:'A insuficiência da lei/dos Códigos fechados do século XIX como fonte principal do direito para solucionar todos os conflitos.'},
          {p:'O que são cláusulas gerais e qual sua função no CC/2002?', r:'Normas de conteúdo aberto que permitem a incorporação de princípios, valores constitucionais e padrões de conduta, construídos dinamicamente pelo juiz no caso concreto — usadas para reunificar e atualizar o sistema.'},
          {p:'O que defendia Philippe Malaurie sobre o conceito de família?', r:'Que não é possível um conceito abstrato e intertemporal — deve-se reconhecer a coexistência de vários modelos de família em uma mesma época e lugar (princípio da pluralidade dos tipos).'}
        ]},
      { id:'df-autonomia-intervencao', titulo:'Autonomia Privada x Intervenção Estatal no Direito de Família',
